# Default values for the Atlas chart.
# This is a YAML-formatted file. Every value is documented inline.

# -- Container image for the single-binary Atlas server.
image:
  repository: ghcr.io/pblumer/atlas
  # -- Image tag. Empty string falls back to the chart's appVersion.
  # Pin an immutable tag (a release version or a digest) in production.
  tag: ""
  pullPolicy: IfNotPresent

# -- imagePullSecrets for private registries, e.g. [{name: regcred}].
imagePullSecrets: []

# -- Override the generated name (defaults to the chart name).
nameOverride: ""
# -- Override the fully-qualified name (release-name + chart-name).
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount for the pod.
  create: true
  # -- Name to use. Generated from the fullname when empty and create is true.
  name: ""
  # -- Annotations to add to the ServiceAccount (e.g. cloud IAM role bindings).
  annotations: {}

# -- Extra annotations for the pod.
podAnnotations: {}
# -- Extra labels for the pod.
podLabels: {}

# -- Pod-level security context. fsGroup makes the mounted data volume writable
# by the nonroot (uid/gid 65532) user the image runs as.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context. The server writes only under the data
# volume, so the root filesystem can stay read-only. Relax readOnlyRootFilesystem
# if you enable script tasks that need scratch space outside the data dir.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# -- Resource requests/limits. Sized for a small instance; tune for your load.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# -- Scheduling controls.
nodeSelector: {}
tolerations: []
affinity: {}
# -- Extra volumes and volumeMounts (e.g. to mount an external config).
extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  # -- Service port. Also the port the API/UI/MCP are reachable on in-cluster.
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: atlas.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: atlas-tls
  #    hosts:
  #      - atlas.local

# -- Persistent storage for the write-ahead log and state store. Atlas is
# durable and stateful; this MUST be a real PersistentVolume (never emptyDir).
persistence:
  enabled: true
  # -- Mount path inside the container; passed to the server as --data-dir.
  mountPath: /data
  # -- StorageClass; empty uses the cluster default. "-" disables dynamic
  # provisioning and requires a pre-bound PV.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}
  # -- Use an existing PersistentVolumeClaim instead of the volumeClaimTemplate.
  existingClaim: ""

# -- Atlas server configuration. These map to `atlas serve` flags / env vars;
# see cmd/atlas/main.go.
atlas:
  # -- Require login for the API and UI (--auth). When true, an admin is seeded
  # on first run from the credentials below.
  auth:
    enabled: false
    # -- Admin bootstrap credentials (used only when auth.enabled is true and no
    # admin exists yet). Provide them via an existing secret in production.
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    username: admin
    # -- Admin password. Leave empty to require setting via existingSecret;
    # rendering fails loudly if auth is enabled with no password source.
    password: ""

  # -- Encrypted secret vault (--vault). On by default. Without an explicit key
  # the server generates one at <data-dir>/vault.key on the persistent volume.
  vault:
    enabled: true
    # -- Optional ATLAS_VAULT_KEY. Provide via existingSecret in production so
    # the key isn't stored in values. Leave empty to let the server manage it.
    existingSecret: ""
    keyKey: vault-key
    key: ""

  # -- Serve the OpenAPI spec and the Scalar API explorer (--docs).
  docs:
    enabled: true

  # -- Script task workers. Each shells out to an interpreter and runs arbitrary
  # code; the default image ships none of them, so they are OFF by default. Turn
  # one on only with an image that bundles the interpreter, and consider relaxing
  # securityContext.readOnlyRootFilesystem.
  script:
    powershell: false
    python: false
    javascript: false
    # -- Wall-clock limit for a single script task (--script-timeout).
    timeout: 30s

  # -- Grace period for in-flight requests on shutdown (--shutdown-timeout).
  shutdownTimeout: 10s

  # -- Extra raw flags appended to the server command, e.g. ["--foo=bar"].
  extraArgs: []
  # -- Extra environment variables, standard Kubernetes env entries.
  extraEnv: []

# -- Probes. /healthz is always unauthenticated, so it is safe under --auth.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  failureThreshold: 30
  periodSeconds: 2
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3
