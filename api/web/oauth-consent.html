<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Authorize an application</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314161a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<style>
  :root { --accent:#0b5cff; --accent-hover:#0a4ad1; --text:#14161a; --muted:#62666d; --border:#e2e4e9; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text); background:#f3f4f6; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 48px 20px 80px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .mark { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:7px; background:#14161a; color:#fff; font-weight:800; font-family:ui-monospace,monospace; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 3px rgba(20,22,26,.08); padding:28px; }
  h1 { font-size:20px; margin:0 0 6px; }
  .muted { color:var(--muted); }
  .err { color:var(--danger); }
  .vouch { margin-top:16px; padding:12px 14px; border-radius:8px; border:1px solid #f0d9a8; background:#fdf6e7; font-size:14px; }
  .vouch b { color:#7a5a12; }
  ul.reach { margin:16px 0 0; padding-left:20px; }
  ul.reach li { margin:4px 0; }
  .who { margin-top:18px; padding-top:14px; border-top:1px solid var(--border); font-size:14px; }
  .actions { margin-top:24px; display:flex; gap:10px; }
  button { font:inherit; font-weight:600; border-radius:7px; padding:10px 18px; cursor:pointer; }
  button.approve { color:#fff; background:var(--accent); border:1px solid var(--accent); }
  button.approve:hover { background:var(--accent-hover); }
  button.deny { color:var(--text); background:#fff; border:1px solid var(--border); }
  label { display:block; margin-top:12px; font-size:14px; font-weight:600; }
  input { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--border); border-radius:7px; margin-top:4px; }
  code { font-family:ui-monospace,monospace; font-size:13px; background:#f3f4f6; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true">A</span> <b>Atlas</b></div>
    <div class="card" id="card"><p class="muted">Loading…</p></div>
  </div>
<script>
// The consent screen (ADR-0200).
//
// It asks the server what it is being asked to approve, shows the person, and
// posts their decision back. Nothing about the request is remembered on the
// server between the two: the parameters are read from this page's own URL and
// sent with the decision, so there is no half-finished flow to expire or to be
// confused between two browser tabs.
const q = new URLSearchParams(location.search);
const card = document.getElementById("card");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : {};
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function fatal(message, redirect) {
  card.innerHTML = `<h1>This request cannot be approved</h1>
    <p class="err">${esc(message)}</p>
    <p class="muted">Nothing has been granted. If you started this from an
    application, go back to it and try again.</p>`;
  // Only ever a URI the server already matched against the client's registered
  // set — this page never builds a redirect of its own.
  if (redirect) setTimeout(() => { location.href = redirect; }, 1500);
}

function signIn(ctx) {
  card.innerHTML = `<h1>Sign in to continue</h1>
    <p class="muted"><b>${esc(ctx.clientName)}</b> is asking for access to Atlas.
    Sign in to decide.</p>
    <form id="login">
      <label>Username<input name="username" autocomplete="username" required autofocus /></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required /></label>
      <p class="err" id="login-error" hidden></p>
      <div class="actions"><button class="approve" type="submit">Sign in</button></div>
    </form>`;
  document.getElementById("login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const err = document.getElementById("login-error");
    err.hidden = true;
    try {
      await api("POST", "/api/v1/auth/login", {
        username: fd.get("username"), password: fd.get("password"),
      });
      load(); // back to the same question, now with a session
    } catch {
      // Deliberately the same words the login screen uses, and deliberately
      // vague: which half was wrong is not this page's to disclose either.
      err.textContent = "Invalid username or password.";
      err.hidden = false;
    }
  });
}

function consent(ctx) {
  const mcpOnly = String(ctx.resource || "").endsWith("/mcp");
  const reach = mcpOnly
    ? ["Drive Atlas through its Model Context Protocol tools, as you.",
       "Nothing else: this approval does not reach the rest of the API."]
    : ["Use the Atlas API as you — everything your account can do."];
  // Who vouched for this application. Where self-registration is open, the name
  // above is one the application chose for itself and nobody checked — and a
  // person cannot weigh a request without being told which of the two they are
  // looking at (ADR-0200). Silent when an administrator entered it: that is the
  // ordinary case, and a banner on every screen is a banner nobody reads.
  const vouch = ctx.selfRegistered
    ? `<div class="vouch"><b>This application registered itself.</b> Nobody here
       entered it or checked it, and the name above is the one it chose. Approve it
       only if you started this yourself and recognise what you started.</div>`
    : "";
  card.innerHTML = `<h1>Authorize ${esc(ctx.clientName)}</h1>
    <p class="muted">This application is asking to act as you in Atlas.</p>
    ${vouch}
    <ul class="reach">${reach.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
    <p class="muted" style="margin-top:14px">It will be able to do this until you
    withdraw the approval. Access is limited to <code>${esc(ctx.resource)}</code>.</p>
    <div class="who">Signed in as <b>${esc(ctx.signedInAs)}</b></div>
    <div class="actions">
      <button class="approve" id="approve">Allow</button>
      <button class="deny" id="deny">Don't allow</button>
    </div>`;
  const decide = async (approve) => {
    for (const b of card.querySelectorAll("button")) b.disabled = true;
    try {
      const out = await api("POST", "/api/v1/oauth/authorize", {
        clientId: q.get("client_id"),
        redirectUri: q.get("redirect_uri"),
        state: q.get("state") || "",
        codeChallenge: q.get("code_challenge"),
        resource: q.get("resource"),
        approve,
      });
      location.href = out.redirect;
    } catch (e) {
      fatal(e.message || "the decision could not be recorded");
    }
  };
  document.getElementById("approve").addEventListener("click", () => decide(true));
  document.getElementById("deny").addEventListener("click", () => decide(false));
}

async function load() {
  try {
    const ctx = await api("GET", "/api/v1/oauth/authorize-context" + location.search);
    if (ctx.error) return fatal(ctx.error, ctx.redirect);
    if (!ctx.signedInAs) return signIn(ctx);
    consent(ctx);
  } catch (e) {
    fatal(e.message || "this authorization request could not be read");
  }
}
load();
</script>
</body>
</html>
