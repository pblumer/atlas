<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Passwort</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='52' fill='%23000'/%3E%3Cpath fill='%23fff' d='M142.1 201.7A68 68 0 0 1 24 174.5L57.5 152.3A33 33 0 0 0 115.3 179.2Z'/%3E%3Cpath fill='%23fff' d='M22.2 162.7A68 68 0 0 1 106.5 92L119.7 117.1L98 126A33 33 0 0 0 59 146.7Z'/%3E%3Cpath fill='%23fff' d='M126 92H160V226H126Z'/%3E%3Cpath fill='%23fff' d='M189.5 38H210.5V62.5H235V83.5H210.5V108H189.5V83.5H165V62.5H189.5Z'/%3E%3C/svg%3E" />
<style>
  /* The base token set, as on the other public pages; theme.js overwrites the accent
     with the org's brand colour once the server answers. */
  :root {
    --bg:#f3f4f6; --surface:#ffffff;
    --border:#e2e4e9; --border-strong:#cdd0d6;
    --text:#14161a; --muted:#62666d;
    --accent:#0b5cff; --accent-hover:#0a4ad1; --accent-soft:#eaf0ff; --accent-ink:#ffffff;
    --ok:#2d8a4e; --danger:#c0392b;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 var(--font-sans); color:var(--text); background:var(--bg); }
  .wrap { max-width: 460px; margin: 0 auto; padding: 40px 16px 80px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .mark { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:7px; background:#000; color:#fff; overflow:hidden; }
  .mark svg { width:100%; height:100%; display:block; }
  .mark.has-logo { background:transparent; }
  .mark .mark-img { width:100%; height:100%; object-fit:contain; display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 3px rgba(20,22,26,.08); padding:28px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .muted { color:var(--muted); }
  .err { color:var(--danger); }
  label { display:block; margin:0 0 14px; font-weight:600; font-size:14px; }
  input { display:block; width:100%; margin-top:6px; font:inherit; font-weight:400; padding:9px 11px; border:1px solid var(--border-strong); border-radius:7px; background:var(--surface); color:var(--text); }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  /* The username a password manager files the new password under: present, never shown. */
  input[hidden] { display:none; }
  .actions { margin-top:20px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button.submit { font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:1px solid var(--accent); border-radius:7px; padding:10px 18px; cursor:pointer; }
  button.submit:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.submit:disabled { opacity:.5; cursor:not-allowed; }
  a { color:var(--accent); }
  .done { text-align:center; padding:16px 0; }
  .done .check { width:44px; height:44px; border-radius:50%; background:#e7f6ec; color:var(--ok); display:inline-grid; place-items:center; font-size:24px; margin-bottom:10px; }
  .hint { font-size:13px; margin:-6px 0 14px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M146 189.6A60 60 0 0 1 42.3 167.5L69.5 145.6A31 31 0 0 0 123.7 170.9Z"/><path fill="currentColor" d="M40.6 159.4A60 60 0 0 1 114.5 92.8L125.4 113.3L107.5 120.9A31 31 0 0 0 70.5 141.4Z"/><path fill="currentColor" d="M133 93H162V211H133Z"/><path fill="currentColor" d="M184.5 53H199.5V70.5H217V85.5H199.5V103H184.5V85.5H167V70.5H184.5Z"/></svg></span> <b>atlas</b></div>
    <div class="card" id="card"><p class="muted" id="loading"></p></div>
  </div>
  <script type="module">
    // The page a password link opens, and the "forgot password" form
    // (ADR-draft-password-set-by-its-owner). With a link, the token is in the fragment,
    // which the browser never sends to a server; this page keeps it for the tab, takes
    // it off the address bar, and sends it in an Authorization header. Opening the page
    // sets nothing: only the button does. Without a link, it asks for a username or
    // address and requests one — and says the same whatever was typed.
    import { syncFromServer } from "/theme.js";
    import { syncLogoFromServer } from "/logo.js";

    const TEXT = {
      de: {
        title: "Passwort", loading: "Wird geladen…",
        activate: "Passwort festlegen", reset: "Neues Passwort festlegen",
        forWhom: "Für das Konto", next: "Neues Passwort", again: "Neues Passwort wiederholen",
        rule: "Mindestens 8 Zeichen. Nur Sie kennen dieses Passwort — auch die Administration nicht.",
        save: "Passwort speichern", differ: "Die beiden Passwörter stimmen nicht überein.",
        saved: "Passwort gespeichert", savedText: "Sie können sich jetzt mit Ihrem neuen Passwort anmelden. Andere Anmeldungen dieses Kontos wurden beendet.",
        signIn: "Zur Anmeldung",
        gone: "Dieser Link ist nicht (mehr) gültig",
        goneText: "Der Link wurde bereits verwendet, ist abgelaufen, oder das Konto hat sich seither geändert. Fordern Sie einen neuen an.",
        forgot: "Passwort vergessen", forgotText: "Geben Sie Ihren Benutzernamen oder Ihre E-Mail-Adresse ein. Wir senden Ihnen einen Link, über den Sie ein neues Passwort festlegen.",
        login: "Benutzername oder E-Mail-Adresse", send: "Link anfordern",
        sent: "Bitte prüfen Sie Ihr Postfach", sentText: "Falls zu dieser Angabe ein Konto mit E-Mail-Adresse besteht, ist eine Nachricht mit einem Link unterwegs. Der Link ist eine Stunde gültig und kann nur einmal verwendet werden. Ihr bisheriges Passwort bleibt gültig, bis Sie ein neues festlegen.",
        tooMany: "Zu viele Anfragen – bitte versuchen Sie es in einigen Minuten nochmals.",
        failed: "Das hat nicht geklappt. Bitte versuchen Sie es nochmals.",
      },
      en: {
        title: "Password", loading: "Loading…",
        activate: "Set your password", reset: "Set a new password",
        forWhom: "For the account", next: "New password", again: "Repeat the new password",
        rule: "At least 8 characters. Only you know this password — administrators do not.",
        save: "Save password", differ: "The two passwords differ.",
        saved: "Password saved", savedText: "You can now sign in with your new password. Other sign-ins of this account have been ended.",
        signIn: "Go to sign-in",
        gone: "This link is not valid (any more)",
        goneText: "It was used already, it expired, or the account changed since. Ask for a new one.",
        forgot: "Forgot password", forgotText: "Enter your username or e-mail address. We send you a link to set a new password.",
        login: "Username or e-mail address", send: "Send link",
        sent: "Please check your mailbox", sentText: "If an account with an e-mail address matches what you entered, a message with a link is on its way. The link is valid for one hour and works once. Your current password stays valid until you set a new one.",
        tooMany: "Too many requests — please try again in a few minutes.",
        failed: "That did not work. Please try again.",
      },
    };
    const lang = (navigator.language || "de").toLowerCase().startsWith("en") ? "en" : "de";
    const T = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = T.title;
    const card = document.getElementById("card");
    document.getElementById("loading").textContent = T.loading;
    syncFromServer();
    syncLogoFromServer();

    const KEY = "atlas.password";
    let token = decodeURIComponent(location.hash.replace(/^#/, ""));
    try {
      if (token) sessionStorage.setItem(KEY, token);
      else token = sessionStorage.getItem(KEY) || "";
    } catch { /* no storage: no resume after a reload */ }
    if (location.hash) history.replaceState(null, "", location.pathname);

    async function call(method, path, body, auth) {
      const headers = {};
      if (auth) headers.Authorization = "Bearer " + token;
      if (body) headers["Content-Type"] = "application/json";
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined, credentials: "omit" });
      if (res.status === 404) { const e = new Error(T.goneText); e.gone = true; throw e; }
      if (res.status === 429) throw new Error(T.tooMany);
      if (!res.ok) {
        const msg = res.status === 400 ? ((await res.json().catch(() => ({}))).error || "") : "";
        throw new Error(msg || T.failed);
      }
      return res.json();
    }

    function forget() { try { sessionStorage.removeItem(KEY); } catch { /* nothing kept */ } }

    function gone() {
      forget();
      card.innerHTML = `<h1>${esc(T.gone)}</h1><p class="muted">${esc(T.goneText)}</p>
        <div class="actions"><a href="/public/password" id="again">${esc(T.forgot)}</a></div>`;
    }

    function showSetForm(state) {
      card.innerHTML = `<h1>${esc(state.purpose === "activate" ? T.activate : T.reset)}</h1>
        <p class="muted">${esc(T.forWhom)} <b>${esc(state.username)}</b>${state.displayName ? " (" + esc(state.displayName) + ")" : ""}</p>
        <form id="set" autocomplete="on">
          <input type="text" name="username" autocomplete="username" value="${esc(state.username)}" hidden>
          <label>${esc(T.next)}<input name="next" type="password" autocomplete="new-password" minlength="8" maxlength="72" required autofocus></label>
          <p class="muted hint">${esc(T.rule)}</p>
          <label>${esc(T.again)}<input name="again" type="password" autocomplete="new-password" minlength="8" maxlength="72" required></label>
          <p class="err" id="msg" hidden></p>
          <div class="actions"><button class="submit" type="submit">${esc(T.save)}</button></div>
        </form>`;
      const form = document.getElementById("set");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        msg.hidden = true;
        if (fd.get("next") !== fd.get("again")) { msg.textContent = T.differ; msg.hidden = false; return; }
        const btn = form.querySelector("button");
        btn.disabled = true;
        try {
          await call("POST", "/public/password/link", { password: fd.get("next") }, true);
          forget();
          card.innerHTML = `<div class="done"><div class="check">&#10003;</div>
            <h1 style="margin:0 0 6px">${esc(T.saved)}</h1>
            <p class="muted">${esc(T.savedText)}</p>
            <p><a href="/">${esc(T.signIn)}</a></p></div>`;
        } catch (err) {
          if (err.gone) { gone(); return; }
          btn.disabled = false;
          msg.textContent = err.message;
          msg.hidden = false;
        }
      });
    }

    function showForgot() {
      let hint = "";
      try { hint = sessionStorage.getItem("atlas.forgot.login") || ""; sessionStorage.removeItem("atlas.forgot.login"); } catch { /* none */ }
      card.innerHTML = `<h1>${esc(T.forgot)}</h1>
        <p class="muted">${esc(T.forgotText)}</p>
        <form id="forgot">
          <label>${esc(T.login)}<input name="login" autocomplete="username" value="${esc(hint)}" maxlength="320" required autofocus></label>
          <p class="err" id="msg" hidden></p>
          <div class="actions"><button class="submit" type="submit">${esc(T.send)}</button><a href="/">${esc(T.signIn)}</a></div>
        </form>`;
      const form = document.getElementById("forgot");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button");
        btn.disabled = true;
        msg.hidden = true;
        try {
          await call("POST", "/public/password/forgot", { login: String(new FormData(form).get("login") || "").trim() }, false);
          card.innerHTML = `<h1>${esc(T.sent)}</h1><p class="muted">${esc(T.sentText)}</p>
            <div class="actions"><a href="/">${esc(T.signIn)}</a></div>`;
        } catch (err) {
          btn.disabled = false;
          msg.textContent = err.message;
          msg.hidden = false;
        }
      });
    }

    async function main() {
      if (!token) { showForgot(); return; }
      try {
        showSetForm(await call("GET", "/public/password/link", null, true));
      } catch (e) {
        if (e.gone) { gone(); return; }
        card.innerHTML = `<h1>${esc(T.title)}</h1><p class="err">${esc(e.message)}</p>`;
      }
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    main();
  </script>
</body>
</html>
