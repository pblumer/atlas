<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Antwort</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='52' fill='%23000'/%3E%3Cpath fill='%23fff' d='M142.1 201.7A68 68 0 0 1 24 174.5L57.5 152.3A33 33 0 0 0 115.3 179.2Z'/%3E%3Cpath fill='%23fff' d='M22.2 162.7A68 68 0 0 1 106.5 92L119.7 117.1L98 126A33 33 0 0 0 59 146.7Z'/%3E%3Cpath fill='%23fff' d='M126 92H160V226H126Z'/%3E%3Cpath fill='%23fff' d='M189.5 38H210.5V62.5H235V83.5H210.5V108H189.5V83.5H165V62.5H189.5Z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/vendor/form-js/form-js.css" />
<link rel="stylesheet" href="/form-theme.css" />
<style>
  /* The base token set, as on the public start form: form-theme.css maps exactly these
     onto what form-js reads, and theme.js overwrites the accent with the org's brand
     colour once the server answers. */
  :root {
    --bg:#f3f4f6; --surface:#ffffff;
    --border:#e2e4e9; --border-strong:#cdd0d6;
    --text:#14161a; --muted:#62666d;
    --accent:#0b5cff; --accent-hover:#0a4ad1; --accent-soft:#eaf0ff; --accent-ink:#ffffff;
    --ok:#2d8a4e; --danger:#c0392b;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 var(--font-sans); color:var(--text); background:var(--bg); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .mark { display:inline-grid; place-items:center; width:28px; height:28px; border-radius:7px; background:#000; color:#fff; overflow:hidden; }
  .mark svg { width:100%; height:100%; display:block; }
  .mark.has-logo { background:transparent; }
  .mark .mark-img { width:100%; height:100%; object-fit:contain; display:block; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 3px rgba(20,22,26,.08); padding:28px; }
  h1 { font-size:20px; margin:0 0 12px; }
  .doc { white-space:pre-line; margin:0 0 20px; }
  .muted { color:var(--muted); }
  .err { color:var(--danger); }
  .actions { margin-top:22px; }
  button.submit { font:inherit; font-weight:600; color:var(--accent-ink); background:var(--accent); border:1px solid var(--accent); border-radius:7px; padding:10px 18px; cursor:pointer; }
  button.submit:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  button.submit:disabled { opacity:.5; cursor:not-allowed; }
  .done { text-align:center; padding:16px 0; }
  .done .check { width:44px; height:44px; border-radius:50%; background:#e7f6ec; color:var(--ok); display:inline-grid; place-items:center; font-size:24px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M146 189.6A60 60 0 0 1 42.3 167.5L69.5 145.6A31 31 0 0 0 123.7 170.9Z"/><path fill="currentColor" d="M40.6 159.4A60 60 0 0 1 114.5 92.8L125.4 113.3L107.5 120.9A31 31 0 0 0 70.5 141.4Z"/><path fill="currentColor" d="M133 93H162V211H133Z"/><path fill="currentColor" d="M184.5 53H199.5V70.5H217V85.5H199.5V103H184.5V85.5H167V70.5H184.5Z"/></svg></span> <b>atlas</b></div>
    <div class="card" id="card"><p class="muted" id="loading"></p></div>
  </div>
  <script type="module">
    // The page a link in a mail opens to answer one user task
    // (ADR-draft-user-task-answered-by-link). The link's token is in the fragment, which
    // the browser never sends to a server; this page keeps it for the tab, takes it off
    // the address bar, and sends it in an Authorization header. Opening the page answers
    // nothing: only the button does.
    import { Form } from "/vendor/form-js/form-viewer.js";
    import { syncFromServer } from "/theme.js";
    import { syncLogoFromServer } from "/logo.js";

    // The person who opens this has no account and so no language setting: the
    // browser's language decides, German first, as in the Console.
    const TEXT = {
      de: {
        title: "Ihre Antwort", loading: "Wird geladen…", submit: "Antwort senden",
        thanks: "Vielen Dank", received: "Ihre Antwort ist eingegangen.",
        nothing: "Nichts zu beantworten",
        nothingText: "Über diesen Link ist im Moment nichts zu beantworten. Vielleicht wurde schon geantwortet, oder die Frist ist abgelaufen.",
        tooMany: "Zu viele Anfragen – bitte versuchen Sie es gleich nochmals.",
        check: "Bitte prüfen Sie Ihre Angaben: ",
        failed: "Die Antwort konnte nicht gesendet werden. Bitte versuchen Sie es nochmals.",
      },
      en: {
        title: "Your answer", loading: "Loading…", submit: "Send answer",
        thanks: "Thank you", received: "Your answer has been received.",
        nothing: "Nothing to answer",
        nothingText: "There is nothing to answer through this link right now. It may have been answered already, or the time to answer has passed.",
        tooMany: "Too many requests — please try again shortly.",
        check: "Please check your answers: ",
        failed: "Your answer could not be sent. Please try again.",
      },
    };
    const lang = (navigator.language || "de").toLowerCase().startsWith("en") ? "en" : "de";
    const T = TEXT[lang];
    document.documentElement.lang = lang;
    document.title = T.title;
    const card = document.getElementById("card");
    document.getElementById("loading").textContent = T.loading;
    syncFromServer();
    syncLogoFromServer();

    // The token: from the fragment the first time, from this tab's storage after a
    // reload. Taking it off the address bar keeps it out of a screenshot, a shared screen
    // and the browser's history.
    const KEY = "atlas.answer";
    let token = decodeURIComponent(location.hash.replace(/^#/, ""));
    try {
      if (token) sessionStorage.setItem(KEY, token);
      else token = sessionStorage.getItem(KEY) || "";
    } catch { /* no storage: no resume after a reload */ }
    if (location.hash) history.replaceState(null, "", location.pathname);

    // A mail can arrive before its task is open — it may be sent right in front of it —
    // so a link that opens nothing is asked again a few times before the page says so.
    const RETRY = [1500, 4000];

    async function call(method, path, body) {
      const headers = { Authorization: "Bearer " + token };
      if (body) headers["Content-Type"] = "application/json";
      const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
      if (res.status === 404) { const e = new Error(T.nothingText); e.gone = true; throw e; }
      if (res.status === 429) throw new Error(T.tooMany);
      if (!res.ok) {
        const msg = res.status === 400 ? ((await res.json().catch(() => ({}))).error || "") : "";
        throw new Error(msg ? T.check + msg : T.failed);
      }
      return res.json();
    }

    function nothing() {
      try { sessionStorage.removeItem(KEY); } catch { /* nothing kept */ }
      card.innerHTML = `<h1>${esc(T.nothing)}</h1><p class="muted">${esc(T.nothingText)}</p>`;
    }

    function thanks() {
      try { sessionStorage.removeItem(KEY); } catch { /* nothing kept */ }
      card.innerHTML = `<div class="done"><div class="check">&#10003;</div>
        <h1 style="margin:0 0 6px">${esc(T.thanks)}</h1>
        <p class="muted">${esc(T.received)}</p></div>`;
    }

    function showError(message) {
      let el = card.querySelector(".submit-err");
      if (!el) { el = document.createElement("p"); el.className = "muted err submit-err"; card.querySelector(".actions").appendChild(el); }
      el.textContent = message;
    }

    async function show(step) {
      card.innerHTML = `<h1>${esc(step.title || T.title)}</h1>
        ${step.documentation ? `<p class="doc muted">${esc(step.documentation)}</p>` : ""}
        <div id="form"></div>
        <div class="actions"><button class="submit" id="submit">${esc(T.submit)}</button></div>`;
      const form = new Form({ container: document.getElementById("form") });
      await form.importSchema(step.schema || { type: "default", components: [] }, step.data || {});
      document.getElementById("submit").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        const { data, errors } = form.submit();
        if (errors && Object.keys(errors).length) return; // form-js marks the fields
        btn.disabled = true;
        try {
          await call("POST", `/public/answer/task/${step.taskKey}/complete`, { variables: data });
          thanks();
        } catch (err) {
          if (err.gone) { nothing(); return; }
          btn.disabled = false;
          showError(err.message);
        }
      });
    }

    async function main(attempt = 0) {
      if (!token) { nothing(); return; }
      try {
        const ans = await call("GET", "/public/answer/task");
        if (ans.state === "open" && ans.step) { await show(ans.step); return; }
        nothing();
      } catch (e) {
        if (e.gone && attempt < RETRY.length) { setTimeout(() => main(attempt + 1), RETRY[attempt]); return; }
        if (e.gone) { nothing(); return; }
        card.innerHTML = `<h1>${esc(T.title)}</h1><p class="muted err">${esc(e.message)}</p>`;
      }
    }
    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    main();
  </script>
</body>
</html>
