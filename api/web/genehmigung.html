<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Genehmigungen</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='52' fill='%23000'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M128 26 244 214 12 214ZM128 172 178 214 78 214ZM111 72H145V99H172V133H145V160H111V133H84V99H111Z'/%3E%3C/svg%3E" />
<style>
  body { margin:0; font:15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         color:#14161a; background:#f3f4f6; display:flex; align-items:center;
         justify-content:center; min-height:100vh; }
  main { max-width:44ch; padding:24px; text-align:center; }
  a { color:#0a4ad1; }
</style>
</head>
<body>
<!--
  The approver's page was here (ADR-0311), and the approval is now read and decided
  in the inbox that already held it — an approval is an ordinary user task, and Tasks
  is where all of this person's work is (ADR-0394).

  What is left is the address, because addresses were sent out. Every approval
  notification carries a link to this page with the order line in its query, and a
  mail cannot be recalled: an approver who opens one next week must land on their
  approval rather than on a 404. So this forwards, carrying the line it was given
  into the inbox's own link.

  It may be deleted once no notification old enough to point here can still name an
  open approval. Nothing else links to it: the menu, the handbook and the models all
  name the inbox now.
-->
<main>
  <p>Diese Seite ist in <strong>Tasks</strong> aufgegangen. Sie werden weitergeleitet.</p>
  <p><a id="go" href="/index.html#/tasks">Weiter zum Posteingang</a></p>
</main>
<script>
  // The query this page was linked with, handed to the inbox unchanged: it names the
  // order line, which is what the inbox resolves against the approvals somebody holds.
  var q = window.location.search || "";
  var to = "/index.html#/tasks" + (q ? "?" + q.slice(1) : "");
  document.getElementById("go").setAttribute("href", to);
  // replace and not assign: the page it forwards from is not a step anybody should
  // reach again with the Back button.
  window.location.replace(to);
</script>
</body>
</html>
