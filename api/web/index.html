<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='52' fill='%23000'/%3E%3Cpath fill='%23fff' d='M142.1 201.7A68 68 0 0 1 24 174.5L57.5 152.3A33 33 0 0 0 115.3 179.2Z'/%3E%3Cpath fill='%23fff' d='M22.2 162.7A68 68 0 0 1 106.5 92L119.7 117.1L98 126A33 33 0 0 0 59 146.7Z'/%3E%3Cpath fill='%23fff' d='M126 92H160V226H126Z'/%3E%3Cpath fill='%23fff' d='M189.5 38H210.5V62.5H235V83.5H210.5V108H189.5V83.5H165V62.5H189.5Z'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="app.css" />
<!-- Apply the saved company-colour theme before first paint, so the UI never
     flashes the default accent. Logic-free on purpose: it applies the already
     derived variable map that theme.js stored; see theme.js for the derivation. -->
<script>
  try {
    var t = JSON.parse(localStorage.getItem("atlas.theme"));
    if (t && t.vars) {
      var r = document.documentElement;
      for (var k in t.vars) if (k.indexOf("--accent") === 0) r.style.setProperty(k, t.vars[k]);
    }
  } catch (e) { /* no/!invalid theme — fall back to the CSS default */ }
</script>
</head>
<body>
  <!-- App-switcher drawer (hidden until the grid button is pressed) -->
  <div id="scrim" hidden></div>
  <aside id="drawer" hidden aria-label="Applications">
    <div class="drawer-head">
      <button id="drawer-close" class="icon-btn" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      </button>
      <span class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M146 189.6A60 60 0 0 1 42.3 167.5L69.5 145.6A31 31 0 0 0 123.7 170.9Z"/><path fill="currentColor" d="M40.6 159.4A60 60 0 0 1 114.5 92.8L125.4 113.3L107.5 120.9A31 31 0 0 0 70.5 141.4Z"/><path fill="currentColor" d="M133 93H162V211H133Z"/><path fill="currentColor" d="M184.5 53H199.5V70.5H217V85.5H199.5V103H184.5V85.5H167V70.5H184.5Z"/></svg></span> <b>atlas</b></span>
    </div>
    <nav id="drawer-apps"></nav>
  </aside>

  <!-- Top bar -->
  <header class="topbar">
    <button id="app-switcher" class="icon-btn grid" title="Switch app" aria-label="Switch app">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <circle cx="5" cy="5" r="1.6"/><circle cx="12" cy="5" r="1.6"/><circle cx="19" cy="5" r="1.6"/>
        <circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>
        <circle cx="5" cy="19" r="1.6"/><circle cx="12" cy="19" r="1.6"/><circle cx="19" cy="19" r="1.6"/>
      </svg>
    </button>
    <a class="brand topbrand" href="#/console">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 256 256"><path fill="currentColor" d="M146 189.6A60 60 0 0 1 42.3 167.5L69.5 145.6A31 31 0 0 0 123.7 170.9Z"/><path fill="currentColor" d="M40.6 159.4A60 60 0 0 1 114.5 92.8L125.4 113.3L107.5 120.9A31 31 0 0 0 70.5 141.4Z"/><path fill="currentColor" d="M133 93H162V211H133Z"/><path fill="currentColor" d="M184.5 53H199.5V70.5H217V85.5H199.5V103H184.5V85.5H167V70.5H184.5Z"/></svg></span>
      <b id="app-name">Console</b>
    </a>
    <span class="divider"></span>
    <nav id="topnav" class="topnav"></nav>

    <div class="spacer"></div>

    <span id="org" class="org">Atlas Org</span>
    <!-- The FEEL assistant (feel-assistant.js): its spark and title are filled in when
         the console installs it, so the words come from the message catalogue. -->
    <button id="feel-assistant-btn" class="icon-btn" aria-label="FEEL"></button>
    <button id="global-search" class="icon-btn" title="Search processes (Ctrl/⌘ K)" aria-label="Search processes"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
    <button class="icon-btn" title="Notifications" aria-label="Notifications"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg></button>
    <div class="dropdown">
      <button id="help-btn" class="icon-btn dropdown-toggle" title="Help" aria-label="Help" aria-haspopup="menu"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 013.9-2c1.3.9 1.1 2.3 0 3.2-.7.6-1.4 1-1.4 2M12 17h.01"/></svg></button>
      <div id="help-menu" class="dropdown-menu" role="menu" hidden></div>
    </div>
    <button class="icon-btn avatar" title="Account" aria-label="Account">PB</button>
  </header>

  <main id="view"></main>

  <div id="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
