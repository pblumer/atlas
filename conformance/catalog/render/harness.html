<!doctype html><html><head><meta charset="utf-8"/>
<link rel="stylesheet" href="/vendor/bpmn/assets/diagram-js.css"/>
<link rel="stylesheet" href="/vendor/bpmn/assets/bpmn-js.css"/>
<link rel="stylesheet" href="/vendor/bpmn/assets/bpmn-font/css/bpmn-embedded.css"/>
<style>html,body{margin:0;background:#fff;} #canvas{width:1800px;height:1100px;background:#fff;} .djs-palette,.bjs-powered-by{display:none!important;}</style>
</head><body><div id="canvas"></div>
<script src="/vendor/bpmn/bpmn-modeler.js"></script>
<script>(async()=>{try{
  const model=new URLSearchParams(location.search).get("model");
  const [zeebe,XML]=await Promise.all([fetch("/vendor/bpmn/zeebe.json").then(r=>r.json()),fetch("/model/"+model+".bpmn").then(r=>r.text())]);
  const modeler=new window.BpmnJS({container:"#canvas",moddleExtensions:{zeebe}});
  await modeler.importXML(XML);
  modeler.get("canvas").zoom("fit-viewport");
  window.__ready=true;
}catch(e){window.__error=String((e&&e.stack)||e);}})();</script></body></html>
