<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas editor-bar e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api`, with a
         diagram plain enough that nothing but the bar is interesting, to verify the
         editor bar's shape: Save and Deploy on the bar, everything else behind the "…"
         menu (ADR-draft-modeler-bar-hierarchy). Mounted in deployment mode (key set,
         draftId null) so no live collaboration SSE is attached. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_bar" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="bar-proc" name="Bar Demo" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Eingang" />
    <bpmn:sequenceFlow id="Flow_1" sourceRef="Start_1" targetRef="Task_1" />
    <bpmn:userTask id="Task_1" name="Pruefen" />
    <bpmn:sequenceFlow id="Flow_2" sourceRef="Task_1" targetRef="End_1" />
    <bpmn:endEvent id="End_1" name="Fertig" />
  </bpmn:process>
  <bpmndi:BPMNDiagram id="BPMNDiagram_1">
    <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="bar-proc">
      <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1">
        <dc:Bounds x="160" y="120" width="36" height="36" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Task_1_di" bpmnElement="Task_1">
        <dc:Bounds x="250" y="98" width="100" height="80" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1">
        <dc:Bounds x="410" y="120" width="36" height="36" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNEdge id="Flow_1_di" bpmnElement="Flow_1">
        <di:waypoint x="196" y="138" /><di:waypoint x="250" y="138" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_2_di" bpmnElement="Flow_2">
        <di:waypoint x="350" y="138" /><di:waypoint x="410" y="138" />
      </bpmndi:BPMNEdge>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // Recorded so a spec can see that a control behind the menu was actually reached —
      // the mock stands in for fetch, so route interception has nothing to catch.
      window.__calls = [];
      const api = async (method, url) => {
        window.__calls.push({ method, url });
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        // Auto-layout hands back a diagram to import; the same one keeps the canvas valid.
        if (method === "POST" && /\/layout$/.test(url)) return XML;
        if (method === "GET" && /\/forms$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__ready = true;
    </script>
  </body>
</html>
