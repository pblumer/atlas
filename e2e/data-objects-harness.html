<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas data-objects e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountInstanceReplay against a mock `api`, for
         the replay's Data tab: one order accruing across two tasks, one object nobody has
         written, and one write that names no element. bpmn assets are the production ones. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import { mountInstanceReplay } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const T = 1_722_260_303_000;
      const ns = (ms) => ms * 1e6;

      // "Erfassen" and "Freigeben" both write the order; the diagram labels them, so the
      // Data tab must show the label rather than the element id.
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_do" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="do" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f_0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:task id="Erfassen_1" name="Erfassen"><bpmn:incoming>f_0</bpmn:incoming><bpmn:outgoing>f_1</bpmn:outgoing></bpmn:task>
    <bpmn:task id="Freigeben_1" name="Freigeben"><bpmn:incoming>f_1</bpmn:incoming><bpmn:outgoing>f_2</bpmn:outgoing></bpmn:task>
    <bpmn:endEvent id="End_1" name="Ende"><bpmn:incoming>f_2</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f_0" sourceRef="Start_1" targetRef="Erfassen_1"/>
    <bpmn:sequenceFlow id="f_1" sourceRef="Erfassen_1" targetRef="Freigeben_1"/>
    <bpmn:sequenceFlow id="f_2" sourceRef="Freigeben_1" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="do">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Erfassen_1_di" bpmnElement="Erfassen_1"><dc:Bounds x="250" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Freigeben_1_di" bpmnElement="Freigeben_1"><dc:Bounds x="410" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="570" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f_0_di" bpmnElement="f_0"><di:waypoint x="196" y="160"/><di:waypoint x="250" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f_1_di" bpmnElement="f_1"><di:waypoint x="350" y="160"/><di:waypoint x="410" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f_2_di" bpmnElement="f_2"><di:waypoint x="510" y="160"/><di:waypoint x="570" y="160"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const steps = [
        { elementId: "Start_1", elementInstanceKey: "1000", type: "bpmn:startEvent", position: 1, tokenId: "1", variables: [] },
        { elementId: "Erfassen_1", elementInstanceKey: "1001", type: "bpmn:task", position: 2, tokenId: "1", variables: [] },
        { elementId: "Freigeben_1", elementInstanceKey: "1002", type: "bpmn:task", position: 3, tokenId: "1", variables: [] },
        { elementId: "End_1", elementInstanceKey: "1003", type: "bpmn:endEvent", position: 4, tokenId: "1", variables: [] },
      ].map((s, i) => ({ ...s, at: ns(T + i * 1000), endAt: ns(T + i * 1000 + 500) }));

      const frames = steps.map((s, i) => ({
        position: s.position, at: s.at,
        tokens: i < steps.length - 1 ? [{ elementId: s.elementId, tokenId: "1", elementInstanceKey: s.elementInstanceKey, state: "active" }] : [],
      }));

      const TIMELINE = { processDefKey: "7", processId: "do", version: 1, state: "completed", steps, frames };

      // order: seeded, then accrued by two named tasks — the trail's whole point.
      // rechnung: declared and never written — "unset", nobody to name.
      // altbestand: a write whose producer the log never recorded (a pre-attribution
      // instance), which must read as unknown rather than borrow a neighbour's name.
      const DATA_OBJECTS = [
        {
          name: "altbestand", state: "migriert", kind: "string", value: "alt", itemType: "", isCollection: false,
          at: ns(T + 3000), producedBy: "",
          history: [
            { at: ns(T + 500), state: "neu", kind: "null", value: null, producedBy: "" },
            { at: ns(T + 3000), state: "migriert", kind: "string", value: "alt", producedBy: "" },
          ],
        },
        {
          name: "order", state: "freigegeben", kind: "json", value: { id: "ORD-1", total: 100 },
          itemType: "Order", isCollection: false, at: ns(T + 3000), producedBy: "Freigeben_1",
          history: [
            { at: ns(T + 500), state: "erfasst", kind: "null", value: null, producedBy: "" },
            { at: ns(T + 2000), state: "erfasst", kind: "json", value: { id: "ORD-1" }, producedBy: "Erfassen_1" },
            { at: ns(T + 3000), state: "freigegeben", kind: "json", value: { id: "ORD-1", total: 100 }, producedBy: "Freigeben_1" },
          ],
        },
        {
          name: "positionen", state: "", kind: "null", value: null, itemType: "Position", isCollection: true,
          at: ns(T + 500), producedBy: "",
          history: [{ at: ns(T + 500), state: "", kind: "null", value: null, producedBy: "" }],
        },
      ];

      const api = async (method, url) => {
        if (/\/instances\/\d+\/timeline$/.test(url)) return TIMELINE;
        if (/\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (url.includes("/runtime")) return { elements: [] };
        if (/\/instances\/\d+\/decisions$/.test(url)) return [];
        if (/\/instances\/\d+\/data-objects$/.test(url)) return DATA_OBJECTS;
        return {};
      };

      window.__mount = () => mountInstanceReplay(view, { api, toast: noop, key: "281474976723211" });
      window.__ready = true;
    </script>
  </body>
</html>
