<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<!--
  Test-only harness (never embedded in api/web). Renders the FALL-A single
  intake form (examples/reisebuchung/fall-a/reise-antrag.form.json) with the real
  vendored form-js bundle, so an e2e test can verify that ONE form carries all
  the dependency in-form: cascading Ziel, Fernreise-only fields, and the
  minor-only fields driven by a FEEL date comparison in conditional.hide.
-->
<link rel="stylesheet" href="/vendor/form-js/form-js.css"/>
</head>
<body>
<div id="host"></div>
<script type="module">
import { Form } from "/vendor/form-js/form-viewer.js";

// Must mirror examples/reisebuchung/fall-a/reise-antrag.form.json exactly.
const schema = {
  type: "default",
  id: "reise-antrag",
  components: [
    { type: "select", key: "reiseart", label: "Reiseart", values: [
      { label: "Inland", value: "Inland" }, { label: "EU-Ausland", value: "EU" }, { label: "Fernreise", value: "Fernreise" }
    ], validate: { required: true } },
    { type: "select", key: "ziel", label: "Ziel",
      valuesExpression: '=if reiseart = "Fernreise" then [{value: "th", label: "Thailand"}, {value: "us", label: "USA"}, {value: "jp", label: "Japan"}] else if reiseart = "EU" then [{value: "es", label: "Spanien"}, {value: "fr", label: "Frankreich"}, {value: "it", label: "Italien"}] else [{value: "sylt", label: "Sylt"}, {value: "bayern", label: "Bayern"}, {value: "harz", label: "Harz"}]',
      validate: { required: true } },
    { type: "textfield", key: "reisepassNr", label: "Reisepass-Nr.",
      conditional: { hide: '=reiseart != "Fernreise"' } },
    { type: "textfield", key: "staatsangehoerigkeit", label: "Staatsangehörigkeit",
      conditional: { hide: '=reiseart != "Fernreise"' } },
    { type: "datetime", subtype: "date", key: "geburtsdatum", dateLabel: "Geburtsdatum", validate: { required: true } },
    { type: "textfield", key: "vertreterName", label: "Name des Erziehungsberechtigten",
      conditional: { hide: '=(geburtsdatum = null) or (date(geburtsdatum) <= date("2008-08-08"))' } },
    { type: "checkbox", key: "einverstaendnis", label: "Reiseerlaubnis erteilt",
      conditional: { hide: '=(geburtsdatum = null) or (date(geburtsdatum) <= date("2008-08-08"))' } },
    { type: "checkbox", key: "buchungBestaetigt", label: "Buchung verbindlich bestätigen", validate: { required: true } }
  ]
};

let form = null;
window.__err = null;
window.render = async (data) => {
  window.__err = null;
  try {
    if (form) { form.destroy(); form = null; }
    form = new Form({ container: document.querySelector("#host") });
    await form.importSchema(schema, data || {});
  } catch (e) { window.__err = String(e && e.message || e); throw e; }
};
window.readState = () => {
  const labels = [...document.querySelectorAll(".fjs-form-field label, .fjs-form-field .fjs-form-field-label")]
    .map(l => l.textContent.trim());
  const has = (t) => labels.some(l => l.startsWith(t));
  return { labels,
    hasReiseart: has("Reiseart"), hasZiel: has("Ziel"), hasReisepass: has("Reisepass"),
    hasStaat: has("Staatsangeh"), hasGeburtsdatum: has("Geburtsdatum"),
    hasVertreter: has("Name des Erziehungs"), hasEinverstaendnis: has("Reiseerlaubnis"),
    hasBuchung: has("Buchung verbindlich") };
};
window.ready = window.render({}).then(() => true);
</script>
</body>
</html>
