<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas instance migration dialog e2e harness</title>
    <!-- Drives the real api/web/migrationdialog.js flows against a mock `api` that
         answers the way the server does (ADR-0162): the plan endpoint writes nothing
         and reports the derived mapping plus every refusal, the migrate endpoint
         refuses with 409 carrying that same plan, and the batch endpoint hands back
         bounded pages with a `remaining` flag. The page scaffolding is the test's own —
         app.js boots the whole console on import and cannot be loaded here — so this
         proves the flows, not app.js's wiring of them. -->
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="toast" hidden></div>
    <div class="card" style="padding: 18px; max-width: 720px">
      <button class="btn" id="mig-ok">Migrate migratable instance</button>
      <button class="btn" id="mig-bad">Migrate stranded instance</button>
      <button class="btn" id="mig-only">Migrate (only one version)</button>
      <button class="btn" id="mig-batch">Migrate batch</button>
      <button class="btn" id="mig-batch-fail">Migrate batch (fails on page 2)</button>
      <button class="btn" id="mig-batch-nocursor">Migrate batch (no cursor)</button>
      <button class="btn" id="mig-batch-flood">Migrate batch (all refused)</button>
    </div>
    <script type="module">
      import { migrateInstanceFlow, migrateProcessFlow, planSummary, otherVersions, forkSummary } from "/migrationdialog.js";

      // Three deployed versions of one process, and an unrelated process that must never
      // appear in the picker.
      const PROCESSES = [
        { key: 101, processId: "migrating", name: "Migrating", version: 1 },
        { key: 102, processId: "migrating", name: "Migrating", version: 2 },
        { key: 103, processId: "migrating", name: "Migrating", version: 3, versionTag: "hotfix" },
        { key: 900, processId: "unrelated", name: "Unrelated", version: 1 },
      ];
      window.__PROCESSES = PROCESSES;

      const OK_PLAN = (to) => ({
        instanceKey: "5001", fromProcessDefKey: 101, fromVersion: 1,
        toProcessDefKey: to, toVersion: to === 103 ? 3 : 2,
        migratable: true,
        mapping: [
          { from: "start", to: "start" },
          { from: "review", to: "review_v2" },
          { from: "done", to: "done" },
        ],
        fork: FORK(to, ["review_v2"]),
      });
      // The fork half of a plan (ADR-0389): where the work
      // would pick up again, what crosses, and what ends with the instance. The stranded
      // instance's parked token has no counterpart by id, so nothing is proposed and the
      // operator has to say where it resumes — which is the case the section exists for.
      const FORK = (to, proposed) => ({
        instanceKey: "5002", fromProcessDefKey: 101, fromVersion: 1,
        toProcessDefKey: to, toVersion: to === 103 ? 3 : 2,
        resume: proposed,
        parked: [{ elementId: "review", resumeAt: proposed[0] || "" }],
        candidates: ["start", "review_v2", "done"],
        variables: 3, dataObjects: 1, jobs: 1,
        forkable: proposed.length > 0,
      });
      const BAD_PLAN = (to) => ({
        instanceKey: "5002", fromProcessDefKey: 101, fromVersion: 1,
        toProcessDefKey: to, toVersion: to === 103 ? 3 : 2,
        migratable: false,
        mapping: [{ from: "start", to: "start" }],
        problems: [
          { elementInstanceKey: "9001", elementId: "review", reason: "no element in the target version is mapped to it, so its token would be stranded" },
        ],
        fork: FORK(to, []),
      });

      window.__calls = [];   // every write the flow issued, in order
      window.__result = null;
      window.__done = 0;     // how often the flow asked its caller to re-read
      let batchMode = "";    // which server the batch endpoint plays: see below

      const toast = (msg, kind) => {
        const t = document.getElementById("toast");
        t.textContent = msg; t.className = kind || ""; t.hidden = false;
        window.__toast = { msg, kind };
      };

      const api = async (method, url, body) => {
        if (method === "GET" && url === "/api/v1/processes") return PROCESSES;
        window.__calls.push({ method, url, body });

        if (url.endsWith("/migrate/plan")) {
          const stranded = url.includes("/5002/");
          return stranded ? BAD_PLAN(body.targetProcessDefKey) : OK_PLAN(body.targetProcessDefKey);
        }
        if (url.endsWith("/migrate/fork")) {
          if (!body.resume || !body.resume.length) {
            const err = new Error("fork refused");
            err.status = 409;
            err.body = FORK(body.targetProcessDefKey, []);
            throw err;
          }
          return { ...FORK(body.targetProcessDefKey, body.resume), successorInstanceKey: "5003" };
        }
        if (url.match(/\/instances\/\d+\/migrate$/)) {
          if (url.includes("/5002/")) {
            const err = new Error("migration refused");
            err.status = 409;
            err.body = BAD_PLAN(body.targetProcessDefKey);
            throw err;
          }
          return { ok: true };
        }
        if (url.includes("/migrate-instances")) {
          // Two pages, so the caller's "repeat while remaining" loop is exercised; the
          // second page carries a refusal, so the outcome dialog has something to list.
          // The second page is only reachable through the cursor the first handed back,
          // as on the server: a call without it starts from the front again.
          const after = new URL(url, location.origin).searchParams.get("after");
          const to = body.targetProcessDefKey;
          if (batchMode === "nocursor") return { toProcessDefKey: to, migrated: 2, remaining: true };
          if (batchMode === "flood") {
            const refused = Array.from({ length: 250 }, (_, i) => ({
              instanceKey: String(8000 + i), migratable: false,
              problems: [{ elementId: "review", reason: "no element in the target version is mapped to it" }],
            }));
            return { toProcessDefKey: to, migrated: 0, remaining: false, refused };
          }
          if (!after) return { toProcessDefKey: to, migrated: 2, remaining: true, nextCursor: "7002" };
          if (after !== "7002") throw new Error(`unexpected cursor ${after}`);
          if (batchMode === "fail") {
            const err = new Error("migrate instances: loop closing");
            err.status = 500;
            throw err;
          }
          return {
            toProcessDefKey: to, migrated: 1, remaining: false,
            refused: [{ instanceKey: "7007", migratable: false, problems: [{ elementId: "review", reason: "is a bpmn:UserTask but maps to gate, which is a bpmn:ExclusiveGateway" }] }],
          };
        }
        return {};
      };

      const reset = () => { window.__calls = []; window.__result = null; window.__toast = null; window.__done = 0; batchMode = ""; };

      document.getElementById("mig-ok").addEventListener("click", async () => {
        reset();
        window.__result = await migrateInstanceFlow({
          api, toast, instanceKey: "5001", processId: "migrating", fromVersion: 1, fromProcessDefKey: 101,
        });
      });
      document.getElementById("mig-bad").addEventListener("click", async () => {
        reset();
        window.__result = await migrateInstanceFlow({
          api, toast, instanceKey: "5002", processId: "migrating", fromVersion: 1, fromProcessDefKey: 101,
        });
      });
      document.getElementById("mig-only").addEventListener("click", async () => {
        reset();
        // The unrelated process has exactly one deployed version: there is nowhere to go.
        window.__result = await migrateInstanceFlow({
          api, toast, instanceKey: "6001", processId: "unrelated", fromVersion: 1, fromProcessDefKey: 900,
        });
      });
      const batch = (mode) => async () => {
        reset();
        batchMode = mode;
        window.__result = await migrateProcessFlow({
          api, toast, processId: "migrating", processName: "Migrating",
          versions: PROCESSES.filter((p) => p.processId === "migrating"),
          runningOf: (v) => (v.key === 101 ? 3 : 0),
          onDone: () => { window.__done++; },
        });
      };
      document.getElementById("mig-batch").addEventListener("click", batch(""));
      document.getElementById("mig-batch-fail").addEventListener("click", batch("fail"));
      document.getElementById("mig-batch-nocursor").addEventListener("click", batch("nocursor"));
      document.getElementById("mig-batch-flood").addEventListener("click", batch("flood"));

      // Exported pure helpers, checked directly rather than through the DOM.
      window.__planSummary = planSummary;
      window.__forkSummary = forkSummary;
      window.__otherVersions = otherVersions;
      window.__ready = true;
    </script>
  </body>
</html>
