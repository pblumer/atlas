<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas process documentation e2e harness</title>
    <!-- Drives the real api/web/process-doc.js against the vendored bpmn-js, on a
         diagram carrying exactly what a documentation export exists to capture:
         per-element <documentation>, a <textAnnotation> associated with a task, a
         second annotation attached to nothing, lanes, a named sequence flow out of
         a gateway, and the two shapes of business rule task — one calling a local
         decision, one evaluated by a temis worker. Proving the collector reads
         these needs the real moddle — a hand-rolled stub would only prove the
         stub. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
    </style>
  </head>
  <body>
    <div id="canvas" style="height: 100vh"></div>
    <script src="/vendor/bpmn/bpmn-modeler.js"></script>
    <script type="module">
      import {
        collectDocumentation, buildDocumentationPdf, exportDocumentation,
        svgToJpeg, sizeOfSvg, typeLabel, documentationOf, trimToContent,
        codeFieldsOf, wantsLandscape, calledDecisionOf, resolveCalledDecisions,
      } from "/process-doc.js";

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" id="Definitions_doc" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="reisebuchung" name="Reisebuchung" isExecutable="true">
    <bpmn:documentation>Bucht eine Reise für einen Kunden — von der Anfrage bis zur Abrechnung.</bpmn:documentation>
    <bpmn:laneSet id="ls">
      <bpmn:lane id="lane_sb" name="Sachbearbeitung">
        <bpmn:flowNodeRef>Start_1</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_pruefen</bpmn:flowNodeRef>
      </bpmn:lane>
      <bpmn:lane id="lane_sys" name="System">
        <bpmn:flowNodeRef>Gw_1</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_pruefung</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_bonitaet</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>Task_buchen</bpmn:flowNodeRef>
        <bpmn:flowNodeRef>End_1</bpmn:flowNodeRef>
      </bpmn:lane>
    </bpmn:laneSet>
    <bpmn:startEvent id="Start_1" name="Anfrage eingegangen"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:userTask id="Task_pruefen" name="Anfrage prüfen">
      <bpmn:documentation>Die Sachbearbeitung prüft Vollständigkeit und Budget.</bpmn:documentation>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:businessRuleTask id="Task_pruefung" name="Anspruch ermitteln">
      <bpmn:documentation>Ermittelt maschinell, ob die Anfrage anspruchsberechtigt ist.</bpmn:documentation>
      <bpmn:extensionElements>
        <zeebe:calledDecision decisionId="eligibility" resultVariable="verdict" bindingType="latest"/>
        <zeebe:ioMapping><zeebe:input source="= betrag" target="amount"/></zeebe:ioMapping>
      </bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f1b</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:businessRuleTask id="Task_bonitaet" name="Bonität bewerten">
      <bpmn:extensionElements>
        <zeebe:calledDecision decisionId="scoring" resultVariable="score"/>
        <atlas:temisConnector connector="risk-service"/>
      </bpmn:extensionElements>
      <bpmn:incoming>f1b</bpmn:incoming><bpmn:outgoing>f1c</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:exclusiveGateway id="Gw_1" name="Genehmigt?"><bpmn:incoming>f1c</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing><bpmn:outgoing>f3</bpmn:outgoing></bpmn:exclusiveGateway>
    <bpmn:serviceTask id="Task_buchen" name="Flug buchen">
      <bpmn:documentation>Ruft das Buchungssystem der Airline auf.</bpmn:documentation>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:endEvent id="End_1"><bpmn:incoming>f3</bpmn:incoming><bpmn:incoming>f4</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Task_pruefen"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Task_pruefen" targetRef="Task_pruefung"/>
    <bpmn:sequenceFlow id="f1b" sourceRef="Task_pruefung" targetRef="Task_bonitaet"/>
    <bpmn:sequenceFlow id="f1c" sourceRef="Task_bonitaet" targetRef="Gw_1"/>
    <bpmn:sequenceFlow id="f2" name="ja" sourceRef="Gw_1" targetRef="Task_buchen"><bpmn:conditionExpression xsi:type="bpmn:tFormalExpression" language="feel">= genehmigt = true</bpmn:conditionExpression></bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="f3" name="nein" sourceRef="Gw_1" targetRef="End_1"><bpmn:conditionExpression xsi:type="bpmn:tFormalExpression" language="feel">= genehmigt = false</bpmn:conditionExpression></bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="f4" sourceRef="Task_buchen" targetRef="End_1"/>
    <bpmn:textAnnotation id="note_iata"><bpmn:text>Benötigt IATA-Zugang</bpmn:text></bpmn:textAnnotation>
    <bpmn:association id="assoc_1" sourceRef="Task_buchen" targetRef="note_iata"/>
    <bpmn:textAnnotation id="note_lose"><bpmn:text>Freigabe durch die Leitung steht aus</bpmn:text></bpmn:textAnnotation>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="reisebuchung">
    <bpmndi:BPMNShape id="lane_sb_di" bpmnElement="lane_sb" isHorizontal="true"><dc:Bounds x="160" y="80" width="640" height="120"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="lane_sys_di" bpmnElement="lane_sys" isHorizontal="true"><dc:Bounds x="160" y="200" width="640" height="120"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="212" y="122" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_pruefen_di" bpmnElement="Task_pruefen"><dc:Bounds x="300" y="100" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_pruefung_di" bpmnElement="Task_pruefung"><dc:Bounds x="196" y="220" width="90" height="60"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_bonitaet_di" bpmnElement="Task_bonitaet"><dc:Bounds x="316" y="220" width="90" height="60"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Gw_1_di" bpmnElement="Gw_1"><dc:Bounds x="455" y="235" width="50" height="50"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_buchen_di" bpmnElement="Task_buchen"><dc:Bounds x="560" y="220" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="722" y="242" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="note_iata_di" bpmnElement="note_iata"><dc:Bounds x="560" y="330" width="140" height="40"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="note_lose_di" bpmnElement="note_lose"><dc:Bounds x="220" y="330" width="180" height="40"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="248" y="140"/><di:waypoint x="300" y="140"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="300" y="140"/><di:waypoint x="241" y="140"/><di:waypoint x="241" y="220"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1b_di" bpmnElement="f1b"><di:waypoint x="286" y="250"/><di:waypoint x="316" y="250"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1c_di" bpmnElement="f1c"><di:waypoint x="406" y="250"/><di:waypoint x="455" y="255"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="505" y="260"/><di:waypoint x="560" y="260"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="480" y="285"/><di:waypoint x="480" y="310"/><di:waypoint x="740" y="310"/><di:waypoint x="740" y="278"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="660" y="260"/><di:waypoint x="722" y="260"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="assoc_1_di" bpmnElement="assoc_1"><di:waypoint x="610" y="300"/><di:waypoint x="610" y="330"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // The zeebe and atlas moddle extensions, loaded exactly as editor.js loads
      // them: without them a <zeebe:calledDecision> is not a property the collector
      // can read, and the business rule tasks would prove nothing.
      const [zeebe, atlas] = await Promise.all([
        fetch("/vendor/bpmn/zeebe.json").then((r) => r.json()),
        fetch("/atlas-moddle.json").then((r) => r.json()),
      ]);
      const modeler = new window.BpmnJS({
        container: document.getElementById("canvas"),
        moddleExtensions: { zeebe, atlas },
      });
      window.__modeler = modeler;
      window.__doc = { collectDocumentation, buildDocumentationPdf, exportDocumentation, svgToJpeg, sizeOfSvg, typeLabel, documentationOf, trimToContent, codeFieldsOf, wantsLandscape, calledDecisionOf, resolveCalledDecisions };

      window.__asLatin1 = (bytes) => {
        let s = "";
        for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return s;
      };

      // The DMN model behind the referenced decision, and the source of the one that
      // exists only as a deployment — the two cases resolveCalledDecisions has to
      // tell apart.
      window.__eligibilityDMN = `<?xml version="1.0" encoding="UTF-8"?>
<definitions xmlns="https://www.omg.org/spec/DMN/20191111/MODEL/" id="defs_elig" name="Anspruch" namespace="http://atlas/dmn">
  <inputData id="id_amount" name="amount"/>
  <decision id="eligibility" name="Anspruch">
    <description>Entscheidet anhand des Betrags über den Anspruch.</description>
    <informationRequirement><requiredInput href="#id_amount"/></informationRequirement>
    <decisionTable id="dt" hitPolicy="UNIQUE">
      <input id="in1" label="Betrag"><inputExpression id="ie1" typeRef="number"><text>amount</text></inputExpression></input>
      <output id="out1" label="Anspruch" name="eligibility" typeRef="string"/>
      <rule id="r1"><inputEntry id="e1"><text>&gt;= 100</text></inputEntry><outputEntry id="o1"><text>"approve"</text></outputEntry><description>Ab 100 immer</description></rule>
      <rule id="r2"><inputEntry id="e2"><text>&lt; 100</text></inputEntry><outputEntry id="o2"><text>"reject"</text></outputEntry></rule>
    </decisionTable>
  </decision>
</definitions>`;

      // A stand-in for the app's api(): records every call, answers the decision
      // lookups the document makes, and answers the publish like the real
      // POST .../documentation route.
      window.__apiCalls = [];
      window.__decisionsCatalog = [{ id: "eligibility", name: "Anspruch", model: "Anspruch", modelRef: "anspruch", inputs: [], output: {} }];
      window.__api = async (method, path, body) => {
        window.__apiCalls.push({ method, path, body });
        if (method === "GET" && path === "/api/v1/decisions") return window.__decisionsCatalog;
        if (method === "GET" && path.startsWith("/api/v1/dmn-models/")) return window.__eligibilityDMN;
        if (method === "GET" && path.startsWith("/api/v1/decision-deployments?")) {
          return [{ key: 7788, decisionId: "eligibility", version: 3, current: true }];
        }
        if (method === "GET" && /^\/api\/v1\/decision-deployments\/\d+\/xml$/.test(path)) return window.__eligibilityDMN;
        return { id: "abc123", processId: "reisebuchung", version: 1, pdfUrl: "/api/v1/documentation/abc123/pdf" };
      };

      await modeler.importXML(XML);
      window.__ready = true;
    </script>
  </body>
</html>
