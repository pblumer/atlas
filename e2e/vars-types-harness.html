<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Variables-panel types e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api`, to verify
         what the Modeler's Variables panel says a variable *holds*: the type the model
         declares (a start variable's own type, the shape a connector kind writes), and
         the value it actually held on the last run of this process, read from a real
         instance — including a structure, opened where it stands.

         Call window.__mount() for the normal case, or window.__mount({ ran: false }) for
         a diagram that was never deployed, which is the state of most diagrams being
         written and must degrade to declarations only. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      // Three variables, one per kind of knowledge the panel can have:
      //   kundennr  — a start variable, whose type the model states outright;
      //   kunden    — a PostgreSQL connector's result. `operation="query"` returns rows,
      //               so the catalog declares an array without anything having run;
      //   geschrieben — a FEEL script's result, which is whatever the expression yields.
      //               Nothing declares it, and the panel must say nothing rather than guess.
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_vars" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="proc-vars" name="Variablen" isExecutable="true">
    <bpmn:extensionElements>
      <atlas:startForm>
        <atlas:startVariable name="kundennr" type="number" />
      </atlas:startForm>
    </bpmn:extensionElements>
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="lesen" name="Kunden lesen">
      <bpmn:extensionElements>
        <atlas:postgresConnector connector="hr-db" operation="query" statement="select 1" resultVariable="kunden" />
      </bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:scriptTask id="rechnen" name="Alter berechnen">
      <bpmn:extensionElements>
        <zeebe:script expression="=1 + 1" resultVariable="geschrieben" />
      </bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:endEvent id="End_1" name="Ende"><bpmn:incoming>f2</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="lesen"/>
    <bpmn:sequenceFlow id="f1" sourceRef="lesen" targetRef="rechnen"/>
    <bpmn:sequenceFlow id="f2" sourceRef="rechnen" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="proc-vars">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="150" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="lesen_di" bpmnElement="lesen"><dc:Bounds x="240" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="rechnen_di" bpmnElement="rechnen"><dc:Bounds x="400" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="560" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="186" y="138"/><di:waypoint x="240" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="340" y="138"/><di:waypoint x="400" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="500" y="138"/><di:waypoint x="560" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // One finished instance of this process, shaped exactly as GET /instances returns
      // it: every value a string, with `kind` naming what it is. `kunden` holds two rows
      // whose column names (kundennr, nachname) are the point — a name tells an author
      // that a connector writes `kunden`, not what is inside one.
      const INSTANCE = {
        key: 281474976710657, processDefKey: 7, processId: "proc-vars", version: 1,
        state: "completed", createdAt: 1, completedAt: 2, elementInstances: 0,
        variables: [
          { name: "kundennr", value: "42", kind: "number" },
          { name: "geschrieben", value: "2", kind: "number" },
          {
            name: "kunden", kind: "json",
            value: '[{"kundennr":1,"nachname":"Meier"},{"kundennr":2,"nachname":"Keller"}]',
          },
        ],
      };

      window.__calls = [];
      let ran = true;
      const api = async (method, url) => {
        window.__calls.push({ method, url });
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/instances\?process=/.test(url)) return ran ? [INSTANCE] : [];
        if (method === "GET" && /\/processes$/.test(url)) {
          return ran ? [{ key: 7, processId: "proc-vars", name: "Variablen", version: 1 }] : [];
        }
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = (opts = {}) => {
        ran = opts.ran !== false;
        return mountEditor(view, { api, toast: noop, key: 42 });
      };
      window.__ready = true;
    </script>
  </body>
</html>
