<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas signal events modeler e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api` whose
         GET /api/v1/event-catalog answers a small event catalogue, to verify that the
         signal picker offers the events a model may listen to, says what a chosen one
         carries, and warns on an atlas.* name that is no event or is thrown (ADR-0435).
         Mounted in deployment mode (key set, draftId null) so no live collaboration SSE
         is attached. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      // Start_sig is a signal start with no signal yet; Catch_req waits for the declared
      // atlas.user.requested; Catch_stray waits for an atlas.* name atlas never emits;
      // Throw_1 throws atlas.user.requested itself.
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_sig" targetNamespace="http://atlas/bpmn">
  <bpmn:signal id="Signal_req" name="atlas.user.requested"/>
  <bpmn:signal id="Signal_stray" name="atlas.user.vanished"/>
  <bpmn:process id="sigevents" name="Test Signal Events" isExecutable="true">
    <bpmn:startEvent id="Start_sig" name="Start"><bpmn:outgoing>f0</bpmn:outgoing><bpmn:signalEventDefinition id="SED_start"/></bpmn:startEvent>
    <bpmn:intermediateCatchEvent id="Catch_req" name="Requested"><bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing><bpmn:signalEventDefinition id="SED_req" signalRef="Signal_req"/></bpmn:intermediateCatchEvent>
    <bpmn:intermediateCatchEvent id="Catch_stray" name="Vanished"><bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing><bpmn:signalEventDefinition id="SED_stray" signalRef="Signal_stray"/></bpmn:intermediateCatchEvent>
    <bpmn:intermediateThrowEvent id="Throw_1" name="Announce"><bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing><bpmn:signalEventDefinition id="SED_throw" signalRef="Signal_req"/></bpmn:intermediateThrowEvent>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f3</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_sig" targetRef="Catch_req"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Catch_req" targetRef="Catch_stray"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Catch_stray" targetRef="Throw_1"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Throw_1" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="sigevents">
    <bpmndi:BPMNShape id="Start_sig_di" bpmnElement="Start_sig"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Catch_req_di" bpmnElement="Catch_req"><dc:Bounds x="280" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Catch_stray_di" bpmnElement="Catch_stray"><dc:Bounds x="400" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Throw_1_di" bpmnElement="Throw_1"><dc:Bounds x="520" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="640" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="280" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="316" y="138"/><di:waypoint x="400" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="436" y="138"/><di:waypoint x="520" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="556" y="138"/><di:waypoint x="640" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // Two listenable signals, one of them not declared by the diagram, and a message
      // entry a model of the installation does not listen to.
      const field = (name, personal) => ({ name, type: "string", always: true, data: personal ? "personal" : "not-personal", meaning: { en: name, de: name } });
      const CATALOG = {
        entries: [
          { type: "atlas.order.placed", kind: "domain", channels: ["message"], listenable: false,
            meaning: { en: "An order was placed.", de: "Eine Bestellung wurde aufgegeben." }, payload: [field("orderId", false)] },
          { type: "atlas.user.requested", kind: "domain", channels: ["signal"], listenable: true,
            meaning: { en: "Somebody asked for a user account.", de: "Jemand hat ein Benutzerkonto beantragt." },
            payload: [field("atlasInstance", false), field("vorname", true), field("email", true)] },
          { type: "atlas.user.created", kind: "domain", channels: ["signal"], listenable: true,
            meaning: { en: "A user account was created.", de: "Ein Benutzerkonto wurde angelegt." }, payload: [field("atlasInstance", false)] },
          { type: "<message>.<outcome>", shaped: true, kind: "domain", channels: ["feed"],
            meaning: { en: "An action ended.", de: "Eine Aktion endete." }, payload: [] },
        ],
      };

      window.__catalogCalls = 0;
      window.__failCatalog = false;
      const api = async (method, url) => {
        if (method === "GET" && /\/event-catalog$/.test(url)) {
          window.__catalogCalls++;
          if (window.__failCatalog) throw new Error("unreachable");
          return CATALOG;
        }
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return [];
        if (method === "GET" && /\/message-sources$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      // The exported XML is what the deploy sends, so the tests assert against it.
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
