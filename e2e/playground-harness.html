<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Playground tab e2e harness</title>
    <!-- Drives the *real* api/web/editor.js and api/web/playground.js against a mock
         Playground API, so the tab's browser half can be verified without a server.

         The mock stands in for one sandbox session running a two-task process: a user
         task that waits for the person at the keyboard, and a job the stub answers. It
         records every call, so a test can prove the panel talks to the endpoints it
         claims to — and that leaving the editor releases the sandbox rather than
         leaving it to its TTL. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor, cleanup } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_pg" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="credit" name="Kreditantrag" isExecutable="true">
    <bpmn:startEvent id="start" name="Antrag eingegangen"><bpmn:outgoing>f1</bpmn:outgoing></bpmn:startEvent>
    <bpmn:userTask id="review" name="Antrag prüfen"><bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing></bpmn:userTask>
    <bpmn:serviceTask id="score" name="Bonität prüfen">
      <bpmn:extensionElements><zeebe:taskDefinition type="scoring" /></bpmn:extensionElements>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:exclusiveGateway id="decide" name="Entscheidung">
      <bpmn:incoming>f3</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
      <bpmn:outgoing>f5</bpmn:outgoing><bpmn:outgoing>f6</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:endEvent id="done" name="Genehmigt"><bpmn:incoming>f4</bpmn:incoming></bpmn:endEvent>
    <bpmn:endEvent id="rejected" name="Abgelehnt"><bpmn:incoming>f5</bpmn:incoming></bpmn:endEvent>
    <bpmn:endEvent id="manual" name="Zur Handprüfung"><bpmn:incoming>f6</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f1" sourceRef="start" targetRef="review"/>
    <bpmn:sequenceFlow id="f2" sourceRef="review" targetRef="score"/>
    <bpmn:sequenceFlow id="f3" sourceRef="score" targetRef="decide"/>
    <bpmn:sequenceFlow id="f4" sourceRef="decide" targetRef="done"/>
    <bpmn:sequenceFlow id="f5" sourceRef="decide" targetRef="rejected"/>
    <bpmn:sequenceFlow id="f6" sourceRef="decide" targetRef="manual"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="credit">
    <bpmndi:BPMNShape id="start_di" bpmnElement="start"><dc:Bounds x="160" y="182" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="review_di" bpmnElement="review"><dc:Bounds x="250" y="160" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="score_di" bpmnElement="score"><dc:Bounds x="400" y="160" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="decide_di" bpmnElement="decide" isMarkerVisible="true"><dc:Bounds x="550" y="175" width="50" height="50"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="done_di" bpmnElement="done"><dc:Bounds x="670" y="82" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="rejected_di" bpmnElement="rejected"><dc:Bounds x="670" y="182" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="manual_di" bpmnElement="manual"><dc:Bounds x="670" y="282" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="196" y="200"/><di:waypoint x="250" y="200"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="350" y="200"/><di:waypoint x="400" y="200"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="500" y="200"/><di:waypoint x="550" y="200"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="575" y="175"/><di:waypoint x="575" y="100"/><di:waypoint x="670" y="100"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f5_di" bpmnElement="f5"><di:waypoint x="600" y="200"/><di:waypoint x="670" y="200"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f6_di" bpmnElement="f6"><di:waypoint x="575" y="225"/><di:waypoint x="575" y="300"/><di:waypoint x="670" y="300"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // The mock sandbox. It knows three states — before the case, the case parked on
      // the user task, and the case finished — which is all the tab's wiring needs to
      // be exercised end to end.
      const SESSION = "sess-1";
      let phase = "idle";
      window.__calls = [];

      // The batch half of the mock. A run is "running" for one poll and then
      // finished, which is enough to prove the panel polls, stops polling, and
      // then reads the report and the heat map exactly once each.
      let batch = null;   // null | {polls, cancelled}
      const runStatus = () => {
        if (!batch) return { state: "idle", occurrences: 0, cases: 0, completed: 0 };
        if (batch.cancelled) return { state: "cancelled", occurrences: 4, cases: 3, completed: 1,
          simTime: "2026-03-05T09:00:00Z" };
        const running = batch.polls++ < 1;
        return running
          ? { state: "running", occurrences: 2, cases: 3, completed: 1, simTime: "2026-03-05T08:30:00Z" }
          : { state: "finished", occurrences: 9, cases: 3, completed: 3, simTime: "2026-03-05T11:00:00Z" };
      };
      const REPORT = {
        cases: 3, completed: 3, incidents: 0, maxInFlight: 3,
        simStart: "2026-03-05T08:00:00Z", simEnd: "2026-03-05T11:00:00Z",
        duration: { count: 3, minMillis: 3600000, p50Millis: 7200000, p90Millis: 10800000,
                    maxMillis: 10800000, meanMillis: 7200000 },
        elements: {
          review: { runs: 3, workMillis: 10800000, waitMillis: 10800000, maxWaitMillis: 7200000, incidents: 0 },
          // Two tokens parked on the scoring task, so the incidents overlay has
          // somewhere to be hot that the other three do not.
          score: { runs: 3, workMillis: 180000, waitMillis: 0, maxWaitMillis: 0, incidents: 2 },
        },
        pools: { clerks: { capacity: 1, served: 3, busyMillis: 10800000,
                           availableMillis: 10800000, maxQueue: 2, utilisationPercent: 100 } },
        visits: { start: 3, review: 3, score: 3, decide: 3, done: 2, rejected: 1, manual: 0 },
        timeline: {
          widthMillis: 3600000,
          buckets: [
            { at: "2026-03-05T08:00:00Z", started: 3, completed: 0, inFlight: 3 },
            { at: "2026-03-05T09:00:00Z", started: 0, completed: 1, inFlight: 2 },
            { at: "2026-03-05T10:00:00Z", started: 0, completed: 2, inFlight: 0 },
          ],
        },
      };
      // The scenario half: one saved run, its stored baseline, and the verdict the
      // server would return for it. Enough to prove the panel stores what it runs
      // and shows back what it is told.
      let scenarios = [{ id: "nightly", name: "Nightly load", processId: "credit",
                         savedAt: 1, hasBaseline: true }];
      const SCENARIO = {
        id: "nightly", name: "Nightly load", processId: "credit", savedAt: 1,
        spec: {
          open: { source: "xml", xml: "<stored/>", seed: 4711,
                  stubs: { human: { minMillis: 3600000, maxMillis: 3600000 },
                           pools: { clerks: { capacity: 2 } }, poolOf: { review: "clerks" } } },
          run: { cases: [{ amount: 10 }, { amount: 5000 }], arrival: { mode: "every", intervalMillis: 900000 } },
          expect: { minCompleted: 2, maxIncidents: 0, maxP90Millis: 7200000,
                    minVisits: { review: 1 }, maxQueue: { clerks: 5 } },
        },
        baseline: { cases: 3, completed: 3, incidents: 0, maxInFlight: 3,
          duration: { count: 3, minMillis: 3600000, p50Millis: 7200000, p90Millis: 10800000,
                      maxMillis: 10800000, meanMillis: 7200000 },
          elements: { review: { runs: 3, workMillis: 10800000, waitMillis: 36000000, maxWaitMillis: 14400000 } },
          pools: { clerks: { capacity: 1, served: 3, busyMillis: 10800000,
                             availableMillis: 10800000, maxQueue: 9, utilisationPercent: 100 } },
          visits: {} },
        baselineAt: 1,
      };
      const VERDICT = { passed: false, checks: [
        { name: "cases completed", want: "at least 3", got: "3 of 3", passed: true },
        { name: "incidents", want: "at most 0", got: "0", passed: true },
        { name: "queue at clerks", want: "at most 5", got: "9", passed: false },
      ], rules: [] };

      // What the server answers once the panel sends per-case rules: one that held
      // and one that did not, with the cases that broke it named.
      const RULE_VERDICT = { passed: false, checks: VERDICT.checks, rules: [
        { name: "small ones are approved", when: "betrag < 1000", then: 'end = "approved"',
          cases: 3, matched: 2, satisfied: 2, violated: 0, undecided: 0, passed: true,
          examples: [], truncated: false },
        { name: 'betrag > 1000 → end = "approved"', when: "betrag > 1000", then: 'end = "approved"',
          cases: 3, matched: 1, satisfied: 0, violated: 1, undecided: 0, passed: false,
          examples: [2], truncated: false },
      ] };
      const COMPARISON = { deltas: [
        { name: "cases completed", unit: "count", before: 3, after: 3, better: false, worse: false },
        { name: "p90 duration", unit: "millis", before: 10800000, after: 7200000, better: true, worse: false },
        { name: "queue at clerks", unit: "count", before: 9, after: 12, better: false, worse: true },
        { name: "utilisation at clerks", unit: "percent", before: 100, after: 62, better: false, worse: false },
      ] };

      // One branch the data never took, so the coverage list has something to say —
      // and, with the other two shared unevenly, an outcome split to break down.
      const HEATMAP = {
        maxCount: 3,
        elements: [{ id: "start", count: 3 }, { id: "review", count: 3 },
                   { id: "score", count: 3 }, { id: "decide", count: 3 },
                   { id: "done", count: 2 }, { id: "rejected", count: 1 },
                   { id: "manual", count: 0 }],
        flows: [{ from: "start", to: "review", count: 3 },
                { from: "review", to: "score", count: 3 },
                { from: "score", to: "decide", count: 3 },
                { from: "decide", to: "done", count: 2 },
                { from: "decide", to: "rejected", count: 1 },
                { from: "decide", to: "manual", count: 0 }],
      };

      const tasks = () => (phase === "parked"
        ? [{ jobKey: "77", instanceKey: "5", element: "review", human: true }]
        : []);
      const visits = () => ({
        idle: {},
        parked: { start: 1, review: 1 },
        done: { start: 1, review: 1, score: 1, decide: 1, done: 1 },
      }[phase]);
      const theCase = () => (phase === "done"
        ? { instanceKey: "5", state: "completed", path: ["start", "review", "score", "decide", "done"],
            variables: { amount: "12400", decision: "approved" }, incidents: 0 }
        : { instanceKey: "5", state: "active", path: ["start", "review"],
            variables: { amount: "12400" }, incidents: 0 });

      // The cases the report above summarises, as the results endpoint pages them: two
      // that finished and one parked behind an incident. makeCases builds more of the
      // same, so a test that is about paging can have enough rows to page.
      const makeCases = (n) => Array.from({ length: n }, (_, i) => (i % 3 === 2
        ? { index: i, instanceKey: String(11 + i), state: "active", started: "2026-03-05T08:00:00Z",
            durationMillis: 0, incidents: 1, end: "", variables: { amount: "5000", kunde: "C" } }
        : { index: i, instanceKey: String(11 + i), state: "completed", started: "2026-03-05T08:00:00Z",
            ended: "2026-03-05T09:12:00Z", durationMillis: 4320000, incidents: 0,
            end: i % 3 === 0 ? "done" : "rejected",
            variables: { amount: i % 3 === 0 ? "12400" : "90", kunde: i % 3 === 0 ? "A" : "B" } }));
      let CASES = makeCases(3);

      const api = async (method, url, body) => {
        window.__calls.push({ method, url, body });
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        if (method === "GET" && /\/forms$/.test(url)) return [];
        if (method === "POST" && /\/playground\/sessions$/.test(url)) {
          phase = "idle";
          return { id: SESSION, processId: "credit", seed: 4711,
                   simTime: "2026-03-05T08:00:00Z", createdAt: "2026-03-05T08:00:00Z",
                   lastUsed: "2026-03-05T08:00:00Z", paused: false, openTasks: 0 };
        }
        if (method === "POST" && /\/cases$/.test(url)) { phase = "parked"; return theCase(); }
        if (method === "GET" && /\/tasks$/.test(url)) return tasks();
        if (method === "GET" && /\/overlay$/.test(url)) return visits();
        if (method === "GET" && /\/cases\/\d+$/.test(url)) {
          // A case read by key is one of the batch's rows: the third one is the
          // parked one, so opening it shows a case that is still standing somewhere.
          const key = url.match(/\/cases\/(\d+)$/)[1];
          const row = CASES.find((c) => c.instanceKey === key);
          if (row) {
            return { instanceKey: key, state: row.state, incidents: row.incidents,
              variables: row.variables,
              path: row.state === "completed"
                ? ["start", "review", "score", "decide", row.end]
                : ["start", "review"] };
          }
          return theCase();
        }
        if (method === "POST" && /\/tasks\/\d+\/complete$/.test(url)) { phase = "done"; return { completed: true }; }
        if (method === "POST" && /\/run$/.test(url)) {
          return { occurrences: 1, quiescent: true, simTime: "2026-03-05T08:01:00Z", paused: false };
        }
        if (method === "POST" && /\/step$/.test(url)) {
          return { happened: true, kind: "jobCompleted", element: "score",
                   at: "2026-03-05T08:01:00Z", simTime: "2026-03-05T08:01:00Z" };
        }
        if (method === "GET" && /\/playground\/sessions\/[\w-]+$/.test(url)) {
          return { id: SESSION, processId: "credit", seed: 4711,
                   simTime: phase === "done" ? "2026-03-05T08:01:00Z" : "2026-03-05T08:00:00Z",
                   createdAt: "2026-03-05T08:00:00Z", lastUsed: "2026-03-05T08:00:00Z",
                   paused: false, openTasks: tasks().length };
        }
        if (method === "POST" && /\/runs\/cancel$/.test(url)) { batch.cancelled = true; return runStatus(); }
        if (method === "POST" && /\/runs$/.test(url)) { batch = { polls: 0, cancelled: false }; return runStatus(); }
        if (method === "GET" && /\/runs$/.test(url)) return runStatus();
        if (method === "GET" && /\/report$/.test(url)) return REPORT;
        // One page of the results table. Three cases, so paging has something to page:
        // the strip asks for a window and the server owns how many there are.
        if (method === "GET" && /\/results\?/.test(url)) {
          const q = new URL(url, location.origin).searchParams;
          const at = Number(q.get("offset") || 0);
          return {
            total: CASES.length, offset: at,
            rows: CASES.slice(at, at + Number(q.get("limit") || 100)),
          };
        }
        if (method === "GET" && /\/heatmap$/.test(url)) return HEATMAP;
        // The shape of the arrival stream. The server plans it, so the mock derives
        // the buckets from what was asked rather than returning a fixed picture: a
        // sparkline that ignored the mode would prove nothing about the wiring.
        if (method === "POST" && /\/arrivals$/.test(url)) {
          const mode = (body.arrival || {}).mode || "allAtOnce";
          if (mode === "sequential") return { scheduled: false, cases: body.count, peak: 0, spanMillis: 0 };
          // Everything at once has no span to spread over: one slice tall, start and
          // end the same instant — which is what the planner reports for it too.
          if (mode === "allAtOnce") {
            return { scheduled: true, cases: body.count, start: "2026-03-05T08:00:00Z",
              end: "2026-03-05T08:00:00Z", spanMillis: 0, peak: body.count,
              buckets: Array.from({ length: 12 }, (_, i) => (i === 0 ? body.count : 0)) };
          }
          const buckets = Array.from({ length: 12 }, (_, i) => Math.round(body.count / 12) + (i === 5 ? 3 : 0));
          return {
            scheduled: true, cases: body.count,
            start: "2026-03-05T08:00:00Z", end: "2026-03-05T17:00:00Z",
            spanMillis: 32400000, peak: Math.max(...buckets), buckets,
          };
        }
        // The preview a described dataset asks for. The rows are derived from the
        // description so the spec can check that what was typed reached the server,
        // which is the only half of the generator the browser owns.
        if (method === "POST" && /\/generate(\?|$)/.test(url)) {
          const fields = body.fields || [];
          return {
            total: body.count,
            columns: fields.map((f) => f.name),
            rows: [0, 1, 2].map((i) => {
              const row = {};
              for (const f of fields) {
                row[f.name] = f.kind === "int" ? f.min + i
                  : f.kind === "sequence" ? `${f.prefix}00${i + 1}`
                    : f.kind === "choice" ? f.choices[i % f.choices.length].value
                      : f.kind === "bool" ? i === 0 : String(f.kind);
              }
              return row;
            }),
          };
        }
        // The rules half is answered only when the panel actually sent rules, so the
        // specs that do not use them keep judging the run they always did.
        if (method === "POST" && /\/verdict$/.test(url)) {
          return body && body.rules && body.rules.length ? RULE_VERDICT : VERDICT;
        }
        if (method === "POST" && /\/compare$/.test(url)) return COMPARISON;
        if (method === "GET" && /\/playground\/scenarios\?/.test(url)) return scenarios;
        if (method === "GET" && /\/playground\/scenarios\/[\w-]+$/.test(url)) return SCENARIO;
        if (method === "POST" && /\/playground\/scenarios$/.test(url)) {
          scenarios = [{ id: body.id, name: body.name, processId: body.processId, savedAt: 2, hasBaseline: false }];
          return scenarios[0];
        }
        if (method === "PUT" && /\/baseline$/.test(url)) return { id: "nightly", hasBaseline: true };
        if (method === "DELETE" && /\/playground\/scenarios\//.test(url)) { scenarios = []; return { deleted: true }; }
        if (method === "DELETE" && /\/playground\/sessions\//.test(url)) return { closed: true };
        return {};
      };

      // The CSV upload is the one call that cannot go through the api() helper: it
      // is multipart, and the helper JSON-encodes its body. Intercepting fetch is
      // how the harness sees it at all — and the shape of that request (a "file"
      // part and an "arrival" field) is exactly what is worth pinning.
      const realFetch = window.fetch.bind(window);
      window.fetch = async (input, init) => {
        const url = typeof input === "string" ? input : input.url;
        if (init && init.method === "POST" && /\/runs\/csv$/.test(url)) {
          const form = init.body;
          window.__calls.push({ method: "POST", url, body: {
            file: form.get("file") && form.get("file").name,
            arrival: JSON.parse(form.get("arrival")),
          } });
          batch = { polls: 0, cancelled: false };
          return new Response(JSON.stringify(runStatus()), { status: 202,
            headers: { "Content-Type": "application/json" } });
        }
        return realFetch(input, init);
      };

      // A test about paging needs more cases than the three the rest of the fixture
      // is built around. The report is moved with them, so the numbers on screen and
      // the rows under them keep telling the same story.
      window.__setCases = (n) => {
        CASES = makeCases(n);
        REPORT.cases = n;
        REPORT.completed = n - Math.floor(n / 3);
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__leave = () => cleanup();
      window.__ready = true;
    </script>
  </body>
</html>
