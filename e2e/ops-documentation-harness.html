<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Operations documentation e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountInstanceReplay against a mock `api`, on
         a model whose process and elements carry <bpmn:documentation> (ADR-0025). The
         replay already imports the diagram to render it, so the prose is in the browser:
         the Details tab reads it straight off the model, for elements this instance ran
         and for one it never reached. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
      /* The replay is read-only; hide the editing palette so element clicks in the
         test land on the shapes rather than being intercepted by it. The token legend
         floats over the canvas bottom, where this diagram's un-taken branch sits, so it
         is hidden for the same reason — neither is what these tests are about. */
      .djs-palette, .token-legend { display: none !important; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountInstanceReplay } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const T = 1_722_260_303_000;
      const ns = (ms) => ms * 1e6;

      const INSTANCE = "281474978841611";
      window.__INSTANCE = INSTANCE;

      // Start_1 → Gateway_1 → Task_check → End_1 ran; Task_escalate is the branch this
      // instance did not take, so its documentation is only reachable from the diagram.
      // Gateway_1 carries none, to prove an undocumented element shows no block.
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_doc" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="dokumentiert" name="Dokumentierter Prozess" isExecutable="true">
    <bpmn:documentation>Bearbeitet Anträge von der Prüfung bis zur Auszahlung.</bpmn:documentation>
    <bpmn:startEvent id="Start_1" name="Antrag geht ein">
      <bpmn:documentation>Startet, sobald der Antrag im Portal eingeht.</bpmn:documentation>
      <bpmn:outgoing>f0</bpmn:outgoing>
    </bpmn:startEvent>
    <bpmn:exclusiveGateway id="Gateway_1" name="Vollständig?">
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:userTask id="Task_check" name="Prüfen">
      <bpmn:documentation>Vergleiche die Angaben mit den Anlagen.

Bei fehlenden Unterlagen ablehnen.</bpmn:documentation>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:userTask id="Task_escalate" name="Eskalieren">
      <bpmn:documentation>Nur bei unvollständigen Anträgen: an die Fachaufsicht abgeben.</bpmn:documentation>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:endEvent id="End_1" name="Fertig"><bpmn:incoming>f3</bpmn:incoming><bpmn:incoming>f4</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Gateway_1"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Gateway_1" targetRef="Task_check"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Gateway_1" targetRef="Task_escalate"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Task_check" targetRef="End_1"/>
    <bpmn:sequenceFlow id="f4" sourceRef="Task_escalate" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="dokumentiert">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Gateway_1_di" bpmnElement="Gateway_1"><dc:Bounds x="255" y="113" width="50" height="50"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_check_di" bpmnElement="Task_check"><dc:Bounds x="360" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_escalate_di" bpmnElement="Task_escalate"><dc:Bounds x="360" y="240" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="520" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="255" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="305" y="138"/><di:waypoint x="360" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="280" y="163"/><di:waypoint x="280" y="280"/><di:waypoint x="360" y="280"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="460" y="138"/><di:waypoint x="520" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="460" y="280"/><di:waypoint x="538" y="280"/><di:waypoint x="538" y="156"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const step = (elementId, type, i) => ({
        elementId,
        elementInstanceKey: String(1000 + i),
        at: ns(T + i * 1000),
        endAt: ns(T + i * 1000 + 500),
        position: i + 1,
        type,
        tokenId: "1",
      });
      const steps = [
        step("Start_1", "bpmn:StartEvent", 0),
        step("Gateway_1", "bpmn:ExclusiveGateway", 1),
        step("Task_check", "bpmn:UserTask", 2),
        step("End_1", "bpmn:EndEvent", 3),
      ];
      const frames = steps.map((s, i) => ({
        position: i + 1, at: s.at,
        tokens: i < steps.length - 1 ? [{ elementId: s.elementId, tokenId: "1", state: "active" }] : [],
      }));

      const api = async (method, url) => {
        if (/\/instances\/\d+\/timeline$/.test(url)) {
          return { processDefKey: "docdef", processId: "dokumentiert", version: 1, state: "completed", steps, frames };
        }
        if (/\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (url.includes("/runtime")) return { elements: [] };
        if (/\/instances\/\d+\/decisions$/.test(url)) return [];
        return {};
      };

      window.__mount = (key = INSTANCE) => mountInstanceReplay(view, { api, toast: noop, key });
      window.__ready = true;
    </script>
  </body>
</html>
