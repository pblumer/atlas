<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas worker fields modeler e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api`, with a
         diagram holding Teams Phone and Entra tasks, to verify that a Worker Type's
         extension states only what the chosen operation uses: a field the operation
         hides is not left behind on the element, where the panel can no longer show
         or clear it and the compiler refuses it. Mounted in deployment mode (key set,
         draftId null) so no live collaboration SSE is attached.

         Activity_plain    a service task with no Worker Type yet
         Activity_account  Teams Phone, Ensure resource account, every field filled in
         Activity_resolve  Teams Phone, Resolve users
         Activity_stale    Teams Phone, Resolve users still carrying the accountType an
                           earlier Modeler wrote — the model as it reached the report
         Activity_licence  Entra, Assign licence, its body given both inline and by a
                           variable — two alternatives, each hiding the other
         Activity_csv      CSV, a delimited file with its column names — a field the
                           catalog describes twice, as names and as name:width
         Activity_sharepoint SharePoint as a model authored before operations existed:
                           no operation attribute, a list and one column
         Activity_sp_explicit SharePoint naming create-item outright, a list and one column -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_fields" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="felder" name="Test Worker fields" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="Activity_plain" name="Neu">
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_account" name="Konto">
      <bpmn:extensionElements><atlas:teamsPhoneConnector connector="ucc_teams" operation="ensure-resource-account" userPrincipalName="=upn" displayName="=name" accountType="auto-attendant" resultVariable="konto"/></bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_resolve" name="Agents">
      <bpmn:extensionElements><atlas:teamsPhoneConnector connector="ucc_teams" operation="resolve-users" users="=agents" resultVariable="agentIds"/></bpmn:extensionElements>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_stale" name="Alt">
      <bpmn:extensionElements><atlas:teamsPhoneConnector connector="ucc_teams" operation="resolve-users" users="=agents" accountType="call-queue" resultVariable="ids"/></bpmn:extensionElements>
      <bpmn:incoming>f3</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_licence" name="Lizenz">
      <bpmn:extensionElements><atlas:entraConnector connector="contoso" operation="assign-license" userId="=upn" attributes='{"addLicenses":[]}' attributesVariable="lizenzen"/></bpmn:extensionElements>
      <bpmn:incoming>f4</bpmn:incoming><bpmn:outgoing>f5</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_csv" name="Einlesen">
      <bpmn:extensionElements><atlas:csvConnector source="csvText" delimiter=";" hasHeader="false" columns="email,group,license" resultVariable="rows"/></bpmn:extensionElements>
      <bpmn:incoming>f5</bpmn:incoming><bpmn:outgoing>f6</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_sharepoint" name="Erfassen">
      <bpmn:extensionElements><atlas:sharePointConnector connector="intranet" site="https://contoso.sharepoint.com/sites/hr" list="Auftraege" resultVariable="angelegt"><atlas:itemField name="Title" value="=betreff"/></atlas:sharePointConnector></bpmn:extensionElements>
      <bpmn:incoming>f6</bpmn:incoming><bpmn:outgoing>f7</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_sp_explicit" name="Protokoll">
      <bpmn:extensionElements><atlas:sharePointConnector connector="intranet" operation="create-item" site="https://contoso.sharepoint.com/sites/hr" list="Protokoll"><atlas:itemField name="Title" value="=betreff"/></atlas:sharePointConnector></bpmn:extensionElements>
      <bpmn:incoming>f7</bpmn:incoming><bpmn:outgoing>f8</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f8</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_plain"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_plain" targetRef="Activity_account"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Activity_account" targetRef="Activity_resolve"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Activity_resolve" targetRef="Activity_stale"/>
    <bpmn:sequenceFlow id="f4" sourceRef="Activity_stale" targetRef="Activity_licence"/>
    <bpmn:sequenceFlow id="f5" sourceRef="Activity_licence" targetRef="Activity_csv"/>
    <bpmn:sequenceFlow id="f6" sourceRef="Activity_csv" targetRef="Activity_sharepoint"/>
    <bpmn:sequenceFlow id="f7" sourceRef="Activity_sharepoint" targetRef="Activity_sp_explicit"/>
    <bpmn:sequenceFlow id="f8" sourceRef="Activity_sp_explicit" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="felder">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_plain_di" bpmnElement="Activity_plain"><dc:Bounds x="250" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_account_di" bpmnElement="Activity_account"><dc:Bounds x="400" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_resolve_di" bpmnElement="Activity_resolve"><dc:Bounds x="550" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_stale_di" bpmnElement="Activity_stale"><dc:Bounds x="700" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_licence_di" bpmnElement="Activity_licence"><dc:Bounds x="850" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_csv_di" bpmnElement="Activity_csv"><dc:Bounds x="1000" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_sharepoint_di" bpmnElement="Activity_sharepoint"><dc:Bounds x="1150" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_sp_explicit_di" bpmnElement="Activity_sp_explicit"><dc:Bounds x="1300" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="1450" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="250" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="350" y="138"/><di:waypoint x="400" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="500" y="138"/><di:waypoint x="550" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="650" y="138"/><di:waypoint x="700" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="800" y="138"/><di:waypoint x="850" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f5_di" bpmnElement="f5"><di:waypoint x="950" y="138"/><di:waypoint x="1000" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f6_di" bpmnElement="f6"><di:waypoint x="1100" y="138"/><di:waypoint x="1150" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f7_di" bpmnElement="f7"><di:waypoint x="1250" y="138"/><di:waypoint x="1300" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f8_di" bpmnElement="f8"><di:waypoint x="1400" y="138"/><di:waypoint x="1450" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return [];
        if (method === "GET" && /\/configured-workers$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      // The exported XML is what the deploy sends, so the tests assert against it.
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
