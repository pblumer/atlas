<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas decision picker e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api` whose
         decision catalog holds two decisions that share an id ("stufe") and differ
         only in the model they live in (ADR-0050 / ADR-0072: several DMN models per
         process, so a decision id is unique per model, not engine-wide). The picker
         identifies a pick by a composite key of modelRef + id, which is what these
         tests exercise: picking the second "stufe" must adopt the second model's
         decision, with its inputs and its result variable. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_pick" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="picker" name="Test Decision Picker" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:businessRuleTask id="Activity_rule" name="Einstufen">
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f1</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_rule"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_rule" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="picker">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_rule_di" bpmnElement="Activity_rule"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="420" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="420" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // Two decisions, one id. They differ in the model they come from, in their
      // declared inputs and in their output — so which one a pick adopted is
      // visible in the task's input mappings and result variable.
      const CATALOG = [
        {
          id: "stufe", name: "Einstufung", model: "Alter", modelRef: "dmn/alter",
          inputs: [{ name: "alter" }], output: { name: "stufeNachAlter" },
        },
        {
          id: "stufe", name: "Einstufung", model: "Einkommen", modelRef: "dmn/einkommen",
          inputs: [{ name: "einkommen" }], output: { name: "stufeNachEinkommen" },
        },
      ];

      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return CATALOG;
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
