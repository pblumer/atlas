<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas form-editor e2e harness</title>
    <!-- Drives the real api/web/form-editor.js mountFormEditor against a mock `api`.
         Two things are tested through it: superseding a mount mid-load (as a navigation
         would) to prove it bails before building the form-js Playground, and — via
         __mountReal, whose form carries an actual field — how the Playground's
         properties panel is styled once it is up. -->
    <link rel="stylesheet" href="/app.css" />
    <!-- The editor is mounted into a full-height page here, as the router gives it. -->
    <style>html, body { margin: 0; height: 100%; } #view { height: 100vh; }</style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import { mountFormEditor, cleanup } from "/form-editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      // A mock api whose form-definition load can be stalled, so the test can
      // navigate away (call cleanup) while mountFormEditor is still awaiting it.
      function makeApi(formsDelay, components = []) {
        return async (method, url) => {
          if (/\/forms\/[^/]+$/.test(url)) {
            if (formsDelay) await wait(formsDelay);
            return { id: "form-x", name: "Test Form", schema: { type: "default", components } };
          }
          if (url.endsWith("/projects")) return [];
          return {};
        };
      }

      window.__mount = (formsDelay) =>
        mountFormEditor(view, { api: makeApi(formsDelay), toast: noop, formId: "form-x" });

      // A form with one real field, so selecting it fills the properties panel with the
      // groups whose styling is under test. Only a text field is needed: what matters is
      // that some of its groups have entries set (General, Validation) and some do not
      // (Condition, Layout, Appearance, Custom properties) — form-js marks the latter
      // `empty`, and that flag is what used to collide with a style of ours.
      window.__mountReal = () =>
        mountFormEditor(view, {
          api: makeApi(0, [{ type: "textfield", key: "vorname", label: "Vorname" }]),
          toast: noop, formId: "form-x",
        });
      // A form left in the state the old editor produced: stored as "form-mtjs4", but
      // carrying "frm_jira_ticket_new" in its schema because the Design pane's ID field
      // edited the document and nothing else. The chip used to show one id and the
      // properties panel the other; now there is one id, and it is the stored one on
      // open (ADR-0222). Saves are captured rather than sent.
      // A form with a department select and a plain text field, against a server that
      // offers the Entra users source and two Workers — one open to forms, one not
      // (ADR-0473). Saves and every call are captured.
      window.__calls = [];
      // __mountDirectory opens a form with a static select (the department), a second
      // static select to turn into a remote one, a radio group and — with legacy — a
      // directory field saved as a textfield, the shape such fields were saved in first.
      window.__mountDirectory = ({ legacy } = {}) => {
        const sources = {
          providers: [{ workerType: "entra", resource: "users", label: "Microsoft Entra ID — users",
            valueProperty: "id",
            searchable: ["displayName", "givenName", "surname", "mail", "userPrincipalName"],
            filterable: ["department", "jobTitle"],
            readable: ["id", "displayName", "givenName", "surname", "mail", "userPrincipalName", "department", "jobTitle"],
            defaultLabel: "displayName", defaultDescription: "mail", fallback: "userPrincipalName", valueFormat: "an Entra object id (a GUID)" }],
          workers: [
            { name: "contoso", workerType: "entra", enabled: true, formLookups: false },
            { name: "ucc_entra", workerType: "entra", enabled: true, formLookups: true },
          ],
        };
        const api = async (method, url, body) => {
          window.__calls.push({ method, url });
          if (url.endsWith("/api/v1/form-data/sources")) return sources;
          if (/\/forms\/[^/]+\/availability$/.test(url)) return { id: "form-dir", available: true };
          if (method === "GET" && /\/forms\/[^/]+$/.test(url)) {
            return { id: "form-dir", name: "Person", projectId: "", schema: { type: "default", id: "form-dir", components: [
              { type: "select", id: "Field_abteilung", key: "abteilung", label: "Abteilung",
                values: [{ label: "IT", value: "IT" }, { label: "Finanzen", value: "Finance" }] },
              { type: "select", id: "Field_wer", key: "wer", label: "Wer",
                values: [{ label: "Value", value: "value" }] },
              { type: "radio", id: "Field_dringlichkeit", key: "dringlichkeit", label: "Dringlichkeit",
                values: [{ label: "Hoch", value: "high" }, { label: "Normal", value: "normal" }] },
              ...(legacy ? [{ type: "textfield", id: "Field_alt", key: "alt", label: "Alt",
                validate: { required: true, validationType: "email", minLength: 2 },
                appearance: { prefixAdorner: "@" },
                atlasDataSource: { version: 1, workerType: "entra", worker: "ucc_entra", resource: "users" } }] : []),
            ] } };
          }
          if (method === "POST" && url.endsWith("/forms")) {
            window.__saved = JSON.parse(JSON.stringify(body));
            return { id: body.id, name: body.name, renamedFrom: "" };
          }
          if (url.endsWith("/projects") || url.endsWith("/applications")) return [];
          return {};
        };
        return mountFormEditor(view, { api, toast: noop, formId: "form-dir" });
      };
      window.__saved = null;
      // __mountDecisions opens a form with a static select, a radio group, a checklist
      // and a tag list, against a server whose picker offers two decisions without inputs
      // (ADR-0511). What each decision answers is the
      // spec's to say, through page.route on the options route — the editor fetches it
      // there, as the runtime does. With `named` (a decision id, or true for
      // Kostenstellen), the select already takes its options from that decision.
      window.__mountDecisions = ({ named } = {}) => {
        const decisions = { decisions: [
          { id: "Kostenstellen", name: "Kostenstellen", model: "Stammdaten", inputs: [] },
          { id: "Länder", name: "Länder", model: "Stammdaten", inputs: [] },
          { id: "Regionen", name: "Regionen", model: "Geo", inputs: [{ name: "land", type: "string" }] },
        ] };
        const api = async (method, url, body) => {
          window.__calls.push({ method, url });
          if (url.endsWith("/api/v1/form-data/decisions")) return decisions;
          if (url.endsWith("/api/v1/form-data/sources")) return { providers: [], workers: [] };
          if (/\/forms\/[^/]+\/availability$/.test(url)) return { id: "form-dmn", available: true };
          if (method === "GET" && /\/forms\/[^/]+$/.test(url)) {
            return { id: "form-dmn", name: "Bestellung", projectId: "", schema: { type: "default", id: "form-dmn", components: [
              { type: "select", id: "Field_ks", key: "kostenstelle", label: "Kostenstelle",
                ...(named ? { atlasDecision: { version: 1, decisionId: named === true ? "Kostenstellen" : named } } : { values: [{ label: "Value", value: "value" }] }) },
              { type: "radio", id: "Field_land", key: "land", label: "Land",
                values: [{ label: "Value", value: "value" }] },
              { type: "checklist", id: "Field_tags", key: "tags", label: "Tags",
                values: [{ label: "Value", value: "value" }] },
              { type: "taglist", id: "Field_more", key: "more", label: "Mehr",
                values: [{ label: "Value", value: "value" }] },
            ] } };
          }
          if (method === "POST" && url.endsWith("/forms")) {
            window.__saved = JSON.parse(JSON.stringify(body));
            return { id: body.id, name: body.name, renamedFrom: "" };
          }
          if (url.endsWith("/projects") || url.endsWith("/applications")) return [];
          return {};
        };
        return mountFormEditor(view, { api, toast: noop, formId: "form-dmn" });
      };
      // __mountMailView opens a form with an e-mail view (ADR-0489) and a
      // text field; saves are captured.
      window.__mountMailView = () => {
        const api = async (method, url, body) => {
          if (/\/forms\/[^/]+\/availability$/.test(url)) return { id: "form-mail", available: true };
          if (method === "GET" && /\/forms\/[^/]+$/.test(url)) {
            return { id: "form-mail", name: "Mail prüfen", projectId: "", schema: { type: "default", id: "form-mail", components: [
              { type: "mailview", id: "Field_mail", key: "mail", label: "E-Mail" },
              { type: "textfield", id: "Field_note", key: "note", label: "Notiz" },
            ] } };
          }
          if (method === "POST" && url.endsWith("/forms")) {
            window.__saved = JSON.parse(JSON.stringify(body));
            return { id: body.id, name: body.name, renamedFrom: "" };
          }
          if (url.endsWith("/projects") || url.endsWith("/applications")) return [];
          return {};
        };
        return mountFormEditor(view, { api, toast: noop, formId: "form-mail" });
      };
      window.__mountDivergent = () => {
        const api = async (method, url, body) => {
          if (/\/forms\/[^/]+\/availability$/.test(url)) {
            const id = decodeURIComponent(url.split("/").slice(-2)[0]);
            return { id, available: true };
          }
          if (method === "GET" && /\/forms\/[^/]+$/.test(url)) {
            return {
              id: "form-mtjs4", name: "JIRA Ticket erstellen", projectId: "",
              schema: { type: "default", id: "frm_jira_ticket_new", components: [] },
            };
          }
          if (method === "POST" && url.endsWith("/forms")) {
            window.__saved = JSON.parse(JSON.stringify(body));
            return { id: body.id, name: body.name, renamedFrom: "" };
          }
          if (url.endsWith("/projects") || url.endsWith("/applications")) return [];
          return {};
        };
        return mountFormEditor(view, { api, toast: noop, formId: "form-mtjs4" });
      };
      // Reached by pressing "Create a new form" on a step in the Modeler: the router
      // hands mountFormEditor a generateFor, and the generator must already be open —
      // that click was the author saying what the form is for, and asking them to press
      // a second button to say it again is the thing this avoids.
      const GEN_XML = `<?xml version="1.0"?>
        <bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL">
          <bpmn:process id="urlaubsantrag" name="Urlaubsantrag">
            <bpmn:userTask id="Task_Melden" name="Abwesenheit melden" />
          </bpmn:process>
        </bpmn:definitions>`;
      window.__generated = null;
      function generatingApi(workers) {
        return async (method, url, body) => {
          if (method === "GET" && url === "/api/v1/forms/generate/workers") {
            return { available: workers.length > 0, workers };
          }
          if (method === "GET" && url === "/api/v1/drafts") {
            return [{ processId: "urlaubsantrag", name: "Urlaubsantrag" }];
          }
          if (method === "GET" && url === "/api/v1/processes") return [];
          if (method === "GET" && url.endsWith("/xml")) return GEN_XML;
          if (method === "POST" && url === "/api/v1/forms/generate") {
            window.__generated = JSON.parse(JSON.stringify(body));
            return {
              schema: { type: "default", id: body.formId, components: [{ type: "textfield", key: "grund", label: "Grund" }] },
              worker: "haus", model: "claude-opus-5",
            };
          }
          if (/\/forms\/[^/]+\/availability$/.test(url)) return { id: "x", available: true };
          if (url.endsWith("/projects") || url.endsWith("/applications")) return [];
          return {};
        };
      }
      window.__mountGenerate = (workers = [{ name: "haus", model: "claude-opus-5" }]) =>
        mountFormEditor(view, {
          api: generatingApi(workers), toast: noop,
          generateFor: { processId: "urlaubsantrag", elementId: "Task_Melden" },
        });

      window.__save = () => document.getElementById("form-save").click();
      window.__cleanup = cleanup; // stands in for the navigation teardown (route → __atlasCleanup)
      window.__ready = true;
    </script>
  </body>
</html>
