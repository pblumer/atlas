<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas message sources modeler e2e harness</title>
    <!-- Drives the *real* api/web/editor.js — the Modeler (mountEditor) and the live view
         (mountLive) — against a mock `api` whose GET /api/v1/message-sources answers rows
         of all three kinds ADR-0429 §6 gives it: inbound watches (two of them written the
         way a server older than `sourceKind` writes them, without it), product actions,
         and the deployed processes waiting for a message.

         The diagram's process id is chosen per mount, so one diagram is either the process
         a catalogue product binds (mailbox-lifecycle, the product actions' processId) or
         one no product binds. It holds an element of every shape the picker and the shop
         badge tell apart: a receive task waiting for a product's message and one waiting
         for a watch's, a catch and a throw with no message yet, a shop send task and a
         message send task. Mounted in deployment mode (key set, draftId null) so no live
         collaboration SSE is attached. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor, mountLive } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      // Receive_extend waits for the Mailbox product's storage-extend message and
      // Receive_plain for a name an inbound watch publishes; Catch_new and Throw_new carry a
      // message definition and no message yet; Send_shop states how storage-extend ended;
      // Send_msg publishes a declared message.
      const xmlFor = (pid) => `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_sources" targetNamespace="http://atlas/bpmn">
  <bpmn:message id="Message_extend" name="mailbox.storage.extend"/>
  <bpmn:message id="Message_order" name="order.placed"/>
  <bpmn:message id="Message_done" name="mailbox.done"/>
  <bpmn:process id="${pid}" name="Mailbox" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:receiveTask id="Receive_extend" name="Extend storage" messageRef="Message_extend"><bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing></bpmn:receiveTask>
    <bpmn:receiveTask id="Receive_plain" name="Order placed" messageRef="Message_order"><bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing></bpmn:receiveTask>
    <bpmn:intermediateCatchEvent id="Catch_new" name="Wait"><bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing><bpmn:messageEventDefinition id="MED_catch"/></bpmn:intermediateCatchEvent>
    <bpmn:sendTask id="Send_shop" name="Report extended">
      <bpmn:extensionElements><atlas:shopTask mode="outcome" action="storage-extend" outcome="completed"/></bpmn:extensionElements>
      <bpmn:incoming>f3</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
    </bpmn:sendTask>
    <bpmn:sendTask id="Send_msg" name="Announce" messageRef="Message_done"><bpmn:incoming>f4</bpmn:incoming><bpmn:outgoing>f5</bpmn:outgoing></bpmn:sendTask>
    <bpmn:intermediateThrowEvent id="Throw_new" name="Tell"><bpmn:incoming>f5</bpmn:incoming><bpmn:outgoing>f6</bpmn:outgoing><bpmn:messageEventDefinition id="MED_throw"/></bpmn:intermediateThrowEvent>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f6</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Receive_extend"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Receive_extend" targetRef="Receive_plain"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Receive_plain" targetRef="Catch_new"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Catch_new" targetRef="Send_shop"/>
    <bpmn:sequenceFlow id="f4" sourceRef="Send_shop" targetRef="Send_msg"/>
    <bpmn:sequenceFlow id="f5" sourceRef="Send_msg" targetRef="Throw_new"/>
    <bpmn:sequenceFlow id="f6" sourceRef="Throw_new" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="${pid}">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="60" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Receive_extend_di" bpmnElement="Receive_extend"><dc:Bounds x="140" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Receive_plain_di" bpmnElement="Receive_plain"><dc:Bounds x="280" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Catch_new_di" bpmnElement="Catch_new"><dc:Bounds x="422" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Send_shop_di" bpmnElement="Send_shop"><dc:Bounds x="500" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Send_msg_di" bpmnElement="Send_msg"><dc:Bounds x="640" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Throw_new_di" bpmnElement="Throw_new"><dc:Bounds x="782" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="862" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="96" y="138"/><di:waypoint x="140" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="240" y="138"/><di:waypoint x="280" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="380" y="138"/><di:waypoint x="422" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="458" y="138"/><di:waypoint x="500" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="600" y="138"/><di:waypoint x="640" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f5_di" bpmnElement="f5"><di:waypoint x="740" y="138"/><di:waypoint x="782" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f6_di" bpmnElement="f6"><di:waypoint x="818" y="138"/><di:waypoint x="862" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // The listing. Three inbound watches, two of them without a sourceKind as an older
      // server sends them (the HR one is off); three actions of the Mailbox product, bound
      // to mailbox-lifecycle, one of whose messages the diagram already declares; and the
      // deployed processes waiting for a message — invoice.paid by two of them, and the
      // declared mailbox.done and mailbox.storage.extend by one each.
      const SOURCES = [
        { messageName: "jira.ticket.created", connectorId: "w-jira", connectorName: "ServiceDesk", kind: "jira", enabled: true },
        { messageName: "employee.created", connectorId: "w-hr", connectorName: "HR", kind: "googlesheets", enabled: false },
        { sourceKind: "inbound-watch", messageName: "order.placed", connectorId: "w-clio", connectorName: "Orders", kind: "clio", description: "stream orders", enabled: true },
        { sourceKind: "product-action", messageName: "mailbox.storage.extend", enabled: true,
          productId: "mailbox", productName: "Mailbox", action: "storage-extend", effect: "change", triggers: ["customer"], processId: "mailbox-lifecycle" },
        { sourceKind: "product-action", messageName: "mailbox.password.reset", enabled: true,
          productId: "mailbox", productName: "Mailbox", action: "password-reset", effect: "service", triggers: ["customer", "operator"], processId: "mailbox-lifecycle" },
        { sourceKind: "product-action", messageName: "mailbox.provision", enabled: true,
          productId: "mailbox", productName: "Mailbox", action: "provision", effect: "provision", triggers: ["customer"], processId: "mailbox-lifecycle" },
        { sourceKind: "process", messageName: "invoice.paid", enabled: true, processId: "dunning", elementId: "Start_paid", element: "start" },
        { sourceKind: "process", messageName: "invoice.paid", enabled: true, processId: "billing", elementId: "Catch_paid", element: "catch" },
        { sourceKind: "process", messageName: "mailbox.done", enabled: true, processId: "archive", elementId: "Catch_done", element: "catch" },
        { sourceKind: "process", messageName: "mailbox.storage.extend", enabled: true, processId: "mailbox-lifecycle", elementId: "Receive_extend", element: "catch" },
      ];

      // __failSources makes the listing fail; __holdSources keeps it pending until
      // __releaseSources(), so a test can watch what arrives late.
      window.__sourceCalls = 0;
      window.__failSources = false;
      window.__holdSources = false;
      let held = [];
      window.__releaseSources = () => { const h = held; held = []; h.forEach((r) => r()); };
      const listing = async () => {
        window.__sourceCalls++;
        if (window.__holdSources) await new Promise((r) => held.push(r));
        if (window.__failSources) throw new Error("unreachable");
        return SOURCES;
      };

      let served = xmlFor("mailbox-lifecycle");
      const page = (items) => ({ items, total: items.length, totalExact: true, truncated: false });
      const api = async (method, url) => {
        if (method === "GET" && /\/message-sources$/.test(url)) return listing();
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return served;
        if (method === "GET" && url === "/api/v1/processes") return [{ key: 42, processId: "mailbox-lifecycle", name: "Mailbox", version: 1 }];
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return [];
        if (method === "GET" && url.startsWith("/api/v1/instances?process=")) return page([]);
        if (method === "GET" && url.startsWith("/api/v1/tasks")) return page([]);
        if (method === "GET" && url.includes("/runtime")) {
          return { instances: 0, finished: 0, tokens: 0, incidents: [], incidentsTruncated: false, elements: [] };
        }
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };
      const apiRaw = async (method, url, body) => ({ data: await api(method, url, body), headers: new Headers() });

      // __mount opens the Modeler on the diagram filed under processId: the product-bound
      // mailbox-lifecycle unless the test names another.
      window.__mount = (processId) => {
        served = xmlFor(processId || "mailbox-lifecycle");
        return mountEditor(view, { api, toast: noop, key: 42 });
      };
      // __mountLive opens the live view, a read-only runtime view, on the same diagram.
      window.__mountLive = () => {
        served = xmlFor("mailbox-lifecycle");
        return mountLive(view, { api, apiRaw, toast: noop, key: 42 });
      };
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      // The exported XML is what the deploy sends, so the tests assert against it.
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
