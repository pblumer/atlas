<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas LDAP and SQL document modeler e2e harness</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_docs" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="docs-export" name="Docs export" isExecutable="true">
    <bpmn:startEvent id="Start_1"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="Activity_search" name="Read people">
      <bpmn:extensionElements><atlas:ldapConnector url="ldaps://ldap.example.com:636" operation="search" baseDN="ou=people,dc=x" filter="(objectClass=person)" resultVariable="personen"/></bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_query" name="Read staff">
      <bpmn:extensionElements><atlas:mssqlConnector connector="hr" operation="query" statement="SELECT personalnummer, mail FROM mitarbeitende" resultVariable="mitarbeitende"/></bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_apply" name="Apply corrections">
      <bpmn:extensionElements><atlas:csvConnector source="datei" resultVariable="rows"/></bpmn:extensionElements>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:endEvent id="End_1"><bpmn:incoming>f3</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_search"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_search" targetRef="Activity_query"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Activity_query" targetRef="Activity_apply"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Activity_apply" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="docs-export">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_search_di" bpmnElement="Activity_search"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_query_di" bpmnElement="Activity_query"><dc:Bounds x="420" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_apply_di" bpmnElement="Activity_apply"><dc:Bounds x="580" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="740" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="420" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="520" y="138"/><di:waypoint x="580" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="680" y="138"/><di:waypoint x="740" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/connector-kinds$/.test(url)) return { kinds: [{ id: "ldap", placement: "worker" }, { id: "mssql", placement: "worker" }, { id: "csv", placement: "worker" }] };
        if (method === "GET" && /\/(connectors|configured-workers)$/.test(url)) return [];
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      const select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      window.__selectSearch = () => select("Activity_search");
      window.__selectQuery = () => select("Activity_query");
      window.__selectApply = () => select("Activity_apply");
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
