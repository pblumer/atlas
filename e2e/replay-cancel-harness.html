<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas cancel-instance on the replay e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountInstanceReplay against a mock `api`,
         so the test can exercise the replay's own Cancel instance button: the act the
         live view already offers (DELETE /api/v1/instances/{key}), asked for where the
         operator has just read why the instance must be stopped. The mock records every
         call, so a declined confirmation is provably a call that was never made. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
      .djs-palette { display: none !important; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import { mountInstanceReplay } from "/editor.js";

      const view = document.getElementById("view");
      const T = 1_722_260_303_000; // fixed wall-clock (ms) so timestamps are deterministic
      const ns = (ms) => ms * 1e6;

      const INSTANCE = "281474978841611";
      window.__INSTANCE = INSTANCE;

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_c" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="support" name="Support Request" isExecutable="true">
    <bpmn:startEvent id="start" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:userTask id="review" name="Review"><bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing></bpmn:userTask>
    <bpmn:endEvent id="done" name="Done"><bpmn:incoming>f1</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="start" targetRef="review"/>
    <bpmn:sequenceFlow id="f1" sourceRef="review" targetRef="done"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="support">
    <bpmndi:BPMNShape id="start_di" bpmnElement="start"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="review_di" bpmnElement="review"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="done_di" bpmnElement="done"><dc:Bounds x="420" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="420" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      function step(elementId, type, i) {
        return {
          elementId, type,
          elementInstanceKey: String(1000 + i),
          at: ns(T + i * 1000),
          endAt: i === 1 ? 0 : ns(T + i * 1000 + 500), // the token is still parked on "review"
          position: i + 1,
          tokenId: "1",
          variables: [],
        };
      }

      // Parked on the user task: the shape of an instance an operator would cancel.
      const TIMELINE = {
        processDefKey: "1002", processId: "support", version: 3, versionTag: "",
        state: "active",
        steps: [step("start", "bpmn:StartEvent", 0), step("review", "bpmn:UserTask", 1)],
        frames: [
          { position: 1, at: ns(T), tokens: [{ elementId: "start", tokenId: "1", state: "active" }] },
          { position: 2, at: ns(T + 1000), tokens: [{ elementId: "review", tokenId: "1", state: "active" }] },
        ],
      };

      window.__calls = [];   // every call the view made, so "nothing happened" is testable
      window.__toasts = [];  // what the view told the operator
      window.__failCancel = false; // make the server refuse the termination

      const api = async (method, url) => {
        window.__calls.push(`${method} ${url}`);
        if (method === "DELETE" && url.match(/\/instances\/\d+$/)) {
          if (window.__failCancel) throw new Error("no active instance with that key");
          TIMELINE.state = "terminated";
          return { instanceKey: INSTANCE, state: "terminated" };
        }
        if (url.match(/\/instances\/\d+\/timeline$/)) return TIMELINE;
        if (url.match(/\/processes\/[\w-]+\/xml$/)) return XML;
        if (url.includes("/runtime")) return { elements: [] };
        if (url.match(/\/instances\/\d+\/decisions$/)) return [];
        if (url.match(/\/instances\/\d+\/data-objects$/)) return [];
        if (url.match(/\/instances\/\d+\/object-graph$/)) return { nodes: [], links: [], unresolved: [] };
        return {};
      };

      const toast = (msg, kind) => window.__toasts.push(`${kind || ""}:${msg}`);

      // The state the instance is in when the replay opens — "active" unless a test says
      // otherwise, since that is the only state either action is offered in.
      window.__mount = (state) => {
        TIMELINE.state = state || "active";
        window.__calls = [];
        window.__toasts = [];
        return mountInstanceReplay(view, { api, toast, key: INSTANCE });
      };
      // Let a test end the instance behind the view's back, the way the engine does when
      // it finishes on its own while somebody is replaying it.
      window.__setState = (state) => { TIMELINE.state = state; };
      window.__ready = true;
    </script>
  </body>
</html>
