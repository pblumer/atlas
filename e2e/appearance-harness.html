<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas appearance e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor and the *real* appearance.js
         against a mock `api`, with a diagram that carries one of most things bpmn-js
         draws — a pool, events of four kinds, three task types, both gateway kinds, a
         boundary event, an expanded sub-process, a data object, a text annotation and a
         default flow — so a shape the renderer paints without the configured colours
         shows up as the one light box on a dark canvas
         (ADR-0507). Mounted in deployment mode (key set, draftId
         null) so no live collaboration SSE is attached. The code sample below the
         canvas carries one span per token class the script, FEEL, JSON and Markdown
         editors colour with. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <div class="code-editor" id="code-sample">
      <pre class="ce-highlight"><span class="tok-comment"># c</span> <span class="tok-string">"s"</span> <span class="tok-number">1</span> <span class="tok-keyword">if</span> <span class="tok-literal">null</span> <span class="tok-builtin">sum</span> <span class="tok-cmdlet">Get-Item</span> <span class="tok-variable">$v</span> <span class="tok-punct">(</span> <span class="tok-operator">-eq</span> <span class="tok-parameter">-Path</span> <span class="tok-type">[int]</span> <span class="tok-member">.m</span> <span class="tok-text">t</span> <span class="tok-error">e</span> <span class="tok-md-head"># h</span> <span class="tok-md-bold">b</span> <span class="tok-md-em">e</span> <span class="tok-md-code">`c`</span> <span class="tok-md-link">l</span> <span class="tok-md-list">-</span> <span class="tok-md-quote">&gt;</span> <span class="tok-md-rule">---</span> <span class="tok-html-tag">&lt;p&gt;</span> <span class="tok-html-attr">a</span> <span class="tok-html-entity">&amp;amp;</span> <span class="tok-tpl-tag">{{#if}}</span></pre>
    </div>
    <script type="module">
      import { mountEditor } from "/editor.js";
      import { applyAppearance, watchSystemAppearance } from "/appearance.js";

      // The same two calls the console makes: index.html's bootstrap applies the
      // stored preference before paint, app.js keeps `system` following the OS.
      applyAppearance();
      watchSystemAppearance();
      window.__applyAppearance = applyAppearance;

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" id="Definitions_appearance" targetNamespace="http://atlas/bpmn">

      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="Sub_1_di" bpmnElement="Sub_1" isExpanded="true">
        <dc:Bounds x="650" y="110" width="330" height="180" />
      </bpmndi:BPMNShape>
      <bpmndi:BPMNShape id="SubStart_1_di" bpmnElement="SubStart_1">

      <bpmndi:BPMNShape id="SubTask_1_di" bpmnElement="SubTask_1">

      <bpmndi:BPMNShape id="Par_1_di" bpmnElement="Par_1">

        <di:waypoint x="716" y="200" /><di:waypoint x="760" y="200" />

      <bpmndi:BPMNEdge id="Flow_8_di" bpmnElement="Flow_8">

      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_9_di" bpmnElement="Flow_9">
        <di:waypoint x="550" y="258" /><di:waypoint x="550" y="330" />
      </bpmndi:BPMNEdge>
      <bpmndi:BPMNEdge id="Flow_10_di" bpmnElement="Flow_10">
        <di:waypoint x="600" y="370" /><di:waypoint x="652" y="370" />
      </bpmndi:BPMNEdge>
    </bpmndi:BPMNPlane>
  </bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/forms$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__ready = true;
    </script>
  </body>
</html>
