<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas dialog e2e harness</title>
    <!-- Drives the real api/web/dialog.js: the one dialog every view opens
         (ADR-draft-shared-ui-primitives). -->
    <link rel="stylesheet" href="/app.css" />
    <style>html, body { margin: 0; background: #fff; }</style>
  </head>
  <body>
    <button id="opener">Open</button>
    <button id="after">Somewhere else</button>
    <script type="module">
      import { openDialog } from "/dialog.js";

      window.__closed = [];
      window.__open = (opts = {}) => {
        const body = document.createElement("div");
        body.innerHTML = `<label>Name <input id="f-name" /></label>
          <p>Some explanation.</p><a href="#" id="a-link">A link</a>`;
        return openDialog({
          title: "Rename the thing",
          label: "Rename the thing",
          body,
          actions: [
            { label: "Cancel", kind: "ghost", value: null },
            { label: "Rename", kind: "primary", value: "renamed" },
          ],
          onClose: (v) => window.__closed.push(v),
          ...opts,
        });
      };
      window.__ready = true;
    </script>
  </body>
</html>
