<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Panorama impact-analysis e2e harness</title>
    <!-- Drives the *real* impactFrom from api/web/panorama-mesh.js directly, so the
         graph traversal can be tested case by case rather than only through a
         rendered mesh (ADR-0211 §6). No fetch, no layout, no DOM: the function is a
         pure function over a graph, and this harness keeps it testable as one. -->
  </head>
  <body>
    <div id="ready">loading</div>
    <script type="module">
      import {
        blastRanking, depthOf, impactFrom, impactList, impactOf, impactSummary,
        windowOverlap,
      } from "/panorama-mesh.js";
      // Exposed for the spec; the spec passes a graph and options and reads the
      // result back, so every case is a table row rather than a click sequence.
      window.impactFrom = (graph, id, opts) => impactFrom(graph, id, opts);
      // The three answers built over that walk: how bad the radius is, which nodes
      // are in it, and — without any selection at all — which node carries the most.
      window.impactSummary = (graph, id, opts) =>
        impactSummary(graph, impactFrom(graph, id, opts), id);
      window.impactList = (graph, id, opts, listOpts) =>
        impactList(graph, impactFrom(graph, id, opts), id, listOpts);
      window.blastRanking = (graph, opts) => blastRanking(graph, opts);
      // The same walk asked about several nodes at once — a maintenance window — and
      // the arithmetic that compares taking them down together with taking them down
      // one at a time.
      window.impactOf = (graph, ids, opts) => impactOf(graph, ids, opts);
      window.windowSummary = (graph, ids, opts) =>
        impactSummary(graph, impactOf(graph, ids, opts), null);
      window.windowList = (graph, ids, opts, listOpts) =>
        impactList(graph, impactOf(graph, ids, opts), null, listOpts);
      window.windowOverlap = (graph, ids, opts) => windowOverlap(graph, ids, opts);
      // How a typed depth is read. It is arithmetic over whatever a number field can
      // hold, so it is checked as arithmetic rather than by typing into one.
      window.depthOf = (value) => depthOf(value);
      document.getElementById("ready").textContent = "ready";
    </script>
  </body>
</html>
