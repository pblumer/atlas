<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Multi-Instance Explorer e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountInstanceReplay and mi-explorer.js
         against a mock `api` that answers the bounded multi-instance history routes
         (ADR-0517) for an instance with 50,000 iterations. The mock computes each
         page from the iteration number instead of holding 50,000 rows, the way the
         server's index does, and records every request so a test can prove the
         replay never asked for the full timeline. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
      #view { height: 100%; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import { mountInstanceReplay } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="D_mi" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="positions" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f_0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="Calc_1" name="Calculate positions">
      <bpmn:incoming>f_0</bpmn:incoming><bpmn:outgoing>f_1</bpmn:outgoing>
      <bpmn:multiInstanceLoopCharacteristics isSequential="false"/>
    </bpmn:serviceTask>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f_1</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f_0" sourceRef="Start_1" targetRef="Calc_1"/>
    <bpmn:sequenceFlow id="f_1" sourceRef="Calc_1" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="DD"><bpmndi:BPMNPlane id="P" bpmnElement="positions">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Calc_1_di" bpmnElement="Calc_1"><dc:Bounds x="260" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="440" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f_0_di" bpmnElement="f_0"><di:waypoint x="196" y="160"/><di:waypoint x="260" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f_1_di" bpmnElement="f_1"><di:waypoint x="360" y="160"/><di:waypoint x="440" y="160"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const KEY = "281474976723211";
      const BODY = "281474976799000";
      const N = 50000;
      const TERMINATED = new Set([37421, 40000, 45000]);
      const incidentAt = (n) => n % 5000 === 0;
      const stateOf = (n) => (TERMINATED.has(n) ? "terminated" : "completed");
      const keyOf = (n) => String(1_000_000 + n);
      const row = (n) => ({
        elementInstanceKey: keyOf(n), iteration: n, state: stateOf(n),
        activationPosition: 100 + n, endPosition: 200000 + n,
        incidentsRaised: incidentAt(n) ? 1 : 0, openIncidents: 0, openIncidentsExact: true,
      });
      const body = {
        bodyElementInstanceKey: BODY, elementId: "Calc_1", processDefinitionKey: "7", mode: "parallel",
        state: "completed", activationPosition: 4, endPosition: 300000, tokenId: "2", parentTokenId: "0",
        iterations: N, active: 0, completed: N - 3, terminated: 3, incidentsRaised: 10, iterationsWithIncidents: 10,
      };

      // matches is the server's filter; next yields the iterations from n on, in
      // loopCounter order, without materialising the ones skipped.
      function page(q) {
        const limit = Number(q.get("limit") || 100);
        const st = q.get("state") || "";
        const onlyInc = q.get("incidents") === "true";
        const exact = Number(q.get("iteration") || 0);
        const cursor = q.get("cursor");
        let n = cursor ? Number(cursor.slice(2)) + 1 : Number(q.get("from") || 1);
        const out = [];
        const ok = (i) => (!st || stateOf(i) === st) && (!onlyInc || incidentAt(i)) && (!exact || i === exact);
        for (; n <= N && out.length <= limit; n++) {
          if (exact && n > exact) break;
          if (ok(n)) out.push(row(n));
        }
        const more = out.length > limit;
        const rows = out.slice(0, limit);
        return { instanceKey: KEY, body, highWaterPosition: 300100, iterations: rows,
          nextCursor: more ? `c:${rows[rows.length - 1].iteration}` : undefined };
      }

      window.__requests = [];
      window.__scenario = { unavailable: false, failNext: 0 };

      const api = async (method, url) => {
        window.__requests.push(url);
        const u = new URL(url, location.origin);
        const fail = (status, code, message) => {
          const err = new Error(message); err.status = status; err.body = { error: message, code }; throw err;
        };
        if (/\/instances\/\d+\/multi-instances/.test(u.pathname) && window.__scenario.unavailable) {
          fail(409, "history_unavailable", "history unavailable");
        }
        if (/\/instances\/\d+\/outline$/.test(u.pathname)) {
          if (window.__scenario.noOutline) fail(409, "history_unavailable", "outline unavailable");
          // Start, the loop's body, and End: the 50,000 iterations are not in it.
          const step = (pos, id, eik, action, extra = {}) => ({ position: pos, at: (1_722_260_303_000 + pos) * 1e6, action,
            elementId: id, type: "bpmn:task", elementInstanceKey: eik, tokenId: "1", parentTokenId: "0", processDefinitionKey: "7", ...extra });
          return { instanceKey: KEY, processDefinitionKey: "7", instanceState: "completed", highWaterPosition: 300100, steps: [
            step(1, "Start_1", "500", "activated"), step(2, "Start_1", "500", "completed"),
            step(3, "Calc_1", BODY, "activated", { multiInstanceBody: true }),
            step(300000, "Calc_1", BODY, "completed", { multiInstanceBody: true }),
            step(300001, "End_1", "501", "activated"), step(300002, "End_1", "501", "completed"),
          ] };
        }
        // What the server says about where the full replay ends (--replay-full-max-iterations).
        if (u.pathname === "/api/v1/info") return window.__scenario.info || {};
        if (/\/instances\/\d+\/multi-instances$/.test(u.pathname)) {
          // A scenario may shrink the body, to stand on either side of the line.
          const sized = window.__scenario.iterations ? { ...body, iterations: window.__scenario.iterations } : body;
          return { instanceKey: KEY, processDefinitionKey: "7", instanceState: "completed", highWaterPosition: 300100, bodies: [sized] };
        }
        if (/\/multi-instances\/\d+\/iterations$/.test(u.pathname)) {
          if (window.__scenario.failNext > 0) { window.__scenario.failNext--; fail(500, "internal", "disk on fire"); }
          return page(u.searchParams);
        }
        const vars = u.pathname.match(/\/iterations\/(\d+)\/variables$/);
        if (vars) {
          if (window.__scenario.noVars) fail(500, "internal", "variables lost");
          // The iteration's own scope as it stood at the step: its inputs from the
          // start, and a phase that changes when the task completed.
          const n = Number(vars[1]) - 1_000_000;
          const at = Number(u.searchParams.get("at"));
          return { instanceKey: KEY, iteration: row(n), at, scopesTruncated: false, scopes: [
            { elementInstanceKey: vars[1], iteration: true, variables: [
              { name: "loopCounter", kind: "number", value: String(n), position: 90 + n, at: 1 },
              { name: "phase", kind: "string", value: at < 150 + n ? "running" : "done", position: at < 150 + n ? 95 + n : 150 + n, at: 1 },
            ] },
          ] };
        }
        const steps = u.pathname.match(/\/iterations\/(\d+)\/steps$/);
        if (steps) {
          if (window.__scenario.noSteps) fail(409, "history_unavailable", "iteration steps unavailable");
          // An iteration's replay window: its own activation, the task it ran,
          // and its end. Iteration 37,421 has a second page.
          const n = Number(steps[1]) - 1_000_000;
          const eik = steps[1];
          const st = (pos, action, extra = {}) => ({ position: pos, at: pos, action, elementId: "Calc_1", type: "bpmn:serviceTask",
            elementInstanceKey: eik, tokenId: "3", parentTokenId: "2", processDefinitionKey: "7", ...extra });
          const all = [st(100 + n, "activated", { multiInstanceIteration: true }),
            st(150 + n, "completed"), st(160 + n, "completed"), st(200000 + n, stateOf(n) === "terminated" ? "terminated" : "completed", { multiInstanceIteration: true })];
          const paged = n === 37421;
          const from = u.searchParams.get("cursor") ? 3 : 0;
          const rows = paged ? all.slice(from, from ? 4 : 3) : all;
          return { instanceKey: KEY, body, iteration: row(n), highWaterPosition: 300100, steps: rows,
            nextCursor: paged && !from ? "s:3" : undefined };
        }
        const one = u.pathname.match(/\/iterations\/(\d+)$/);
        if (one) {
          const n = Number(one[1]) - 1_000_000;
          const technical = u.searchParams.get("technical") === "true";
          return { instanceKey: KEY, body, iteration: row(n), nestedBodies: [], incidentsTruncated: false,
            incidents: incidentAt(n) ? [{ elementInstanceKey: one[1], raisedPosition: 150 + n, endPosition: 160 + n, status: "resolved" }] : [],
            variables: [
              { name: "loopCounter", kind: "number", value: String(n), position: 90 + n, at: 1 },
              { name: "record", kind: "json", value: `{"id":${n}}`, position: 90 + n, at: 1 },
            ],
            variablesTruncated: false, decisionsAvailable: true, decisionsTruncated: false,
            decisions: [{ decisionId: "position-rule", elementInstanceKey: one[1], position: 120 + n, at: 2,
              inputs: { amount: n }, outputs: { approved: n % 2 === 0 }, ...(technical ? { trace: { matched: [1] } } : {}) }] };
        }
        if (/\/instances\/\d+\/timeline$/.test(u.pathname)) {
          // A 50,000-iteration timeline is what this view exists to avoid.
          return { processDefKey: "7", processId: "positions", version: 1, state: "completed", steps: [], frames: [] };
        }
        if (/\/processes\/[\w-]+\/xml$/.test(u.pathname)) return XML;
        if (u.pathname.includes("/runtime")) return { elements: [] };
        if (/\/decisions$|\/data-objects$/.test(u.pathname)) return [];
        if (/\/object-graph$/.test(u.pathname)) return { nodes: [], links: [], unresolved: [] };
        return {};
      };

      window.__mount = () => mountInstanceReplay(view, { api, toast: noop, key: KEY });
      window.__ready = true;
    </script>
  </body>
</html>
