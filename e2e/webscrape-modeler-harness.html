<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas webscrape feed modeler e2e harness</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_webscrape" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="webscrape-feed" name="Webscrape feed" isExecutable="true">
    <bpmn:startEvent id="Start_1"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="Activity_feed" name="Read feed">
      <bpmn:extensionElements><atlas:webscrapeConnector url="https://example.com/feed.xml" format="rss" maxItems="3" resultVariable="headlines"/></bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:endEvent id="End_1"><bpmn:incoming>f1</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_feed"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_feed" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="webscrape-feed">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_feed_di" bpmnElement="Activity_feed"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="420" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="420" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/connector-kinds$/.test(url)) return { kinds: [{ id: "webscrape", placement: "worker" }] };
        if (method === "GET" && /\/(connectors|configured-workers)$/.test(url)) return [];
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__selectFeed = () =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get("Activity_feed"));
      window.__xml = async () => (await window.__atlasModeler.saveXML({ format: true })).xml;
      window.__ready = true;
    </script>
  </body>
</html>
