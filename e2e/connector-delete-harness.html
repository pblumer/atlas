<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas connector delete e2e harness</title>
    <!-- Drives the real api/web/connectordialog.js delete flow against a mock `api`
         that answers a plain DELETE the way the server does (ADR-0163): 409 with the
         deployed processes that reference the connector, until ?force=true. The page
         scaffolding is the test's own — app.js boots the whole console on import and
         cannot be loaded here — so this proves the flow and the row's usage line, not
         app.js's wiring of them. -->
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="card" style="padding: 18px; max-width: 720px">
      <div id="usage-referenced"></div>
      <div id="usage-orphan"></div>
      <button class="btn danger" id="del-referenced">Delete referenced</button>
      <button class="btn danger" id="del-orphan">Delete orphan</button>
    </div>
    <script type="module">
      import { connectorUsageHTML, deleteConnectorFlow } from "/connectordialog.js";

      const REFERENCED = {
        id: "c1", name: "Patrick Blumer", kind: "mail",
        usedBy: [
          { processDefKey: 7, processId: "zahlung", name: "Zahlung", version: 3, elements: ["Task_pay"], activeInstances: 2 },
          { processDefKey: 9, processId: "mahnung", name: "Mahnung", version: 1, elements: ["Task_remind", "Task_escalate"], activeInstances: 0 },
        ],
      };
      const ORPHAN = { id: "c2", name: "unused", kind: "temis", usedBy: [] };

      document.getElementById("usage-referenced").innerHTML = connectorUsageHTML(REFERENCED.usedBy);
      document.getElementById("usage-orphan").innerHTML = connectorUsageHTML(ORPHAN.usedBy);

      window.__deletes = [];   // every DELETE the flow issued, in order
      window.__result = null;  // what the flow resolved to

      // The mock server: a referenced connector refuses a plain DELETE with the same
      // 409 body the real handler sends, and honours ?force=true.
      const api = async (method, url) => {
        window.__deletes.push(url);
        if (method !== "DELETE") return {};
        if (url.startsWith("/api/v1/connectors/c1") && !url.includes("force=true")) {
          const err = new Error("connector is referenced by deployed processes; delete with ?force=true to remove it anyway");
          err.status = 409;
          err.body = { error: err.message, usedBy: REFERENCED.usedBy };
          throw err;
        }
        return null;
      };

      const run = (connector) => async () => {
        window.__deletes = [];
        window.__result = await deleteConnectorFlow({ api, connector });
      };
      document.getElementById("del-referenced").addEventListener("click", run(REFERENCED));
      document.getElementById("del-orphan").addEventListener("click", run(ORPHAN));
      window.__ready = true;
    </script>
  </body>
</html>
