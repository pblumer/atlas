<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Panorama node sizing e2e harness</title>
    <!-- Drives the *real* radiusFor and degreesOf from api/web/panorama-mesh.js.
         How big a node is drawn is arithmetic over its connectivity, and the
         property the picture rests on — that connectivity moves a node inside its
         kind's band and never out of it — is a claim about every degree, not about
         the handful a rendered fixture happens to contain. So it is checked as
         arithmetic, exhaustively, rather than sampled through the DOM. -->
  </head>
  <body>
    <div id="ready">loading</div>
    <script type="module">
      import { radiusFor, radiusForHeat, radiusForTally, heatPeak, heatTicks, degreesOf,
        shapeForNode, shapeVertices, refreshEvery, REFRESH_FLOOR,
        REFRESH_CEILING } from "/panorama-mesh.js";
      window.refreshEvery = (ms, opts) => refreshEvery(ms, opts);
      window.REFRESH_FLOOR = REFRESH_FLOOR;
      window.REFRESH_CEILING = REFRESH_CEILING;
      window.radiusFor = (node, degree) => radiusFor(node, degree);
      window.radiusForHeat = (node, peak, heat, at) => radiusForHeat(node, peak, heat, at);
      window.heatPeak = (graph, heat, at) => heatPeak(graph, heat, at);
      // The law over a bare tally, and the tallies the key puts a circle against —
      // the two halves of the scale in the legend, checked as arithmetic here and
      // against the rendered row in panorama-mesh.spec.mjs.
      window.radiusForTally = (tally, peak, heat) => radiusForTally(tally, peak, heat);
      window.heatTicks = (peak, heat) => heatTicks(peak, heat);
      window.degreesOf = (graph) => [...degreesOf(graph)];
      window.shapeForNode = (node) => shapeForNode(node);
      window.shapeVertices = (shape, r) => shapeVertices(shape, r);
      document.getElementById("ready").textContent = "ready";
    </script>
  </body>
</html>
