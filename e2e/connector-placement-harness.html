<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas connector placement e2e harness</title>
    <!-- Drives the *real* api/web/editor.js against a mock `api` that
         answers GET /api/v1/connector-kinds the way a configured server would: one kind
         run in the engine, one offloaded onto a worker, one born on a worker, one with
         no out-of-process form at all, plus a script language per placement and both
         decision bindings. The connector picker used to state this from a constant in the
         browser, which no install could contradict, and the script and decision panels
         said nothing at all; these tests hold all three to the server's answer
         (ADR-0164/0168/0173). Mounted in deployment mode (key set,
         draftId null) so no live collaboration SSE is attached. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_placement" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="placement" name="Test Placement" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:serviceTask id="Activity_worker" name="Zahlen">
      <bpmn:extensionElements><zeebe:taskDefinition type="payment"/></bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_rest" name="Abrufen">
      <bpmn:extensionElements><atlas:restConnector method="GET" url="https://example.com"/></bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_mail" name="Benachrichtigen">
      <bpmn:extensionElements><atlas:mailConnector connector="orders-mail" to="ops@example.com" subject="Hallo"/></bpmn:extensionElements>
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_sql" name="Abfragen">
      <bpmn:extensionElements><atlas:mssqlConnector connector="hr-db" operation="query" statement="SELECT 1" resultVariable="rows"/></bpmn:extensionElements>
      <bpmn:incoming>f3</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:serviceTask id="Activity_login" name="Konto anlegen">
      <bpmn:extensionElements><atlas:userConnector operation="create" username="=antrag.login"/></bpmn:extensionElements>
      <bpmn:incoming>f4</bpmn:incoming><bpmn:outgoing>f5</bpmn:outgoing>
    </bpmn:serviceTask>
    <bpmn:scriptTask id="Activity_pwsh" name="Skript (PowerShell)">
      <bpmn:extensionElements><atlas:jobScript language="powershell" resultVariable="Greeting">Write-Output "hi"</atlas:jobScript></bpmn:extensionElements>
      <bpmn:incoming>f5</bpmn:incoming><bpmn:outgoing>f6</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:scriptTask id="Activity_py" name="Skript (Python)">
      <bpmn:extensionElements><atlas:jobScript language="python" resultVariable="Greeting">result = "hi"</atlas:jobScript></bpmn:extensionElements>
      <bpmn:incoming>f6</bpmn:incoming><bpmn:outgoing>f7</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:scriptTask id="Activity_feel" name="Skript (FEEL)">
      <bpmn:extensionElements><zeebe:script expression="=amount * 2" resultVariable="gross"/></bpmn:extensionElements>
      <bpmn:incoming>f7</bpmn:incoming><bpmn:outgoing>f8</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:businessRuleTask id="Activity_rule" name="Einstufen (embedded)">
      <bpmn:extensionElements><zeebe:calledDecision decisionId="stufe" resultVariable="stufe"/></bpmn:extensionElements>
      <bpmn:incoming>f8</bpmn:incoming><bpmn:outgoing>f9</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:businessRuleTask id="Activity_rule_temis" name="Einstufen (temis)">
      <bpmn:extensionElements>
        <atlas:temisConnector connector="risk-service"/>
        <zeebe:calledDecision decisionId="risiko" resultVariable="risiko"/>
      </bpmn:extensionElements>
      <bpmn:incoming>f9</bpmn:incoming><bpmn:outgoing>f10</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f10</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_worker"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_worker" targetRef="Activity_rest"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Activity_rest" targetRef="Activity_mail"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Activity_mail" targetRef="Activity_sql"/>
    <bpmn:sequenceFlow id="f4" sourceRef="Activity_sql" targetRef="Activity_login"/>
    <bpmn:sequenceFlow id="f5" sourceRef="Activity_login" targetRef="Activity_pwsh"/>
    <bpmn:sequenceFlow id="f6" sourceRef="Activity_pwsh" targetRef="Activity_py"/>
    <bpmn:sequenceFlow id="f7" sourceRef="Activity_py" targetRef="Activity_feel"/>
    <bpmn:sequenceFlow id="f8" sourceRef="Activity_feel" targetRef="Activity_rule"/>
    <bpmn:sequenceFlow id="f9" sourceRef="Activity_rule" targetRef="Activity_rule_temis"/>
    <bpmn:sequenceFlow id="f10" sourceRef="Activity_rule_temis" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="placement">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_worker_di" bpmnElement="Activity_worker"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_rest_di" bpmnElement="Activity_rest"><dc:Bounds x="420" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_mail_di" bpmnElement="Activity_mail"><dc:Bounds x="580" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_sql_di" bpmnElement="Activity_sql"><dc:Bounds x="740" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_login_di" bpmnElement="Activity_login"><dc:Bounds x="900" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_pwsh_di" bpmnElement="Activity_pwsh"><dc:Bounds x="1060" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_py_di" bpmnElement="Activity_py"><dc:Bounds x="1220" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_feel_di" bpmnElement="Activity_feel"><dc:Bounds x="1380" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_rule_di" bpmnElement="Activity_rule"><dc:Bounds x="1540" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_rule_temis_di" bpmnElement="Activity_rule_temis"><dc:Bounds x="1700" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="1860" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="420" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="520" y="138"/><di:waypoint x="580" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="680" y="138"/><di:waypoint x="740" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="840" y="138"/><di:waypoint x="900" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f5_di" bpmnElement="f5"><di:waypoint x="1000" y="138"/><di:waypoint x="1060" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f6_di" bpmnElement="f6"><di:waypoint x="1160" y="138"/><di:waypoint x="1220" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f7_di" bpmnElement="f7"><di:waypoint x="1320" y="138"/><di:waypoint x="1380" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f8_di" bpmnElement="f8"><di:waypoint x="1480" y="138"/><di:waypoint x="1540" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f9_di" bpmnElement="f9"><di:waypoint x="1640" y="138"/><di:waypoint x="1700" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f10_di" bpmnElement="f10"><di:waypoint x="1800" y="138"/><di:waypoint x="1860" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // What a server with --offload-connectors mail,webscrape would answer. rest is
      // still run in the engine, mssql was born on a worker, and the user-provisioning
      // connector has no out-of-process form at all.
      const KINDS = {
        kinds: [
          { id: "rest", placement: "engine" },
          { id: "ldap", placement: "engine" },
          { id: "mail", placement: "worker" },
          { id: "webscrape", placement: "worker" },
          { id: "mssql", placement: "worker-only" },
          { id: "entra", placement: "worker-only" },
          { id: "userconnector", placement: "engine-only" },
          { id: "powershell", placement: "worker" },
          { id: "python", placement: "engine" },
          { id: "javascript", placement: "worker" },
          { id: "dmn", placement: "engine" },
          { id: "temis", placement: "worker" },
        ],
      };

      // Counted so a test can prove the picker asks once per page rather than on every
      // panel render — the answer is the server's configuration, not per-element state.
      window.__kindFetches = 0;

      const api = async (method, url) => {
        if (method === "GET" && /\/connector-kinds$/.test(url)) {
          window.__kindFetches++;
          return KINDS;
        }
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/(connectors|configured-workers)$/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return [];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      window.__ready = true;
    </script>
  </body>
</html>
