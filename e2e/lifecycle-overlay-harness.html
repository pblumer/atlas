<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas lifecycle-overlay e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountInstanceReplay against a mock `api`, for
         the replay Data tab's third reading: the state machine a class declares with this
         instance's own life drawn on it (ADR-0259 §4).

         Two objects, deliberately: one that moved exactly the way its class says it may,
         and one that did not — because the second is what the overlay exists to make
         visible, and a fixture with only the happy path could not show it. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      import { mountInstanceReplay } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const T = 1_722_260_303_000;
      const ns = (ms) => ms * 1e6;

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_lc" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="lc" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f_0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:task id="Freigeben_1" name="Freigeben"><bpmn:incoming>f_0</bpmn:incoming><bpmn:outgoing>f_1</bpmn:outgoing></bpmn:task>
    <bpmn:task id="Versenden_1" name="Versenden"><bpmn:incoming>f_1</bpmn:incoming><bpmn:outgoing>f_2</bpmn:outgoing></bpmn:task>
    <bpmn:endEvent id="End_1" name="Ende"><bpmn:incoming>f_2</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f_0" sourceRef="Start_1" targetRef="Freigeben_1"/>
    <bpmn:sequenceFlow id="f_1" sourceRef="Freigeben_1" targetRef="Versenden_1"/>
    <bpmn:sequenceFlow id="f_2" sourceRef="Versenden_1" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="lc">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Freigeben_1_di" bpmnElement="Freigeben_1"><dc:Bounds x="250" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Versenden_1_di" bpmnElement="Versenden_1"><dc:Bounds x="410" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="570" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f_0_di" bpmnElement="f_0"><di:waypoint x="196" y="160"/><di:waypoint x="250" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f_1_di" bpmnElement="f_1"><di:waypoint x="350" y="160"/><di:waypoint x="410" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f_2_di" bpmnElement="f_2"><di:waypoint x="510" y="160"/><di:waypoint x="570" y="160"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      const steps = [
        { elementId: "Start_1", elementInstanceKey: "1000", type: "bpmn:startEvent", position: 1, tokenId: "1", variables: [] },
        { elementId: "Freigeben_1", elementInstanceKey: "1001", type: "bpmn:task", position: 2, tokenId: "1", variables: [] },
        { elementId: "Versenden_1", elementInstanceKey: "1002", type: "bpmn:task", position: 3, tokenId: "1", variables: [] },
        { elementId: "End_1", elementInstanceKey: "1003", type: "bpmn:endEvent", position: 4, tokenId: "1", variables: [] },
      ].map((s, i) => ({ ...s, at: ns(T + i * 1000), endAt: ns(T + i * 1000 + 500) }));

      const frames = steps.map((s, i) => ({
        position: s.position, at: s.at,
        tokens: i < steps.length - 1 ? [{ elementId: s.elementId, tokenId: "1", elementInstanceKey: s.elementInstanceKey, state: "active" }] : [],
      }));

      const TIMELINE = { processDefKey: "7", processId: "lc", version: 1, state: "completed", steps, frames };

      const DATA_OBJECTS = [
        {
          name: "order", state: "versendet", kind: "json", value: { id: "ORD-1" },
          itemType: "Order", isCollection: false, at: ns(T + 3000), producedBy: "Versenden_1",
          history: [
            { at: ns(T + 500), state: "erfasst", kind: "null", value: null, producedBy: "" },
            { at: ns(T + 2000), state: "freigegeben", kind: "json", value: { id: "ORD-1" }, producedBy: "Freigeben_1" },
            { at: ns(T + 3000), state: "versendet", kind: "json", value: { id: "ORD-1" }, producedBy: "Versenden_1" },
          ],
        },
        {
          name: "retoure", state: "abgeschlosen", kind: "string", value: "R-9",
          itemType: "Retoure", isCollection: false, at: ns(T + 3000), producedBy: "Versenden_1",
          history: [
            { at: ns(T + 500), state: "neu", kind: "null", value: null, producedBy: "" },
            { at: ns(T + 2000), state: "erledigt", kind: "string", value: "R-9", producedBy: "Freigeben_1" },
            { at: ns(T + 3000), state: "abgeschlosen", kind: "string", value: "R-9", producedBy: "Versenden_1" },
          ],
        },
        // No declared class, so nothing to read it against — it must not appear.
        {
          name: "notiz", state: "offen", kind: "string", value: "n", itemType: "", isCollection: false,
          at: ns(T + 500), producedBy: "",
          history: [{ at: ns(T + 500), state: "offen", kind: "string", value: "n", producedBy: "" }],
        },
      ];

      // What the server derives from the two above: the declared machine with the marks
      // the trail puts on it. Hand-written here to be exactly what api/infomodel's
      // TraceLifecycle produces for those trails — the Go tests hold that end.
      const LIFECYCLE = [
        {
          object: "order", class: "Order", current: "versendet",
          states: [
            { name: "erfasst", initial: true, x: 0, y: 0, visited: true, current: false, entered: 1, firstAt: ns(T + 500), lastAt: ns(T + 500) },
            { name: "freigegeben", x: 0, y: 100, visited: true, current: false, entered: 1, firstAt: ns(T + 2000), lastAt: ns(T + 2000) },
            { name: "versendet", final: true, x: 0, y: 200, visited: true, current: true, entered: 1, firstAt: ns(T + 3000), lastAt: ns(T + 3000) },
            { name: "storniert", final: true, x: 240, y: 100, visited: false, current: false },
          ],
          transitions: [
            { id: "t1", name: "freigeben", from: "erfasst", to: "freigegeben", taken: 1, lastAt: ns(T + 2000), lastBy: "Freigeben_1" },
            { id: "t2", name: "versenden", from: "freigegeben", to: "versendet", taken: 1, lastAt: ns(T + 3000), lastBy: "Versenden_1" },
            { id: "t3", name: "stornieren", from: "erfasst", to: "storniert", taken: 0 },
          ],
        },
        {
          object: "retoure", class: "Retoure", current: "abgeschlosen",
          states: [
            { name: "neu", initial: true, x: 0, y: 0, visited: true, current: false, entered: 1, firstAt: ns(T + 500), lastAt: ns(T + 500) },
            { name: "geprueft", x: 0, y: 100, visited: false, current: false },
            { name: "erledigt", final: true, x: 0, y: 200, visited: true, current: false, entered: 1, firstAt: ns(T + 2000), lastAt: ns(T + 2000) },
          ],
          transitions: [
            { id: "r1", name: "pruefen", from: "neu", to: "geprueft", taken: 0 },
            { id: "r2", name: "erledigen", from: "geprueft", to: "erledigt", taken: 0 },
          ],
          // It jumped straight to erledigt, and then into a state nothing declares.
          undeclared: [{ from: "neu", to: "erledigt", at: ns(T + 2000), by: "Freigeben_1" }],
          unknown: ["abgeschlosen"],
        },
      ];

      const OBJECT_GRAPH = {
        nodes: [{ id: "order", name: "order", label: "order : Order", class: "Order", state: "versendet",
          key: "ORD-1", attributes: [{ name: "id", value: "ORD-1", key: true }] }],
        links: [], unresolved: [], degraded: false, truncated: false,
      };

      window.__lifecycleCalls = 0;
      const api = async (method, url) => {
        if (/\/instances\/\d+\/timeline$/.test(url)) return TIMELINE;
        if (/\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (url.includes("/runtime")) return { elements: [] };
        if (/\/instances\/\d+\/decisions$/.test(url)) return [];
        if (/\/instances\/\d+\/data-objects$/.test(url)) return DATA_OBJECTS;
        if (/\/instances\/\d+\/lifecycle$/.test(url)) { window.__lifecycleCalls++; return LIFECYCLE; }
        // One node is enough: what the object-graph reading is for is covered by its own
        // tests — here it exists so switching between the two drawings has two drawings.
        if (/\/instances\/\d+\/object-graph$/.test(url)) return OBJECT_GRAPH;
        return {};
      };

      window.__mount = () => mountInstanceReplay(view, { api, toast: noop, key: "281474976723211" });
      window.__ready = true;
    </script>
  </body>
</html>
