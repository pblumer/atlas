<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Panorama saved-views e2e harness</title>
    <!-- Drives the *real* storage and framing functions from
         api/web/panorama-views.js. What a view captures and where opening one puts
         you are arithmetic over plain data, and both can be wrong in a way a
         screenshot would not show — a view that reopens onto empty space looks like
         a view. So they are checked as functions. -->
  </head>
  <body>
    <div id="ready">loading</div>
    <script type="module">
      import * as views from "/panorama-views.js";
      window.views = views;
      // A storage that can be made to fail on demand, because "the browser refused
      // the save" is a case the real one will not perform to order.
      window.fakeStore = (broken) => {
        const held = new Map();
        return {
          getItem: (k) => { if (broken) throw new Error("blocked"); return held.get(k) ?? null; },
          setItem: (k, v) => { if (broken) throw new Error("blocked"); held.set(k, v); },
          dump: () => held.get(views.VIEWS_KEY) ?? null,
        };
      };
      document.getElementById("ready").textContent = "ready";
    </script>
  </body>
</html>
