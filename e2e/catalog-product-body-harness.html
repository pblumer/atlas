<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas catalogue product-body e2e harness</title>
    <!-- Drives the real api/web/catalog-admin.js productBody and variantLines
         against a form shaped like the Console's product editor. The page
         scaffolding is the test's own — viewCatalogDetail fetches seven routes on
         import and cannot be loaded here — so this proves what a save carries and
         what the textarea renders, not the page's wiring of them.

         The point of the fixture is the four controls the form did not have: the
         orderable shapes, the search terms, the eligible groups and the ceiling on
         how long a right may last. A save is a FULL REPLACE, so a control that is
         rendered has to be able to clear its field, and a field that is not rendered
         has to survive untouched. Both halves are one property and this is where it
         is checked. -->
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <form id="f">
      <input name="id" />
      <input name="t-de" />
      <input name="t-en" />
      <textarea name="d-de"></textarea>
      <textarea name="d-en"></textarea>
      <!-- One box per language for every text a product carries. The real form
           draws exactly the languages its catalogue declares; the harness carries
           the four the tests use, and build() is told which of them are declared,
           so a box the catalogue does not declare is present and never read —
           which is itself worth proving. -->
      <input name="t-fr" />
      <input name="t-it" />
      <textarea name="d-fr"></textarea>
      <input name="cat-de" />
      <input name="cat-fr" />
      <input name="cat-en" />
      <input name="cat-it" />
      <input name="grp-de" />
      <input name="grp-fr" />
      <input name="grp-en" />
      <input name="grp-it" />
      <input name="keywords" />
      <input name="price" />
      <input type="checkbox" name="multipleAllowed" />
      <!-- The shapes grid: three rows of boxes, each with an id and one name box
           per language the tests use. The real form draws exactly the languages
           its catalogue declares and as many rows as the product has; the harness
           carries enough of both to exercise the reading. -->
      <input name="var-0-id" /><input name="var-0-de" /><input name="var-0-fr" />
      <input name="var-0-en" /><input name="var-0-it" />
      <input name="var-1-id" /><input name="var-1-de" /><input name="var-1-fr" />
      <input name="var-1-en" /><input name="var-1-it" />
      <input name="var-2-id" /><input name="var-2-de" /><input name="var-2-fr" />
      <input name="var-2-en" /><input name="var-2-it" />
      <select name="state">
        <option value="draft">draft</option>
        <option value="active">active</option>
        <option value="withdrawn">withdrawn</option>
      </select>
      <select name="akind">
        <option value="none">none</option>
        <option value="fixed">fixed</option>
        <option value="role">role</option>
        <option value="superior">superior</option>
      </select>
      <input name="aref-fixed" />
      <input name="aref-role" />
      <!-- The picker the real form draws when the directory could be read. The
           degraded id field (name="eligible-raw") is the other case, and the tests
           add it themselves so both readings are exercised. -->
      <label><input type="checkbox" name="eligible" value="grp_dev" /></label>
      <label><input type="checkbox" name="eligible" value="grp_ops" /></label>
      <input name="configForm" />
      <input name="provisionProcess" />
      <input name="deprovisionProcess" />
      <input name="maxDays" type="number" />
      <input name="orderableFrom" type="date" />
      <input name="orderableUntil" type="date" />
      <textarea name="targets"></textarea>
    </form>
    <pre id="out"></pre>
    <script type="module">
      import { productBody, variantRows, dateOf, headingBoxes } from "/catalog-admin.js";

      const form = document.getElementById("f");
      const out = document.getElementById("out");

      // set({name: value}) fills the form. A boolean ticks a checkbox; an array
      // ticks the boxes sharing that name and unticks the rest, which is how the
      // eligibility picker is actually read.
      window.set = (values) => {
        for (const [k, v] of Object.entries(values)) {
          const el = form.elements[k];
          if (!el) continue;
          if (Array.isArray(v)) {
            for (const box of el) box.checked = v.includes(box.value);
          } else if (el.type === "checkbox") {
            el.checked = !!v;
          } else {
            el.value = v;
          }
        }
      };

      // degrade() replaces the eligibility picker with the id field the real form
      // falls back to when the directory could not be read.
      window.degrade = () => {
        for (const box of [...form.querySelectorAll('[name="eligible"]')]) {
          box.closest("label").remove();
        }
        const raw = document.createElement("input");
        raw.name = "eligible-raw";
        form.appendChild(raw);
      };

      // build(stored, langs) renders the body the Console would POST.
      window.build = (stored, langs) => {
        const body = productBody(new FormData(form), {
          productID: "laptop",
          homeCatalog: "cat_arbeitsplatz",
          langs: langs || ["de"],
          stored: stored || {},
        });
        out.textContent = JSON.stringify(body);
        return body;
      };

      // What the shapes grid is filled with, which is the other half of ITS round
      // trip. The markup is returned rather than the values, because the row is
      // where a shape's id and its names are tied together and a helper that
      // handed back values alone could not show that they stayed on one row.
      window.shapeGrid = (variants, langs, blanks) => variantRows(variants, langs, blanks);

      // And what a date box is filled with, which is the other half of the window's.
      window.dateBox = (ns) => dateOf(ns);

      // What the heading row is filled with — the other half of ITS round trip,
      // and the half that matters most here: the row carries the key and every
      // wording at once, so a render the save cannot read back loses wordings on
      // a save that changed nothing.
      window.headingBoxes = (key, texts, langs) => headingBoxes(key, texts, langs);

      window.__ready = true;
    </script>
  </body>
</html>
