<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas decision binding e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api`, to verify
         the business rule task's binding field
         (ADR-draft-a-business-rule-task-chooses-its-decision-version): latest, a fixed
         deployed version written as atlas:version, and the model deployed with the
         process — and that a binding the panel does not offer is kept, not rewritten.
         Activity_rule is bound to latest; Activity_tag carries Camunda's versionTag. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_bind" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="antrag" name="Antrag" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:businessRuleTask id="Activity_rule" name="Freigabe">
      <bpmn:extensionElements><zeebe:calledDecision decisionId="eligibility" resultVariable="verdict" bindingType="latest"/></bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:businessRuleTask id="Activity_tag" name="Tarif">
      <bpmn:extensionElements><zeebe:calledDecision decisionId="eligibility" resultVariable="tarif" bindingType="versionTag" versionTag="2027"/></bpmn:extensionElements>
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:endEvent id="End_1" name="End"><bpmn:incoming>f2</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Activity_rule"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Activity_rule" targetRef="Activity_tag"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Activity_tag" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="antrag">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_rule_di" bpmnElement="Activity_rule"><dc:Bounds x="260" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Activity_tag_di" bpmnElement="Activity_tag"><dc:Bounds x="410" y="98" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="560" y="120" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="138"/><di:waypoint x="260" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="360" y="138"/><di:waypoint x="410" y="138"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="510" y="138"/><di:waypoint x="560" y="138"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // Two deployed versions of the decision, newest first, as the server lists them.
      const VERSIONS = [
        { key: 12, decisionId: "eligibility", version: 2, current: true },
        { key: 11, decisionId: "eligibility", version: 1, current: false },
      ];
      const DECISION = {
        id: "eligibility", name: "eligibility", model: "Eligibility", modelRef: "eligibility", deployed: true,
        inputs: [ { name: "amount", type: "number" } ], output: { name: "verdict" },
      };
      const api = async (method, url) => {
        if (method === "GET" && /\/processes\/[\w-]+\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes$/.test(url)) return [];
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/decision-deployments\?decisionId=eligibility$/.test(url)) return VERSIONS;
        if (method === "GET" && /\/decision-deployments/.test(url)) return [];
        if (method === "GET" && /\/decisions/.test(url)) return [ DECISION ];
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };
      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42, projectId: "app-1" });
      window.__select = (id) =>
        window.__atlasModeler.get("selection").select(window.__atlasModeler.get("elementRegistry").get(id));
      window.__calledDecision = async (id) => {
        const xml = (await window.__atlasModeler.saveXML({ format: false })).xml;
        const task = xml.split(`id="${id}"`)[1] || "";
        return (task.match(/<zeebe:calledDecision[^>]*>/) || [""])[0];
      };
      window.__ready = true;
    </script>
  </body>
</html>
