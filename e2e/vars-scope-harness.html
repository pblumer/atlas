<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas Variables-panel scope e2e harness</title>
    <!-- Drives the *real* api/web/editor.js mountEditor against a mock `api`, to verify
         two things about the Modeler's Variables panel:

         1. that it lists every variable the process can hold — including the ones that
            arrive through a construct rather than a result field: a multi-instance's
            output collection and its per-round item, an input mapping's local, what a
            called process hands back when its variables propagate, and what a collapsed
            subprocess writes, also while the reader is drilled into it;
         2. that with one element selected it narrows to what that element reads,
            writes and holds locally.

         The called process `kind` is deployed as key 9; the process on the canvas is
         key 42. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountEditor } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};

      // The process on the canvas:
      //   kundennr        start variable
      //   MAX             process constant
      //   pruefen         script task: input mapping limite = MAX * 2 (local), reads
      //                   kundennr, limite and betrag (which nothing writes), writes ok
      //   Gw_1            gateway whose branch reads ok
      //   bewerten        multi-instance user task over positionen: item pos and
      //                   loopCounter are the round's own, bewertungen is collected
      //   Sub_1           collapsed subprocess whose script task writes innenwert
      //   aufruf          call activity on `kind`, all child variables propagate back
      //   aufruf_isoliert call activity on `kind` that propagates nothing: only its
      //                   output mapping (rueckgabe) comes back
      //   Agent_1         agent-driven ad-hoc subprocess: its tool `suchen` reads the
      //                   parameter the model passes (suchbegriff) and toolCallId, both
      //                   its own, and writes antwort
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" xmlns:atlas="http://atlas/schema/1.0" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" id="Definitions_scope" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="auftrag" name="Auftrag" isExecutable="true">
    <bpmn:extensionElements>
      <atlas:startForm>
        <atlas:startVariable name="kundennr" type="number" />
        <atlas:startVariable name="positionen" type="array" />
      </atlas:startForm>
      <atlas:constants>
        <atlas:constant name="MAX" type="number" value="10" />
      </atlas:constants>
    </bpmn:extensionElements>
    <bpmn:startEvent id="Start_1" name="Start"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:scriptTask id="pruefen" name="Prüfen">
      <bpmn:extensionElements>
        <zeebe:ioMapping>
          <zeebe:input source="=MAX * 2" target="limite" />
        </zeebe:ioMapping>
        <zeebe:script expression="=kundennr &gt; limite and betrag &lt; 100 and &quot;geheim&quot; != null" resultVariable="ok" />
      </bpmn:extensionElements>
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:exclusiveGateway id="Gw_1" name="OK?" default="f3"><bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing><bpmn:outgoing>f3</bpmn:outgoing></bpmn:exclusiveGateway>
    <bpmn:userTask id="bewerten" name="Bewerten">
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f4</bpmn:outgoing>
      <bpmn:multiInstanceLoopCharacteristics isSequential="true">
        <bpmn:extensionElements>
          <zeebe:loopCharacteristics inputCollection="=positionen" inputElement="pos" outputCollection="bewertungen" outputElement="=pos.preis" />
        </bpmn:extensionElements>
      </bpmn:multiInstanceLoopCharacteristics>
    </bpmn:userTask>
    <bpmn:subProcess id="Sub_1" name="Innen">
      <bpmn:incoming>f4</bpmn:incoming><bpmn:outgoing>f5</bpmn:outgoing>
      <bpmn:startEvent id="SubStart" />
      <bpmn:scriptTask id="innen" name="Innen rechnen">
        <bpmn:extensionElements>
          <zeebe:script expression="=kundennr + 1" resultVariable="innenwert" />
        </bpmn:extensionElements>
        <bpmn:incoming>sf1</bpmn:incoming>
      </bpmn:scriptTask>
      <bpmn:sequenceFlow id="sf1" sourceRef="SubStart" targetRef="innen" />
    </bpmn:subProcess>
    <bpmn:callActivity id="aufruf" name="Kind aufrufen">
      <bpmn:extensionElements>
        <zeebe:calledElement processId="kind" />
      </bpmn:extensionElements>
      <bpmn:incoming>f5</bpmn:incoming><bpmn:outgoing>f6</bpmn:outgoing>
    </bpmn:callActivity>
    <bpmn:callActivity id="aufruf_isoliert" name="Kind isoliert">
      <bpmn:extensionElements>
        <zeebe:calledElement processId="kind" propagateAllChildVariables="false" />
        <zeebe:ioMapping>
          <zeebe:output source="=kindergebnis" target="rueckgabe" />
        </zeebe:ioMapping>
      </bpmn:extensionElements>
      <bpmn:incoming>f6</bpmn:incoming><bpmn:outgoing>f7</bpmn:outgoing>
    </bpmn:callActivity>
    <bpmn:adHocSubProcess id="Agent_1" name="Recherche">
      <bpmn:extensionElements>
        <atlas:agentConnector connector="ki" resultCollection="treffer" resultElement="=antwort" context="kundennr" />
      </bpmn:extensionElements>
      <bpmn:scriptTask id="suchen" name="Suchen">
        <bpmn:extensionElements>
          <atlas:agentParam name="suchbegriff" type="string" description="Wonach gesucht wird" />
          <zeebe:script expression="=suchbegriff + &quot; &quot; + toolCallId" resultVariable="antwort" />
        </bpmn:extensionElements>
      </bpmn:scriptTask>
    </bpmn:adHocSubProcess>
    <bpmn:endEvent id="End_1" name="Ende"><bpmn:incoming>f7</bpmn:incoming><bpmn:incoming>f3</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="pruefen"/>
    <bpmn:sequenceFlow id="f1" sourceRef="pruefen" targetRef="Gw_1"/>
    <bpmn:sequenceFlow id="f2" name="ja" sourceRef="Gw_1" targetRef="bewerten">
      <bpmn:conditionExpression xsi:type="bpmn:tFormalExpression">=ok = true</bpmn:conditionExpression>
    </bpmn:sequenceFlow>
    <bpmn:sequenceFlow id="f3" name="nein" sourceRef="Gw_1" targetRef="End_1"/>
    <bpmn:sequenceFlow id="f4" sourceRef="bewerten" targetRef="Sub_1"/>
    <bpmn:sequenceFlow id="f5" sourceRef="Sub_1" targetRef="aufruf"/>
    <bpmn:sequenceFlow id="f6" sourceRef="aufruf" targetRef="aufruf_isoliert"/>
    <bpmn:sequenceFlow id="f7" sourceRef="aufruf_isoliert" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="auftrag">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="60" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="pruefen_di" bpmnElement="pruefen"><dc:Bounds x="130" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Gw_1_di" bpmnElement="Gw_1" isMarkerVisible="true"><dc:Bounds x="270" y="135" width="50" height="50"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="bewerten_di" bpmnElement="bewerten"><dc:Bounds x="360" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Sub_1_di" bpmnElement="Sub_1" isExpanded="false"><dc:Bounds x="500" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="aufruf_di" bpmnElement="aufruf"><dc:Bounds x="640" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="aufruf_isoliert_di" bpmnElement="aufruf_isoliert"><dc:Bounds x="780" y="120" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="920" y="142" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Agent_1_di" bpmnElement="Agent_1" isExpanded="true"><dc:Bounds x="360" y="320" width="220" height="140"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="suchen_di" bpmnElement="suchen"><dc:Bounds x="420" y="350" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="96" y="160"/><di:waypoint x="130" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="230" y="160"/><di:waypoint x="270" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="320" y="160"/><di:waypoint x="360" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="295" y="185"/><di:waypoint x="295" y="260"/><di:waypoint x="938" y="260"/><di:waypoint x="938" y="178"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f4_di" bpmnElement="f4"><di:waypoint x="460" y="160"/><di:waypoint x="500" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f5_di" bpmnElement="f5"><di:waypoint x="600" y="160"/><di:waypoint x="640" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f6_di" bpmnElement="f6"><di:waypoint x="740" y="160"/><di:waypoint x="780" y="160"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f7_di" bpmnElement="f7"><di:waypoint x="880" y="160"/><di:waypoint x="920" y="160"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
  <bpmndi:BPMNDiagram id="D_sub"><bpmndi:BPMNPlane id="P_sub" bpmnElement="Sub_1">
    <bpmndi:BPMNShape id="SubStart_di" bpmnElement="SubStart"><dc:Bounds x="100" y="100" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="innen_di" bpmnElement="innen"><dc:Bounds x="180" y="78" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="sf1_di" bpmnElement="sf1"><di:waypoint x="136" y="118"/><di:waypoint x="180" y="118"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // The called process: it writes kindergebnis at instance scope (which comes back
      // to a caller that propagates its child's variables), and a local of its own task
      // (which never reaches the instance, so it never comes back).
      const CHILD = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:zeebe="http://camunda.org/schema/zeebe/1.0" id="Definitions_kind" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="kind" name="Kind" isExecutable="true">
    <bpmn:startEvent id="KStart"><bpmn:outgoing>k0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:scriptTask id="krechnen" name="Kind rechnen">
      <bpmn:extensionElements>
        <zeebe:ioMapping><zeebe:input source="=1" target="nurlokal" /></zeebe:ioMapping>
        <zeebe:script expression="=nurlokal + 1" resultVariable="kindergebnis" />
      </bpmn:extensionElements>
      <bpmn:incoming>k0</bpmn:incoming><bpmn:outgoing>k1</bpmn:outgoing>
    </bpmn:scriptTask>
    <bpmn:endEvent id="KEnd"><bpmn:incoming>k1</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="k0" sourceRef="KStart" targetRef="krechnen"/>
    <bpmn:sequenceFlow id="k1" sourceRef="krechnen" targetRef="KEnd"/>
  </bpmn:process>
</bpmn:definitions>`;

      window.__calls = [];
      const api = async (method, url) => {
        window.__calls.push({ method, url });
        if (method === "GET" && /\/processes\/42\/xml$/.test(url)) return XML;
        if (method === "GET" && /\/processes\/9\/xml$/.test(url)) return CHILD;
        if (method === "GET" && /\/processes$/.test(url)) {
          return [{ key: 9, processId: "kind", name: "Kind", version: 1 }];
        }
        if (method === "GET" && /\/drafts$/.test(url)) return [];
        if (method === "GET" && /\/instances\?process=/.test(url)) return { items: [], total: 0, totalExact: true, truncated: false };
        if (method === "POST" && /\/validate$/.test(url)) return { version: "test", problems: [] };
        return {};
      };

      window.__mount = () => mountEditor(view, { api, toast: noop, key: 42 });
      // select puts one element (or nothing) into the Modeler's selection, as a click does.
      window.__select = (id) => {
        const m = window.__atlasModeler;
        const sel = m.get("selection");
        if (!id) { sel.select(null); return; }
        sel.select(m.get("elementRegistry").get(id));
      };
      // drill shows a collapsed subprocess's own plane, as its drill-down marker does.
      window.__drill = (id) => {
        const m = window.__atlasModeler;
        const canvas = m.get("canvas");
        canvas.setRootElement(canvas.findRoot(id + "_plane"));
      };
      window.__ready = true;
    </script>
  </body>
</html>
