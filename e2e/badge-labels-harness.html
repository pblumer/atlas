<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas runtime-badge placement e2e harness</title>
    <!-- Drives the *real* api/web/editor.js live view against a mock `api` whose runtime
         puts every badge kind on the diagram at once: token counts, an incident, a
         waiting user task, an evaluated decision. The diagram is deliberately the
         awkward one — names long enough to wrap inside a task and to spill well past a
         36px event — because that is the case an operator meets in production and the
         one where a badge parked in a corner lands on the words.

         The point of measuring it here rather than eyeballing it is that "does this
         pill cover that label" is a question about rendered geometry: bpmn-js lays the
         caption out itself, from the font the app ships, so only a real browser knows
         the answer. -->
    <link rel="stylesheet" href="/app.css" />
    <style>
      html, body { margin: 0; height: 100%; background: #fff; }
      :root { --topbar-h: 0px; }
      /* Read-only here: the palette and the floating legend would only sit over the
         shapes the measurements are about. */
      .djs-palette, .token-legend { display: none !important; }
    </style>
  </head>
  <body>
    <div id="view" style="height:100vh"></div>
    <script type="module">
      import { mountLive } from "/editor.js";

      const view = document.getElementById("view");
      const noop = () => {};
      const T = 1_722_260_303_000;
      const ns = (ms) => ms * 1e6;

      const DEF = 11;
      const INST = "700001";
      window.__DEF = DEF;
      window.__INST = INST;

      // Long names on purpose. A task caption wraps to three lines and fills its box;
      // an event caption is centred under a 36px circle and is five times as wide as
      // the shape it belongs to. Both are ordinary German process names.
      const XML = `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_badge" targetNamespace="http://atlas/bpmn">
  <bpmn:process id="beschaffung" name="Beschaffung" isExecutable="true">
    <bpmn:startEvent id="Start_1" name="Rechnung von Lieferant eingegangen"><bpmn:outgoing>f0</bpmn:outgoing></bpmn:startEvent>
    <bpmn:businessRuleTask id="Task_rate" name="Freigabestufe aus Betrag und Kostenstelle ermitteln">
      <bpmn:incoming>f0</bpmn:incoming><bpmn:outgoing>f1</bpmn:outgoing>
    </bpmn:businessRuleTask>
    <bpmn:exclusiveGateway id="Gate_1" name="Freigabe erforderlich?">
      <bpmn:incoming>f1</bpmn:incoming><bpmn:outgoing>f2</bpmn:outgoing>
    </bpmn:exclusiveGateway>
    <bpmn:userTask id="Task_pay" name="Zahlung an den Lieferanten freigeben">
      <bpmn:incoming>f2</bpmn:incoming><bpmn:outgoing>f3</bpmn:outgoing>
    </bpmn:userTask>
    <bpmn:endEvent id="End_1" name="Zahlung abgeschlossen"><bpmn:incoming>f3</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="f0" sourceRef="Start_1" targetRef="Task_rate"/>
    <bpmn:sequenceFlow id="f1" sourceRef="Task_rate" targetRef="Gate_1"/>
    <bpmn:sequenceFlow id="f2" sourceRef="Gate_1" targetRef="Task_pay"/>
    <bpmn:sequenceFlow id="f3" sourceRef="Task_pay" targetRef="End_1"/>
  </bpmn:process>
  <bpmndi:BPMNDiagram id="D"><bpmndi:BPMNPlane id="P" bpmnElement="beschaffung">
    <bpmndi:BPMNShape id="Start_1_di" bpmnElement="Start_1"><dc:Bounds x="160" y="200" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_rate_di" bpmnElement="Task_rate"><dc:Bounds x="280" y="178" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Gate_1_di" bpmnElement="Gate_1"><dc:Bounds x="440" y="193" width="50" height="50"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="Task_pay_di" bpmnElement="Task_pay"><dc:Bounds x="550" y="178" width="100" height="80"/></bpmndi:BPMNShape>
    <bpmndi:BPMNShape id="End_1_di" bpmnElement="End_1"><dc:Bounds x="720" y="200" width="36" height="36"/></bpmndi:BPMNShape>
    <bpmndi:BPMNEdge id="f0_di" bpmnElement="f0"><di:waypoint x="196" y="218"/><di:waypoint x="280" y="218"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f1_di" bpmnElement="f1"><di:waypoint x="380" y="218"/><di:waypoint x="440" y="218"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f2_di" bpmnElement="f2"><di:waypoint x="490" y="218"/><di:waypoint x="550" y="218"/></bpmndi:BPMNEdge>
    <bpmndi:BPMNEdge id="f3_di" bpmnElement="f3"><di:waypoint x="650" y="218"/><di:waypoint x="720" y="218"/></bpmndi:BPMNEdge>
  </bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;

      // One instance, parked on the user task with an incident, having already been
      // through the decision. That is every badge the live view draws, on a diagram
      // small enough to reason about: the decision badge on the rule task, the token
      // count on both tasks and the start event, the incident and the "Open task"
      // pill on the user task.
      const incidents = [{
        elementInstanceKey: "1001", processInstanceKey: INST, processDefKey: DEF,
        processId: "beschaffung", jobKey: "5001", elementId: "Task_pay", elementIndex: 3,
        type: "job", raisedAt: ns(T + 4000), message: "die Freigabe konnte nicht zugestellt werden",
      }];

      const instances = [{
        key: Number(INST), processDefKey: DEF, state: "active", createdAt: ns(T),
        variables: [{ name: "betrag", value: "4200", kind: "number" }],
      }];

      const tasks = [{
        key: 8001, processInstanceKey: INST, processDefKey: DEF, elementId: "Task_pay",
        name: "Zahlung an den Lieferanten freigeben", state: "created", createdAt: ns(T + 3000),
      }];

      const decisions = [{
        key: 9001, processInstanceKey: INST, elementId: "Task_rate",
        decisionId: "freigabestufe", decisionName: "Freigabestufe", evaluatedAt: ns(T + 2000),
        output: "\"Stufe 2\"",
      }];

      const api = async (method, url) => {
        if (method !== "GET") return {};
        if (url === "/api/v1/processes") {
          // Stamped: this definition's drawing was adjusted after it was deployed
          // (ADR-0251), which the live view says out loud —
          // the two halves of the same complaint meet on this screen.
          return [{
            key: DEF, processId: "beschaffung", name: "Beschaffung", version: 1,
            diagramUpdatedAt: 1_756_900_000, diagramUpdatedBy: "u-patrick",
          }];
        }
        if (/\/processes\/\d+\/xml$/.test(url)) return XML;
        if (url.startsWith("/api/v1/instances?process=")) {
          const state = new URL(url, location.origin).searchParams.get("state");
          return state === "finished" ? [] : instances;
        }
        if (/\/instances\/\w+\/decisions$/.test(url)) return decisions;
        if (/\/instances\/\w+\/variables$/.test(url)) return { betrag: 4200 };
        if (/\/instances\/\w+\/data-objects$/.test(url)) return [];
        if (url === "/api/v1/tasks") return tasks;
        if (url.includes("/runtime")) {
          return {
            instances: 1, finished: 0, tokens: 1,
            incidents, incidentsTruncated: false,
            elements: [
              { elementId: "Start_1", type: "bpmn:StartEvent", tokens: 0, visits: 1, incidents: 0 },
              { elementId: "Task_rate", type: "bpmn:BusinessRuleTask", tokens: 0, visits: 1, incidents: 0 },
              { elementId: "Gate_1", type: "bpmn:ExclusiveGateway", tokens: 0, visits: 1, incidents: 0 },
              { elementId: "Task_pay", type: "bpmn:UserTask", tokens: 1, visits: 1, incidents: 1 },
              { elementId: "End_1", type: "bpmn:EndEvent", tokens: 0, visits: 0, incidents: 0 },
            ],
          };
        }
        return {};
      };

      const apiRaw = async (method, url, body) => ({
        data: await api(method, url, body),
        headers: new Headers(),
      });

      window.__mountLive = (instance) =>
        mountLive(view, { api, apiRaw, toast: noop, key: DEF, instance });
      window.__ready = true;
    </script>
  </body>
</html>
