<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Atlas secret shape e2e harness</title>
    <!-- Drives the real api/web/secret-shapes.js the way the Secrets panel does: a
         name identifies which connector resolves the reference, that connector says
         what shape the value must have, and the form refuses a value that cannot be
         it. The page scaffolding is the test's own (app.js boots the whole console on
         import and cannot be loaded here), so this proves the module and the shape of
         the interaction, not app.js's wiring of it. -->
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="card" style="padding: 18px; max-width: 640px">
      <label class="field"
        ><span>Name</span><input id="name" placeholder="risk_token"
      /></label>
      <div id="hint"></div>
      <div id="value-slot"></div>
      <p class="secret-error" id="error" hidden></p>
      <button class="btn" id="save" type="button">Save value</button>
      <p id="saved" hidden></p>
    </div>
    <script type="module">
      import {
        secretShapeFor,
        checkSecretValue,
        secretHintHTML,
        secretValueFieldHTML,
      } from "/secret-shapes.js";

      // The connectors the console would have loaded — one per shape worth covering.
      const connectors = [
        { name: "Patrick Blumer", kind: "mail", provider: "gmail", credentialsRef: "gmail_auth" },
        { name: "aws-ses-us-east-1", kind: "mail", provider: "smtp", credentialsRef: "aws-ses-token-01" },
        { name: "graph-mail", kind: "mail", provider: "microsoft", credentialsRef: "graph_bundle" },
        { name: "sp-list", kind: "sharepoint", provider: "", credentialsRef: "sharepoint_auth" },
        { name: "helix", kind: "remedy", provider: "", credentialsRef: "remedy_creds" },
        { name: "acme-jira", kind: "jira", provider: "", credentialsRef: "jira_acme" },
        { name: "clio.blumer.cloud", kind: "clio", provider: "", credentialsRef: "clio-token" },
      ];

      const nameIn = document.getElementById("name");
      const hint = document.getElementById("hint");
      const valueSlot = document.getElementById("value-slot");
      const error = document.getElementById("error");
      const saved = document.getElementById("saved");
      let shape = null;

      const sync = () => {
        const next = secretShapeFor(connectors, nameIn.value.trim());
        const kindChanged = Boolean(next && next.skeleton) !== Boolean(shape && shape.skeleton);
        shape = next;
        hint.innerHTML = nameIn.value.trim() ? secretHintHTML(shape) : "";
        if (kindChanged || !valueSlot.innerHTML) valueSlot.innerHTML = secretValueFieldHTML(shape);
      };
      nameIn.addEventListener("input", sync);
      hint.addEventListener("click", (e) => {
        if (!e.target.closest("[data-fill]") || !shape) return;
        document.querySelector('[name="value"]').value = JSON.stringify(shape.skeleton, null, 2);
      });
      document.getElementById("save").addEventListener("click", () => {
        const value = document.querySelector('[name="value"]').value;
        const problem = checkSecretValue(shape, value);
        error.hidden = !problem;
        error.textContent = problem;
        saved.hidden = Boolean(problem);
        saved.textContent = problem ? "" : "saved";
      });

      sync();
      window.__ready = true;
    </script>
  </body>
</html>
