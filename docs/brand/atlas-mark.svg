<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Atlas">
  <title>Atlas</title>
  <!-- Black tile: the durable ground Atlas stands on. Fixed colours (no theme
       dependency) so the mark reads on any background, light or dark. -->
  <rect width="256" height="256" rx="56" fill="#000"/>
  <!-- The peak Atlas bears, carrying the Swiss cross: one white shape, with the
       base notch and the cross cut out of it (evenodd). No strokes, no fine
       detail — it survives down to a 16px favicon. -->
  <path fill="#fff" fill-rule="evenodd"
        d="M128 34 236 206 20 206Z
           M128 166 174 206 82 206Z
           M115 77H141V102H166V128H141V153H115V128H90V102H115Z"/>
</svg>
