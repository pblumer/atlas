<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <radialGradient id="bg" cx="80%" cy="10%" r="110%">
      <stop offset="0%" stop-color="#1A2230"/>
      <stop offset="55%" stop-color="#0F1520"/>
      <stop offset="100%" stop-color="#0A0E15"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#3E86F5" stroke-width="1" opacity="0.07"/>
    </pattern>
    <radialGradient id="gridfade" cx="78%" cy="12%" r="80%">
      <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm"><rect width="1200" height="630" fill="url(#gridfade)"/></mask>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gm)"/>

  <!-- The atlas mark, scaled from the 256 grid. The card ground is already dark,
       so the glyph carries it alone — no tile. -->
  <g transform="translate(69,113) scale(1.42)" fill="#F4F7FB">
    <path fill-rule="evenodd" d="M40 156a60 60 0 1 0 120 0a60 60 0 1 0 -120 0ZM69 156a31 31 0 1 0 62 0a31 31 0 1 0 -62 0Z"/>
    <path d="M131 96h29v120h-29Z"/>
    <path d="M182.5 51H197.5V68.5H215V83.5H197.5V101H182.5V83.5H165V68.5H182.5Z"/>
  </g>

  <!-- Wordmark + copy -->
  <text x="486" y="266" fill="#EEF1F5" font-size="110" font-weight="800" letter-spacing="14">atlas</text>
  <text x="489" y="330" fill="#C7CFDA" font-size="30" font-weight="500">A durable, high-throughput BPMN&#8202;2.x</text>
  <text x="489" y="372" fill="#C7CFDA" font-size="30" font-weight="500">workflow engine in Go.</text>
  <text x="489" y="430" fill="#6BA6FF" font-size="21" font-family="monospace" letter-spacing="1">event-sourced · single-writer · group-commit</text>

  <line x1="96" y1="536" x2="1104" y2="536" stroke="#2A6BE0" stroke-width="1" opacity="0.45"/>
  <text x="96" y="580" fill="#8892A0" font-size="21" font-family="monospace">github.com/pblumer/atlas</text>
  <text x="1104" y="580" fill="#8892A0" font-size="21" font-family="monospace" text-anchor="end">bears the load · never drops a token</text>
</svg>
