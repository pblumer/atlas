name: Release

# Cut a release by pushing a semver tag:
#
#   git tag -a v0.1.0 -m "Atlas v0.1.0" && git push origin v0.1.0
#
# This builds the single binary for every supported platform, stamps the tag
# into the version string via -ldflags (see api.Version / mcp.serverVersion),
# and publishes a GitHub Release with the archives and a SHA256SUMS file.
#
# The binary embeds the web UI (go:embed) and is pure Go with no CGO, so every
# target cross-compiles from the linux runner — no per-OS runner needed.
#
# workflow_dispatch builds the artifacts for a dry run but publishes nothing
# (there is no tag to release against).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          # Version is the tag without the leading "v"; a manual dispatch (no tag)
          # falls back to a dev string so the dry-run build still stamps something.
          ref="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${ref#v}"
          else
            version="0.0.0-dev+${GITHUB_SHA::12}"
          fi
          mod="github.com/pblumer/atlas"
          ldflags="-s -w -X ${mod}/api.Version=${version} -X ${mod}/mcp.serverVersion=${version}"

          bin="atlas"
          [ "${GOOS}" = "windows" ] && bin="atlas.exe"
          go build -trimpath -ldflags "${ldflags}" -o "${bin}" ./cmd/atlas

          name="atlas_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          cp "${bin}" "dist/${name}/"
          cp LICENSE README.md CHANGELOG.md "dist/${name}/"

          mkdir -p out
          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -qr "../out/${name}.zip" "${name}")
          else
            tar -czf "out/${name}.tar.gz" -C dist "${name}"
          fi
          (cd out && sha256sum * > "${name}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/*
          retention-days: 7

  release:
    name: publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble checksums
        run: |
          set -euo pipefail
          cd artifacts
          cat *.sha256 > SHA256SUMS
          rm -f *.sha256
          echo "Release assets:"
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Every 0.x tag is a prerelease: the pre-1.0 API is explicitly not
          # stable (see CHANGELOG). Drop this flag when cutting the 1.0 line.
          prerelease="--prerelease"
          notes="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md) for what is in this release."
          gh release create "${TAG}" \
            --title "Atlas ${TAG}" \
            --notes "${notes}" \
            ${prerelease} \
            artifacts/*
