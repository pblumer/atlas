name: Release

# Cut a release by pushing a semver tag, e.g.:
#   git tag -a v0.1.0 -m "Atlas v0.1.0" && git push origin v0.1.0
# This cross-compiles the single self-contained binary (the web UI is embedded
# via go:embed, so no separate frontend build is needed — see ADR-0011),
# packages one archive per platform with a SHA256SUMS manifest, and publishes a
# GitHub Release with those assets attached.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload its assets

jobs:
  release:
    name: Build binaries · publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags + full history for version stamping and notes

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Guard: never publish a release from a tag whose code doesn't build,
      # test, or format cleanly. Same gate as CI (AGENTS.md).
      - name: Verify build, vet, format, race tests
        run: |
          go build ./...
          go vet ./...
          out="$(gofmt -l .)"; if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
          go test -race ./...

      - name: Build, package, checksum
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          commit="$(git rev-parse --short=12 HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.version=${VERSION} -X main.commit=${commit} -X main.date=${date}"
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${p%/*}"; arch="${p#*/}"
            bin="atlas"; [ "$os" = windows ] && bin="atlas.exe"
            stage="atlas_${VERSION}_${os}_${arch}"
            mkdir -p "dist/${stage}"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "$ldflags" -o "dist/${stage}/${bin}" ./cmd/atlas
            cp LICENSE README.md "dist/${stage}/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "${stage}.zip" "${stage}")
            else
              tar -czf "dist/${stage}.tar.gz" -C dist "${stage}"
            fi
            rm -rf "dist/${stage}"
          done
          (cd dist && sha256sum atlas_* > SHA256SUMS.txt)
          ls -la dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            --title "Atlas ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
