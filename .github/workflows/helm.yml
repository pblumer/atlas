name: Chart

# Lints and render-tests the Helm chart so a broken template or values schema is
# caught in CI, not at `helm install` time.
on:
  push:
    branches: [main]
    paths: ['deploy/helm/**', '.github/workflows/helm.yml']
  pull_request:
    branches: [main]
    paths: ['deploy/helm/**', '.github/workflows/helm.yml']

permissions:
  contents: read

jobs:
  lint:
    name: lint · template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint (defaults)
        run: helm lint deploy/helm/atlas

      - name: Lint (auth + ingress + persistence off)
        run: |
          helm lint deploy/helm/atlas \
            --set atlas.auth.enabled=true \
            --set atlas.auth.password=ci-password \
            --set ingress.enabled=true \
            --set persistence.enabled=false

      - name: Render templates
        run: |
          helm template ci deploy/helm/atlas > /dev/null
          helm template ci deploy/helm/atlas \
            --set atlas.auth.enabled=true \
            --set atlas.auth.existingSecret=atlas-admin \
            --set ingress.enabled=true \
            --set persistence.existingClaim=atlas-data > /dev/null

      - name: Reject auth without a password source
        run: |
          if helm template ci deploy/helm/atlas --set atlas.auth.enabled=true > /dev/null 2>&1; then
            echo "expected rendering to fail when auth is enabled with no password source"
            exit 1
          fi
          echo "correctly rejected"
