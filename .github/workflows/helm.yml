name: Chart

# Lints and render-tests the Helm chart so a broken template or values schema is
# caught in CI, not at `helm install` time.
on:
  push:
    branches: [main]
    paths: ['deploy/helm/**', '.github/workflows/helm.yml']
  pull_request:
    branches: [main]
    paths: ['deploy/helm/**', '.github/workflows/helm.yml']

permissions:
  contents: read

jobs:
  lint:
    name: lint · template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint (defaults)
        run: helm lint deploy/helm/atlas

      - name: Lint (auth + ingress + persistence off)
        run: |
          helm lint deploy/helm/atlas \
            --set atlas.auth.enabled=true \
            --set atlas.auth.password=ci-password \
            --set ingress.enabled=true \
            --set persistence.enabled=false

      - name: Render templates
        run: |
          helm template ci deploy/helm/atlas > /dev/null
          helm template ci deploy/helm/atlas \
            --set atlas.auth.enabled=true \
            --set atlas.auth.existingSecret=atlas-admin \
            --set ingress.enabled=true \
            --set persistence.existingClaim=atlas-data > /dev/null

      # Auth is on by default (ADR-draft-auth-on-by-default), so the defaults render
      # above already covers the on case. What is worth pinning is which of the two
      # credential paths each configuration takes: with no source the chart must omit
      # the admin environment entirely — there is no Secret to read, and referencing a
      # key that was never created is a pod that will not start — and the server seeds
      # itself with a generated password instead. This step used to assert that the
      # chart refused to render at all, which was right while auth was opt-in and
      # would now fail the default path.
      - name: Admin credentials come from a source, or not at all
        run: |
          helm template ci deploy/helm/atlas > /tmp/no-source.yaml
          if grep -q ATLAS_ADMIN_PASSWORD /tmp/no-source.yaml; then
            echo "with no credential source the chart must not reference an admin Secret"
            exit 1
          fi
          if ! grep -q -- '--auth=true' /tmp/no-source.yaml; then
            echo "auth must be on by default"
            exit 1
          fi

          helm template ci deploy/helm/atlas --set atlas.auth.password=ci-password > /tmp/chart-secret.yaml
          grep -q ATLAS_ADMIN_PASSWORD /tmp/chart-secret.yaml
          grep -q 'kind: Secret' /tmp/chart-secret.yaml

          helm template ci deploy/helm/atlas --set atlas.auth.existingSecret=atlas-admin > /tmp/existing.yaml
          grep -q 'name: atlas-admin' /tmp/existing.yaml

          helm template ci deploy/helm/atlas --set atlas.auth.enabled=false > /tmp/off.yaml
          grep -q -- '--auth=false' /tmp/off.yaml
          if grep -q ATLAS_ADMIN_PASSWORD /tmp/off.yaml; then
            echo "auth off must not carry admin credentials"
            exit 1
          fi
          echo "all four credential paths render as expected"
