name: Finish Panorama query slice

on:
  push:
    branches:
      - docs/panorama-graph-query-language

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/panorama-graph-query-language
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Complete implementation
        run: |
          python3 scripts/finish-panorama-query.py
          python3 scripts/finish-panorama-query-fix.py
          gofmt -w api/panorama/query_*.go

      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Race
        run: go test -race -timeout=25m ./...
      - name: Coverage
        run: ./scripts/check-coverage.sh 94
      - name: Benchmark smoke
        run: go test -run=^$ -bench=. -benchtime=1x ./benchmarks/
      - name: What's New is current
        run: |
          node scripts/whats-new/gen.mjs
          git diff --quiet -- api/web/whats-new.json
      - name: Browser dependencies
        working-directory: e2e
        run: |
          npm ci
          timeout 5m npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Browser tests
        working-directory: e2e
        run: npm test

      - name: Commit completed slice
        run: |
          rm .github/workflows/panorama-query-finish.yml
          rm scripts/finish-panorama-query.py scripts/finish-panorama-query-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(panorama): complete graph query surface"
          git push origin HEAD:docs/panorama-graph-query-language
