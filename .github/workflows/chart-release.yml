name: Publish chart

# Packages the Helm chart and pushes it to the GitHub Container Registry as an
# OCI artifact (oci://ghcr.io/<owner>/charts/atlas), so users can
# `helm install oci://ghcr.io/pblumer/charts/atlas --version <x.y.z>` without a
# repo checkout. Runs when the chart's version changes (Chart.yaml) or on demand;
# it is idempotent — an already-published version is skipped rather than failing
# (OCI tags are immutable).
on:
  push:
    branches: [main]
    paths:
      - 'deploy/helm/atlas/Chart.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: package · push (OCI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Read chart version
        id: chart
        run: |
          version="$(helm show chart deploy/helm/atlas | awk '/^version:/ {print $2}')"
          if [ -z "$version" ]; then echo "could not read chart version" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart version: $version"

      - name: Log in to GHCR
        run: helm registry login ghcr.io -u '${{ github.actor }}' --password-stdin <<<'${{ secrets.GITHUB_TOKEN }}'

      - name: Skip if this version is already published
        id: exists
        run: |
          if helm show chart "oci://ghcr.io/${{ github.repository_owner }}/charts/atlas" \
               --version "${{ steps.chart.outputs.version }}" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "atlas ${{ steps.chart.outputs.version }} is already in GHCR — skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and push
        if: steps.exists.outputs.already == 'false'
        run: |
          helm package deploy/helm/atlas --destination dist
          helm push "dist/atlas-${{ steps.chart.outputs.version }}.tgz" \
            "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Log out
        if: always()
        run: helm registry logout ghcr.io || true
