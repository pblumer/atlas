name: Render worker whitepaper PDF (temporary)
on:
  push:
    branches:
      - docs/fix-worker-whitepaper-figure-20261106
    paths:
      - .github/workflows/render-worker-whitepaper-pdf.yml
      - docs/whitepapers/atlas-worker-whitepaper.html

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF renderer
        run: python -m pip install weasyprint==68.0
      - name: Render PDF from updated HTML
        run: |
          python - <<'PY'
          from weasyprint import HTML
          from pathlib import Path
          out = Path('docs/whitepapers/atlas-worker-whitepaper.pdf')
          HTML(filename='docs/whitepapers/atlas-worker-whitepaper.html').write_pdf(str(out))
          assert out.stat().st_size > 100_000, 'unexpectedly small PDF'
          print('PDF size:', out.stat().st_size)
          PY
      - name: Commit regenerated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/whitepapers/atlas-worker-whitepaper.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate worker whitepaper PDF [skip ci]"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
