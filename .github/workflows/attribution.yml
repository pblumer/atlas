name: Commit attribution

# A commit an agent makes here is authored by the person who asked for it and
# committed by the agent (AGENTS.md § Commit attribution). The mechanism that
# arranges that is a SessionStart hook, and a hook is a thing that can quietly
# stop running: the environment variable it reads goes away, the agent's default
# identity changes, the session was started before the hook existed, or the tool
# simply does not execute project hooks in some future version. Nothing fails
# when it stops. Commits keep landing, CI keeps passing, and the only symptom is
# a contributor graph that slowly goes back to naming the agent — which is the
# kind of thing somebody notices a quarter later, if at all.
#
# It is not hypothetical: eight commits authored by `Claude <noreply@anthropic.com>`
# landed on main within four hours of the hook being merged, from sessions whose
# containers had been cloned before it existed.
#
# So the invariant is checked where it can still be repaired — on the pull
# request, before the commits are on main. Once they are on main the only remedy
# is a force-push, which is not one.
#
# This deliberately does not look at the committer or at the Co-Authored-By
# trailer. Both are supposed to name the agent; they are how the change stays
# attributable. Only the author field decides who GitHub counts.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authors:
    name: no agent-authored commits
    runs-on: ubuntu-latest
    # Reads git history and nothing else. The cap is here because every job in
    # this repository has one, not because this one can plausibly hang.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The range below needs real history on both sides, and a shallow
          # checkout has neither.
          fetch-depth: 0

      - name: Every commit names a person as its author
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Range against the *current* base branch, not the PR's recorded base
          # SHA: a branch that has merged main since it was opened would
          # otherwise be asked to answer for every commit main gained in the
          # meantime, including the ones this check is too late to fix.
          git fetch --quiet origin "$BASE_REF"

          offenders="$(git log --format='%h  %an <%ae>  %s' \
            "origin/$BASE_REF..$HEAD_SHA" \
            | grep -iE '<[^>]*@anthropic\.com>' || true)"

          if [ -z "$offenders" ]; then
            echo "Every commit this PR adds names a person as its author."
            exit 0
          fi

          cat >&2 <<MESSAGE
          These commits are authored by an agent identity:

          $offenders

          GitHub counts a commit for whoever holds the *author* address, so as
          they stand these land on main credited to the agent rather than to the
          person who asked for the change. The committer field and the
          Co-Authored-By trailer are what keep the agent's part on the record;
          the author field is not.

          To fix, on this branch:

            .claude/hooks/commit-identity.sh
            git rebase origin/$BASE_REF --exec \\
              'git commit --amend --no-edit --author="\$(git config author.name) <\$(git config author.email)>"'
            git push --force-with-lease

          Do not use 'git commit --amend --reset-author': it copies the
          *committer* onto the author, which is the agent, which is the problem.

          If the hook printed nothing, this session has no entry in
          .claude/commit-identities — add one (see the comments in that file)
          rather than working around this check.
          MESSAGE
          exit 1
