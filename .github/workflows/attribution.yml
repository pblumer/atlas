name: Commit attribution

# A commit an agent makes here is authored by the person who asked for it and
# committed by the agent (AGENTS.md § Commit attribution). The mechanism that
# arranges that is a SessionStart hook, and a hook is a thing that can quietly
# stop running: the environment variable it reads goes away, the agent's default
# identity changes, the session was started before the hook existed, or the tool
# simply does not execute project hooks in some future version. Nothing fails
# when it stops. Commits keep landing, CI keeps passing, and the only symptom is
# a contributor graph that slowly goes back to naming the agent — which is the
# kind of thing somebody notices a quarter later, if at all.
#
# It is not hypothetical: eight commits authored by `Claude <noreply@anthropic.com>`
# landed on main within four hours of the hook being merged, from sessions whose
# containers had been cloned before it existed.
#
# So the invariant is checked where it can still be repaired — on the pull
# request, before the commits are on main. Once they are on main the only remedy
# is a force-push, which is not one.
#
# Neither step looks at the committer or at the Co-Authored-By trailer. Both are
# supposed to name the agent; they are how the change stays attributable. Only
# the author field decides who GitHub counts.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  authors:
    name: no agent-authored commits
    runs-on: ubuntu-latest
    # Reads git history and asks GitHub about one commit at a time. The cap is
    # here because every job in this repository has one, not because this one
    # can plausibly hang.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The range below needs real history on both sides, and a shallow
          # checkout has neither.
          fetch-depth: 0

      - name: Every commit names a person as its author
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Range against the *current* base branch, not the PR's recorded base
          # SHA: a branch that has merged main since it was opened would
          # otherwise be asked to answer for every commit main gained in the
          # meantime, including the ones this check is too late to fix.
          git fetch --quiet origin "$BASE_REF"

          offenders="$(git log --format='%h  %an <%ae>  %s' \
            "origin/$BASE_REF..$HEAD_SHA" \
            | grep -iE '<[^>]*@anthropic\.com>' || true)"

          if [ -z "$offenders" ]; then
            echo "Every commit this PR adds names a person as its author."
            exit 0
          fi

          cat >&2 <<MESSAGE
          These commits are authored by an agent identity:

          $offenders

          GitHub counts a commit for whoever holds the *author* address, so as
          they stand these land on main credited to the agent rather than to the
          person who asked for the change. The committer field and the
          Co-Authored-By trailer are what keep the agent's part on the record;
          the author field is not.

          To fix, on this branch:

            .claude/hooks/commit-identity.sh
            git rebase origin/$BASE_REF --exec \\
              'git commit --amend --no-edit --author="\$(git config author.name) <\$(git config author.email)>"'
            git push --force-with-lease

          Do not use 'git commit --amend --reset-author': it copies the
          *committer* onto the author, which is the agent, which is the problem.
          MESSAGE
          exit 1

      # The quieter half of the same failure. An address that is not the agent's
      # still counts for nobody unless a GitHub account carries it: the name
      # shows in the log, the contributor view lists it under no one, and the
      # person it was meant to credit is missing exactly as before. This is what
      # lets the hook work without a table row for every person — it records
      # whatever address the session signs in with, and GitHub tells us here
      # whether that address can be placed. `author` on the commit API is null
      # precisely when no account holds it.
      - name: Every author resolves to a GitHub account
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          shas="$(git log --format='%H' "origin/$BASE_REF..$HEAD_SHA")"
          count="$(printf '%s\n' "$shas" | grep -c . || true)"

          # One API call per commit. A branch with more than this is a rebase or
          # an import, not a change under review, and is not worth the rate
          # limit; the offline step above still covered every commit on it.
          if [ "$count" -gt 50 ]; then
            echo "$count commits — skipping the per-commit lookup."
            exit 0
          fi

          unplaced=''
          for sha in $shas; do
            if ! login="$(gh api "repos/$REPO/commits/$sha" --jq '.author.login // ""' 2>&1)"; then
              # A rate limit or an outage is not this PR's defect, and failing
              # here would only teach people to re-run the job until it is quiet.
              echo "Could not ask GitHub about $sha ($login) — skipping this step."
              exit 0
            fi
            if [ -z "$login" ]; then
              unplaced="$unplaced$(git log -1 --format='%h  %an <%ae>  %s' "$sha")"$'\n'
            fi
          done

          if [ -z "$unplaced" ]; then
            echo "Every author on this PR resolves to a GitHub account."
            exit 0
          fi

          cat >&2 <<MESSAGE
          No GitHub account holds the author address on these commits:

          $unplaced
          They would land on main credited to nobody. GitHub attributes a commit
          only to an account that carries its author address; a name alone is
          not an attribution.

          Two ways out, either is fine:

            - add the address to your GitHub account (Settings -> Emails), or
            - map your sign-in address in .claude/commit-identities to one the
              account already carries — its primary address, or
              <id>+<login>@users.noreply.github.com.

          Then re-author the commits on this branch:

            .claude/hooks/commit-identity.sh
            git rebase origin/$BASE_REF --exec \\
              'git commit --amend --no-edit --author="\$(git config author.name) <\$(git config author.email)>"'
            git push --force-with-lease
          MESSAGE
          exit 1
