name: Build applications whitepaper PDFs (temporary)
on:
  push:
    branches: ['docs/atlas-applications-whitepaper-20261106']
    paths:
      - 'docs/whitepapers/atlas-applikationen.html'
      - '.github/workflows/atlas-applications-whitepaper-build.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/atlas-applications-whitepaper-20261106
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'weasyprint==68.0'
      - name: Convert HTML to both A4 PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from weasyprint import HTML
          root = Path('docs/whitepapers')
          html = (root/'atlas-applikationen.html').read_text()
          def flatten(source, light=False):
              palette = ({'ink':'#f1f5fa','panel':'#ffffff','panel2':'#ecf3fa','line':'#c5d3e2','muted':'#233247','white':'#0d1b2c','blue':'#234d83','mint':'#245c4c'} if light else {'ink':'#090f1c','panel':'#101c2e','panel2':'#17263b','line':'#2d4058','muted':'#9bb0cc','white':'#f4f7ff','blue':'#b8d7ff','mint':'#b8e5cd'})
              def tweak(match):
                  tag = match.group(0)
                  classes = re.search(r'class="([^"]+)"',tag)
                  cl = classes.group(1) if classes else ''
                  props = ''
                  if tag.startswith('<rect class="node'):
                      shade='panel2' if any(x in cl for x in ['strong','mint','light']) else 'panel'
                      edge='mint' if 'mint' in cl else ('blue' if 'strong' in cl else 'line')
                      props = f' fill="{palette[shade]}" stroke="{palette[edge]}" stroke-width="2"'
                  elif tag.startswith('<text class="node-title'): props=f' fill="{palette["white"]}"'
                  elif tag.startswith('<text class="node-sub') or tag.startswith('<text class="annotation'): props=f' fill="{palette["muted"]}"'
                  elif tag.startswith('<text class="lane'): props=f' fill="{palette["mint"]}"'
                  elif tag.startswith('<path class="arrowhead'): props=f' fill="{palette["blue"]}"'
                  elif tag.startswith('<path class="arrow"'): props=f' fill="none" stroke="{palette["blue"]}" stroke-width="2.3"'
                  elif tag.startswith('<path fill="currentColor"'): tag=tag.replace('fill="currentColor"',f'fill="{palette["white"]}"')
                  if props:
                      cssval=';'.join(f'{k}:{v}' for k,v in re.findall(r'(fill|stroke|stroke-width)="([^"]+)"',props))
                      if ' style="' in tag:
                          tag=tag.replace(' style="',' style="'+cssval+';',1)
                      else:
                          ending='/>' if tag.endswith('/>') else '>'
                          tag=tag[:-len(ending)]+f' style="{cssval}"'+ending
                      ending='/>' if tag.endswith('/>') else '>'
                      tag=tag[:-len(ending)]+props+ending
                  if tag.startswith('<path fill='):
                      tag=tag.replace('fill="'+palette['white']+'"',f'fill="{palette["white"]}" style="fill:{palette["white"]}"')
                  return tag
              return re.sub(r'<(?:rect|text|path)\b[^>]*>',tweak,source).replace('system-ui', '"DejaVu Sans"')
          HTML(string=flatten(html),base_url=str(root.resolve())).write_pdf(str(root/'atlas-applikationen-dark.pdf'))
          HTML(string=flatten(html.replace('<html lang="de-CH">','<html lang="de-CH" class="print-light">'),True),base_url=str(root.resolve())).write_pdf(str(root/'atlas-applikationen-print.pdf'))
          PY
      - name: Validate PDF fonts and rendering
        run: |
          set -eu
          for f in docs/whitepapers/atlas-applikationen-dark.pdf docs/whitepapers/atlas-applikationen-print.pdf; do
            pdffonts "$f" > /tmp/embedded-fonts.txt 2> /tmp/pdf-font-errors.txt
            if test -s /tmp/pdf-font-errors.txt; then cat /tmp/pdf-font-errors.txt; exit 1; fi
            if grep -Ei 'Cantarell|Type 0C|\\bno\\s+yes' /tmp/embedded-fonts.txt; then
              echo "Broken or non-TrueType font detected in $f"; exit 1
            fi
            pdfinfo "$f" | grep -q 'Pages:'
            pdftoppm -f 1 -l 1 -scale-to 300 -png -singlefile "$f" /tmp/atlas-preview
            test -s /tmp/atlas-preview.png
            pdftotext "$f" /tmp/atlas-text.txt
            grep -iq 'Applikationen' /tmp/atlas-text.txt
          done
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/whitepapers/atlas-applikationen-dark.pdf docs/whitepapers/atlas-applikationen-print.pdf
          git commit -m "docs: generate applications whitepaper PDFs" || exit 0
          git push origin HEAD:docs/atlas-applications-whitepaper-20261106