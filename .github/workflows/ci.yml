name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # What kind of change is this? A pull request that only touches docs/ takes the
  # `docs` job below instead of the two heavy ones, because the race detector, the
  # coverage floor, the benchmark harness and a browser cannot be moved by a markdown
  # file — and a change of two lines in an ADR paid twenty-four minutes for them.
  #
  # The gate is a job-level `if`, not a workflow-level `paths-ignore`. The difference
  # matters if these checks are ever made required: a workflow that never runs leaves
  # its check pending forever and blocks the merge, while a job skipped by `if` reports
  # as skipped, which branch protection accepts. The check names also stay put either
  # way, so nothing outside this file has to learn about the split.
  #
  # Only a pull request takes the short path. A push to main runs the full sequence
  # whatever it carries: it is the last reading before the code is the branch everyone
  # builds on, and it costs nothing anybody is waiting for.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the base of the pull request is present to diff against.
          fetch-depth: 0

      - name: Classify the diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "$EVENT: the full sequence runs, whatever changed."
            exit 0
          fi
          # --no-renames so a file moved out of docs/ lists its old path too; three dots
          # so this is what the branch changed, not what main changed underneath it.
          files="$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
          echo "Changed files:"
          echo "$files" | sed 's/^/  /'
          if [ -z "$files" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "An empty diff is not a docs change; taking the full sequence rather than guessing."
            exit 0
          fi
          if echo "$files" | grep -qv '^docs/'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Something outside docs/ changed: the full sequence."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Only docs/ changed: the docs job."
          fi

  check:
    name: build · vet · fmt · race
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Same reasoning as the e2e job below: the expensive failure mode is the hang,
    # not the error, and this job had no ceiling at all — a wedged test would have
    # held a runner for the six-hour default. The race step's per-package timeout is
    # raised below, so the cap is what keeps one stuck package from turning into
    # hours of runner time.
    #
    # The number below is a ceiling on a hang, and it stopped being one twice. First
    # at 30 with the coverage floor sequenced behind the race step: 24m30s plus
    # 3m59s of a 30-minute budget is not a ceiling but a coin toss decided by runner
    # variance, which is how it began cancelling healthy runs (main, run 2160). The
    # floor is a *second full test run* that shares nothing with this one but the
    # checkout, so it is its own job — keep it that way: if a step here ever needs a
    # second full pass over the tree, it wants a job, not a bigger number.
    #
    # Thirty was still too close afterwards. Two runs of the same tree an hour apart
    # on 2026-09-16 drew runners 51% apart — the api package alone took 1352s
    # (22m32) on one and 2048s (34m08) on the other — so this job measured ~27m on
    # the fast draw and ~39m on the slow one. Fifty is above a draw worse than any
    # observed and still ends a hang inside the hour. A cap sized to the fast draw
    # cancels the slow one with every check green, which reports as a defect and is
    # nothing but the clock.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # Not for the What's New generator — that moved to Go in e128d590 and needs no
      # Node at all. This step stays because it decides *which* node is on PATH, and
      # connector/script's sandbox test starts whichever one it finds.
      #
      # With this step that is the toolcache node, which sits outside the sandbox
      # runtime roots, so the JavaScript case skips (documented in the test as "does
      # not count as proof of anything") and Python carries the ATLAS_SANDBOX_E2E
      # requirement. Without it the test finds the image's /usr/local/bin/node, which
      # *is* inside those roots, so the case runs — and fails, because that node reads
      # /etc/ssl/openssl.cnf on startup and the strict policy does not grant it:
      #
      #     node did not start inside the strict sandbox: exit status 13
      #     OpenSSL configuration error: ... Permission denied ... /etc/ssl/openssl.cnf
      #
      # That failure is real and predates this file — removing the step is what exposes
      # it, not what causes it. It is tracked separately; keeping the step is the
      # environment CI has always had rather than a way of hiding anything, and the
      # test's own skip accounting is what keeps that honest.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      # The Console "What's New" feed is generated from CHANGELOG.md and committed
      # (ADR-0012 keeps the web UI buildless, so nothing regenerates it at build or
      # runtime). Nothing else notices when a CHANGELOG entry lands without the
      # generator having been re-run — the feed just silently stops at the last time
      # someone remembered. Re-run it here and fail on any diff.
      - name: What's New feed is up to date
        run: |
          go run ./scripts/whats-new
          if ! git diff --quiet -- api/web/whats-new.json; then
            echo "api/web/whats-new.json is stale. Run 'make whats-new' and commit the result."
            echo "(Add curated DE/EN prose in scripts/whats-new/overrides/<id>.json — see scripts/whats-new/README.md.)"
            git --no-pager diff -- api/web/whats-new.json
            exit 1
          fi

      # The api package needs far more than Go's default 10-minute *per-package*
      # timeout on its own, so the default fails the step on runner variance rather
      # than on a defect: it passed at 526s on one run and timed out at 600s on the
      # next, where the only change between them was a single line in an unrelated
      # test file. Nothing is skipped or quarantined by raising it — every test still
      # runs, and a real hang still ends the job well inside the job's cap above.
      #
      # 50m, raised from 25m, for the reason the cap above moved: api took 1352s on
      # one runner on 2026-09-16 and 2048s on another an hour later with the same
      # tree, and 25m would have failed the second of those outright. A per-package
      # timeout a passing package reaches by drawing a slow runner is not a guard
      # against hangs; it is a coin toss that reports as a defect.
      #
      # `make race` and the documented command in AGENTS.md carry the same flag, so
      # a contributor's local run matches this one. Change one and change the rest.
      - name: Test (race detector)
        env:
          # This runner can enforce the script sandbox, so the end-to-end check that an
          # interpreter really starts inside it has to run rather than skip. `go test`
          # hides skips unless it is given -v, so a guard that quietly stopped guarding
          # anything would look exactly like a guard that passed (ADR-0303).
          #
          # Deliberately not in `make race`: a contributor's kernel may have no Landlock
          # at all, and there the skip is the correct answer rather than a failure.
          ATLAS_SANDBOX_E2E: required
        run: go test -race -timeout=50m ./...

      # Smoke-run the benchmark harness (programme B): one iteration each, just to
      # prove it compiles and executes. No performance threshold is enforced on PR
      # CI — see benchmarks/README.md for how to produce a real, machine-labelled
      # baseline.
      - name: Benchmark harness smoke
        run: go test -run=^$ -bench=. -benchtime=1x ./benchmarks/

  # The repository-wide statement floor (ADR-0018), in its own job.
  #
  # It is here rather than beside the race step because it is a **second full run of
  # the test suite** — instrumented for coverage instead of for races — and the two
  # share nothing but the checkout. Sequenced behind the race detector it added four
  # minutes to a job that already needed twenty-five, and the pair outgrew the cap
  # that was supposed to catch a hang; run side by side they each finish in a
  # fraction of their own ceiling, and neither can cancel the other by being slow.
  #
  # It buys wall-clock too, which is the smaller reason and worth naming as the
  # smaller one: the two runs now overlap rather than queue. What it does not change
  # is what a contributor does — `make check` is still build, vet, fmt, race and
  # cover in sequence, because one laptop has one set of cores and splitting there
  # would buy nothing.
  #
  # Because it is a full run of the suite it sets up Node for the reason spelled out
  # at the race job's own Node step: connector/script's sandbox test runs here too
  # and starts whichever node it finds. It does *not* carry ATLAS_SANDBOX_E2E, which
  # is deliberate and matches what the single job did before the split — that
  # variable turns one skip into a required run, and one of the two passes is enough.
  cover:
    name: cover · statement floor
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # Thirty, and not the twenty this job was first given, because twenty was a
    # guess and the first run measured it: 11m04s — with the api package cut short
    # at Go's default per-package limit rather than finishing. The real figure is
    # that plus however long api needs beyond ten minutes, which nothing has
    # measured yet.
    #
    # So this is a hang-catcher with headroom it can be shown to have, rather than a
    # number sized to a figure nobody has. That is the whole lesson of the split
    # above: a cap that sits a minute above the real duration is not a ceiling, it
    # is a coin toss. Tighten it when there are green runs to tighten it against.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # See the race job's Node step: this decides which node the sandbox test starts.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Coverage floor (>= 95%, ADR-0018)
        run: ./scripts/check-coverage.sh 94

  # Everything a docs-only change can actually break, and nothing else.
  #
  # "Documentation" is not inert here. docs/adr is a Go package whose tests read every
  # record *and* every ADR-NNNN citation in the repository, so a renamed record or a
  # mistyped citation fails here exactly as it would in the full job. The guards that
  # live elsewhere and read this tree are covered too — api/releasedkinds_internal_test.go
  # parses each record's Status line, and the generator in scripts/whats-new builds the feed's
  # links from the file names in docs/adr.
  #
  # So this runs the whole test suite rather than a list of test names: an enumeration
  # would be correct on the day it was written and quietly wrong the day somebody adds
  # another test that reads docs/. What it leaves out is only the instrumentation that
  # cannot be moved by a markdown file — the race detector (no markdown ever raced), the
  # coverage floor (docs carry no statements), the benchmark smoke, and a browser.
  docs:
    name: docs · records and the guards that read them
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      # This job runs `go test ./...` as well, so it needs the same node placement the
      # race job's own Node step explains — connector/script's sandbox test does not
      # care which job it is running in.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # docs/adr carries Go (number.go and the guards), so the formatting rule reaches
      # into this tree like any other.
      - name: Format check
        run: |
          out="$(gofmt -l docs)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./docs/...

      - name: What's New feed is up to date
        run: |
          go run ./scripts/whats-new
          if ! git diff --quiet -- api/web/whats-new.json; then
            echo "api/web/whats-new.json is stale. Run 'make whats-new' and commit the result."
            git --no-pager diff -- api/web/whats-new.json
            exit 1
          fi

      # No -race and no -timeout: without the detector the api package is minutes rather
      # than a quarter of an hour, and Go's default per-package limit is ample again.
      - name: Test
        run: go test ./...

  e2e:
    name: e2e · token simulation
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # A browser job's failure mode is the hang, not the error: a stalled apt mirror or a
    # wedged browser holds the runner for the six-hour default. Well above the ~1 minute
    # this job takes, and far below "an afternoon of runner time".
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Chromium
        working-directory: e2e
        # --with-deps shells out to apt-get, so a stalled Ubuntu mirror does not fail the
        # step — it stops it, until something cancels the job (twice on 2026-08-19, once
        # for 24 minutes, without a single test having run). Bound that attempt, then fall
        # back to the browser-only install: the ubuntu-latest image already carries
        # Chromium's shared libraries, so the tests still run, and a genuinely missing one
        # surfaces as a launch error in seconds rather than as a hang.
        run: |
          timeout 5m npx playwright install --with-deps chromium \
            || npx playwright install chromium

      - name: Run browser e2e tests
        working-directory: e2e
        run: npm test
