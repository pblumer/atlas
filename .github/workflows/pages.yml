name: Pages

# Publishes the examples single-page app to GitHub Pages, so the order-to-cash
# demo opens straight from a github.io URL. The app is self-contained (no build),
# so the job just assembles a small site directory and deploys it.
#
# Beside it, under hub/, the job publishes the atlas hub sample registry: every
# installable example as a signed Blueprint Registry v1 package (ADR-0499),
# built by `atlas hub build` from examples/ and examples/hub/releases.json. An
# installation lists and imports them once its operator sets
#
#   ATLAS_BLUEPRINT_REGISTRY_URL=https://<owner>.github.io/<repo>/hub/index.json
#   ATLAS_BLUEPRINT_REGISTRY_KEY=<the publicKey recorded in examples/hub/releases.json>
#
# The private signing key is the repository secret ATLAS_HUB_SIGNING_KEY (what
# `atlas hub keygen` wrote). Without it the registry is not published and the
# rest of the site still is; with it, a build whose samples changed without a
# recorded version fails, so a published version never changes its content.
#
# One-time enablement: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". After that this runs on every push to main that touches
# examples/, and the site is served at https://<owner>.github.io/<repo>/.

on:
  push:
    branches: [main]
    paths:
      - 'examples/**'
      - 'api/web/examples-catalog.json'
      - 'api/blueprintregistry/**'
      - 'cmd/atlas/hub.go'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Assemble site
        run: |
          mkdir -p _site
          # The order-to-cash app is the site root, so the Pages URL opens it directly.
          cp examples/order-to-cash-app.html _site/index.html
          # Ship the BPMN models alongside so they can be linked/downloaded.
          cp examples/*.bpmn _site/ 2>/dev/null || true

      - name: Build the signed atlas hub sample registry
        env:
          ATLAS_HUB_SIGNING_KEY: ${{ secrets.ATLAS_HUB_SIGNING_KEY }}
        run: |
          if [ -z "$ATLAS_HUB_SIGNING_KEY" ]; then
            echo "::notice::ATLAS_HUB_SIGNING_KEY is not set; the atlas hub registry is not published"
            exit 0
          fi
          go run ./cmd/atlas hub build _site/hub

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
